allocation_rules:
  - rule_id: physical_first
    applies_to: "all_nodes"
    rule: "First retain a complete unallocated physical event ledger by unique event/node/period, including every input/output/stock/loss and zero-output event. Only then apply documented output attribution; allocated quantities must never be used to claim physical mass-balance closure."
    source_ids: []
  - rule_id: outputs
    applies_to: "sort; support"
    rule: "Enumerate all independently intended live grades/retained other catch and actual useful recovery outputs, each with independent handoff. Avoid allocation by separate measured operations first; for inseparable burdens justify causal physical attribution from current records, and use economic attribution only when physical relation is not supportable and contemporaneous prices/uncertainty are disclosed. No default mass fraction, price or substitution credit."
    source_ids: []
  - rule_id: nonproducts
    applies_to: "all_nodes"
    rule: "Discard, dead/rejected waste, incidental debris, internal feed and the same lot at successive handoffs are not automatically co-products. Keep their quantities and treatment in the physical ledger and associated burdens with intended outputs under the reviewed attribution decision."
    source_ids: []
  - rule_id: shared_assets
    applies_to: "support"
    rule: "For each real shared vessel, hookah, tank, container or service list every consuming node and period, actual utilization/idle phases, manufacture, maintenance/replacement, loss and end-of-life. Allocate once using justified service/use records; retain full life-phase and remaining/terminated share reconciliation. A single consumer is not fabricated into shared infrastructure. No assumed lifetime or annualization."
    source_ids: []
  - rule_id: transfers
    applies_to: "all_nodes"
    rule: "Match physical animal, usable-water and residual transfers before attribution. Carry inherited lot burden once to its actual destination, never re-buy an internal input or count internal output as final. Separate reporting-period stock carryover from new catch and retain explicit ownership of treatment and loss events."
    source_ids: []
  - rule_id: normalization
    applies_to: "all_nodes"
    rule: "After physical reconciliation and reviewed attribution, divide attributable exchange quantity by accepted net reference animal mass of the same covered lots. Reconcile actual losses and transferred stock; do not force intermediate animal feeds to 1 kg. Retain/resolve zero-output periods explicitly before forming a positive-output reporting denominator."
    source_ids:
      - mass-normalization-identity
dataset_production:
  collection_protocols:
    - protocol_id: cp_capture
      process_id: "capture"
      flow_role: "Natural rocky reef to raw live captured lot; include complete support-vessel trip and diver air compressor operation"
      record_type: "Measured traceable raw records and calculation evidence"
      raw_fields: "Unique event/trip/lot/node/period/site and operation/resource responsibility; species/live state; actual conditional operations; opening/closing stocks; transfer id/sender/recipient/quantity basis; actual supply substance/property/unit/quantity and inclusive service boundary; emission substance/cause/fossil share/receiving compartment; inputs/outputs/losses/destinations; attribution evidence and independent U_row_id basis; full departure/search/capture/return and unsuccessful trips; breathing-air volume/mass, actual temperature/pressure/humidity/composition/density evidence, engine/compressor tank records, encounter/return records"
      collection_method: "Use calibrated/traceable measurements, logs, stocks, supplier and transfer records; cross-check sender/recipient; use measured or record-supported emission methods; retain raw quantities/gaps without invented factors"
      unit: "kg, kWh; independently verify any other actual native unit and retain conversion evidence"
      frequency: "Each event/transfer; reconcile each trip/lot and reporting period"
      temporal_coverage: "All selected trips, zero output, carryover and complete relevant asset phases"
      site_scope: "Actual node operation sites and associated upstream/recipient interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw logs, invoices/service boundaries, matched transfers, stock balance, emission methods, attribution decisions and independent upper-bound evidence"
    - protocol_id: cp_prepare
      process_id: "prepare"
      flow_role: "Actual captured live whole state to prepared live whole lot; no shucking or preservation resources owned here"
      record_type: "Measured traceable raw records and calculation evidence"
      raw_fields: "Unique event/trip/lot/node/period/site and operation/resource responsibility; species/live state; actual conditional operations; opening/closing stocks; transfer id/sender/recipient/quantity basis; actual supply substance/property/unit/quantity and inclusive service boundary; emission substance/cause/fossil share/receiving compartment; inputs/outputs/losses/destinations; attribution evidence and independent U_row_id basis; actual debris-removal/washing method, animal masses before/after and removed-material destinations"
      collection_method: "Use calibrated/traceable measurements, logs, stocks, supplier and transfer records; cross-check sender/recipient; use measured or record-supported emission methods; retain raw quantities/gaps without invented factors"
      unit: "kg, kWh; independently verify any other actual native unit and retain conversion evidence"
      frequency: "Each event/transfer; reconcile each trip/lot and reporting period"
      temporal_coverage: "All selected trips, zero output, carryover and complete relevant asset phases"
      site_scope: "Actual node operation sites and associated upstream/recipient interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw logs, invoices/service boundaries, matched transfers, stock balance, emission methods, attribution decisions and independent upper-bound evidence"
    - protocol_id: cp_sort
      process_id: "sort"
