  calculation_rules:
    - id: physical_ledger
      applies_to: "all inventory rows"
      rule: "Reconcile opening stock, actual entries/exits, losses and closing stock by unique event/node first; retain uncertainty and never close physical balance using allocated ledgers."
      inputs:
        - cp_capture
        - cp_prepare
        - cp_sort
        - cp_preserve
        - cp_present
        - cp_handover
        - cp_support
      output: "Complete unallocated physical ledger"
      source_ids: []
    - id: attribution_once
      applies_to: "all inventory rows"
      rule: "Separate measured operations first; attribute inseparable shared events, asset periods and intended outputs once using reviewed relationships; retain all shares/unassigned remainder without re-adding inherited burdens."
      inputs:
        - "Physical ledger"
        - "attribution evidence"
        - "consumers/periods"
      output: "Uniquely attributable exchange quantities by intended output"
      source_ids: []
    - id: normalize_records
      applies_to: "all inventory rows"
      rule: "Only after positive accepted net reference animal mass and reconciled physical/attribution ledgers, divide each attributable exchange quantity by that net mass of the same covered lots; internal feeds remain actual and zero-output events remain explicitly attributed."
      inputs:
        - cp_handover
        - "attributable exchange quantities"
      output: "Inventory per 1 kg reference flow"
      source_ids:
        - mass-normalization-identity
  data_quality_requirements:
    - id: identity_context
      applies_to: "reference_product"
      requirement: "Record species, wild reef geography, actual hookah hand route, live whole native-shell state and first physical gate; do not generalize species or legal limits."
      evidence: "Raw capture and acceptance records"
    - id: coverage_complete
      applies_to: "all_nodes"
      requirement: "Cover all successful/failed trips, stocks/carryover, actual conditional operations, rejects/losses, capital and inclusive service boundaries; missing is not zero."
      evidence: "Period completeness and event/stock reconciliation"
    - id: independent_evidence
      applies_to: "all_inventory_rows"
      requirement: "Independently verify identity, unit and independent range evidence for each nonreference card; unknown U blocks quantitative finalization and candidate guidance does not replace measurements."
      evidence: "Per-exchange details/support and independent upper-bound approval"
    - id: translation_projection
      applies_to: "all_sections"
      requirement: "Compare EN/ZH/generated projection card-by-card and rule-by-rule, preserving stable ids, constants and evidence limits."
      evidence: "Content review and target checks"
