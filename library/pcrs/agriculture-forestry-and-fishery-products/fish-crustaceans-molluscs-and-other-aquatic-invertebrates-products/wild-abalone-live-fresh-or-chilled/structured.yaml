      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Natural-rocky-reef wild blacklip abalone and actual predeparture vessel/hookah resource state in the declared period |\n| starting_condition_role | Natural capture context and foreground start, not farming or purchased animals |\n| product_classification_scope | CPC 3.0 04411; narrower Haliotis rubra live whole hookah route |\n| recursive_input_rule | No same-category purchased reference-animal substitution; model ancillary supplies with independent upstream boundaries |\n| upstream_dataset_requirement | Actual fuel, electricity, material, service and capital supplies require upstream datasets matching geography, technology, time and inclusive boundary |\n| disclosure | Disclose actual location, period, trips, conditional nodes, state/gate, stocks/losses, asset/service boundaries, attribution and unknown evidence; no legal/sustainability certification claim |\n\n### Boundary Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `scope` | all_nodes | Use only wild Haliotis rubra hand-removed from natural rocky reef by hookah with surface-supplied breathing air, alive and whole at first physical acceptance. No hatchery/reseeding/ranching, farmed supply, scuba/free-dive substitution, shucking, cooked/frozen/dead reference, or processor/live-export operations after acceptance. | nsw-abalone-fishery; vfa-abalone-fishing |\n| `gate` | handover | The gate is first HARVESTER physical recipient acceptance, not invoice date, title transfer or processor dispatch. Include the full capture-vessel return in capture and actual subsequent harvester shore movement in handover exactly once; exclude buyer activities after acceptance. |  |\n| `operation_responsibility` | all_nodes | Direct foreground operation/resource responsibility is independent of legal asset ownership. Rented or contracted equipment under foreground operational/resource control is inventoried directly; a supplier-inclusive service is linked once and must not receive duplicate supplier fuel, emissions or capital. |  |\n| `actual_nodes` | prepare; preserve; present; handover | Conditioning is only actual external debris removal/washing, distinct from capture and live preservation. Preserve owns any actual harvester live-preservation intervention after capture and before first physical acceptance outside actual delivery transportation, including onboard unsorted holding and holding after presentation. It may overlap preparation, sorting or presentation. These nodes are a responsibility graph, not a forced serial chronology; use real time-indexed instances, before/after states and actual handoffs. Same-activity phases without a real handoff remain subledgers, never duplicate animal transfers or inherited burdens. Handover alone owns actual delivery-transport live support. Presentation owns packaging/protection, not distribution. No mandatory depuration, growth, feeding or readiness-to-eat certification. Bypass inactive nodes according to actual records. |  |\n| `stocks_periods` | all_nodes | Index trips, batches, calendar/reporting periods, animal/water/fuel stocks and capital phases. Retain departure, search, unsuccessful trips, returns, idle/support events, cleaning/changeover, carryover, repairs and termination. Zero accepted output never erases physical events or creates division by zero. |  |\n| `water` | all_nodes | Only environmental intake is elementary uptake; supplied water is product input. Pair actual cross-node usable-water transfers as product output/input and contained wastewater transfers as waste output/input. Same-node recirculation and stock motion stay in subledgers. Final treatment owner records environmental water outlet and substance-specific emissions once. |  |\n| `material_card_precedence` | all_nodes | Each actual material issue/event is instantiated once under the most specific applicable card: preserve_holding_supplies for non-transport preservation consumables and present_packaging for packaging take precedence over generic materials. Generic materials contain only the remaining actual issues. Support asset records retain capital/reusable life phases and replacements without re-charging the same consumable/event already recorded elsewhere. The same coolant issue cannot appear simultaneously as holding supply, generic material and asset consumption. |  |\n| `wild_ecology` | capture; sort | Natural animal growth and feeding before wild capture are not foreground aquaculture. Record species-specific catch/removal, live returns/dead discards, reef/contact location, gear loss and actual habitat effects as ecological evidence; do not invent an elementary capture-biomass UUID, zero-bycatch claim or sustainability credit. | nsw-abalone-fishery; vfa-abalone-fishing |\n| `recursive_inputs` | all_nodes | Reference animals must be traceable wild hookah catch, not purchased same-category animals. Purchased same-category animals are a selection failure, not a recursive shortcut; genuine ancillary supplies require independently bounded upstream datasets with no duplicated foreground operations. |  |\n\n"
