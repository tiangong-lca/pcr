validation_rules:
  - rule_id: validate_scope_gate
    applies_to: "accepted_live_whole"
    rule: "Reject wrong species, wild/polyculture/other growout route, processed/dead final state or missing first physical-recipient gate, accepted A or tare exclusions. Native shell belongs in whole mass; edible meat cannot substitute."
    source_ids:
      - naca-babylon-pond-2005
  - rule_id: validate_node_states
    applies_to: "all processes"
    rule: "Check crop-batch mode and complete event/period links; require standing-stock-to-collected-output harvest handoff. Activated sorting declares target plus every alternate/returned/rejected state and handoff. Activated holding declares observed before/after live state and actual intervention/losses; presentation declares product/package interface and separately evidenced delivery. Bypass requires actual records."
    source_ids: []
  - rule_id: validate_balance_fates
    applies_to: "all processes"
    rule: "Check actual receipt including pre-stocking mortality, whole-animal transfer/stock reconciliation, feed/bait-stock balance, water balance, complete intended outputs, waste handlers and direct release media. Uncollected or escaped stock is not automatically a waste exchange; treatment transfers cannot duplicate releases."
    source_ids: []
  - rule_id: validate_attribution
    applies_to: "all processes"
    rule: "Reconcile each output, shared asset/service and period allocation denominator to one complete burden including failures, idle periods, replacement and carry-over; require causal rationale and sensitivity. Complete purchased service and provider components cannot both be counted."
    source_ids: []
  - rule_id: validate_amount_range
    applies_to: "all inventory rows"
    rule: "Check same-lot positive A and per 1 kg reference flow quantities, actual internal transfers, independent native-unit instance bounds and uncertainty. Only accepted_live_whole has exact 1..1 identity; symbolic upper quantities remain unresolved evidence needs, not validated empirical limits."
    source_ids:
      - same-lot-mass-identity
  - rule_id: validate_identity_evidence
    applies_to: "all inventory rows"
    rule: "Concrete dataset exchanges require exact verified flow/property/unit support. Candidate methodology may preserve registered unresolved semantic cards; this does not establish dataset completeness, active methodology or publication readiness. Unknown CO2 source, nutrient basis or pollutant medium must remain unresolved."
    source_ids: []
  - rule_id: validate_source_limits
    applies_to: "all processes"
    rule: "Require current foreground route/gate evidence; no claimed universal commercial profitability, no copied inconsistent pilot numbers or growout-grading assumption, and no zero-burden fish feed solely because it is low value."
    source_ids:
      - naca-babylon-pond-2005
      - fao-fish-feed-2009
  - rule_id: validate_atomic_completion
    applies_to: "all applicable per-flow collection obligations and final exchanges"
    rule: "Final dataset completion and validation require every actual exchange to have an independent atomic card and its own quantity, property/native unit, collection or calculation evidence, range/uncertainty evidence, normalization, actual destination and verified UUID. Unknown identity, activity state, quantity, range evidence or fate blocks completion; it is never zero, a presumed bypass or permission to omit an obligation. Every important concrete flow retains its own range/uncertainty evidence collection duty; a symbolic upper bound is not an empirical range."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground collection package supporting process/lifecyclemodel projections and qualified secondary_dataset or background_dataset use after actual completion"
  downstream_use: "Inventory of live whole pond-farmed Babylonia areolata to first physical recipient of the farmer's product, with upstream seed/feed/material/service links and declared uncertainty"
  allowed_use: "Same species, eligible sand-bottom seawater earthen-pond monoculture, live whole state and physical gate, with explicit geography/period/technology representativeness assessment"
  excluded_use: "Universal Thai production averages; wild, polyculture or other growout systems; edible meat; processed/dead final products; export/restaurant-retail inventories; claims of food safety, welfare, legality or present profitability"
  required_metadata: "Site/pond/crop/period; species/seed origin and receipt; actual feed/bait; growout and harvest methods; actual nursery/sort/hold/presentation; recipient/gate and A; land/assets/shared duties; intended outputs and allocation; waste/release fates; concrete identity supports"
  required_quality_disclosure: "Pilot applicability limits; quantitative evidence and unresolved U bounds; completeness, missing records, failure/idle periods, upstream coverage, allocation alternatives, water/pollutant basis, measurement/model uncertainty and unresolved UUIDs"
  update_trigger: "Changed species/route/feed/seed supply, live state/gate, site/land history, intervention, outputs, service ownership, period/asset attribution, quantity evidence or concrete flow identity"
data_sources:
