allocation_rules:
  - rule_id: allocate_output_set
    applies_to: "all processes"
    rule: "Enumerate target live snails, alternate intended grades, any other independently intended products, returned/retained live stock, rejects and wastes with their handoffs. Monoculture does not guarantee one sale grade. A material becomes a co-product only with actual intended use/recipient evidence; mortality, sludge, bycatch or returnable packaging is not automatically a valuable product."
    source_ids: []
  - rule_id: allocate_precedence
    applies_to: "all processes"
    rule: "First subdivide measured duties by actual lot/node/output. For residual joint burdens of comparable whole live grades, use measured whole-animal mass at the common separation gate when it represents the causal physical relationship; document rationale. If output functions differ and a causal physical relation is unavailable, use contemporaneous actual revenue shares with currency/date and price sensitivity. Disclose alternatives and sensitivity; do not apply universal economic shares, substitution credits or low-value-feed zero burden."
    source_ids:
      - fao-fish-feed-2009
  - rule_id: allocate_periods
    applies_to: "pond_growout, trap_harvest, live_hold, presentation_delivery"
    rule: "Link establishment, preparation, successful/failed crops, partial harvests, carry-over stock, holding, delivery and replacement/termination events to real periods. Record opening/closing stock and remaining service capacity. Attribute failure and idle duty to the service/output system that caused it; no selective deletion of unsuccessful periods or arbitrary annual crop count."
    source_ids: []
  - rule_id: allocate_shared
    applies_to: "all processes"
    rule: "Maintain one asset/service ledger for pond/reservoir/pump/blower, feed cold storage, traps, sorting/holding facilities and vehicles. Enumerate all nodes, ponds, crops and periods served. Submeter first, otherwise use evidenced causal duty such as metered volume and head, operating hours and load, area-time or payload-distance; record denominator, shares, rationale and sensitivity. Asset provision/replacement is apportioned over evidenced service capacity without universal lifetime. Shares reconcile once to the complete shared burden."
    source_ids: []
  - rule_id: allocate_no_duplicate
    applies_to: "all processes"
    rule: "Paired internal transfers share one transfer id and actual amount; do not credit/charge their upstream burden twice. Complete purchased services include provider fuel/assets/releases; use either the complete service or its foreground component inventory. Count feed drawn for bait, animal lots and returnable containers once. Keep rejected/returned lot duties until actual fate, with no invented avoided impact."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_pond_growout
      process_id: "pond_growout"
      flow_role: "Every growout row and concrete instance"
      record_type: "Receipt, crop, meter, stock, waste, land, asset and environmental records"
      raw_fields: "site; pond; cohort; dates; row and instance; supplier/species/state; receipt kg/count; pre-stocking mortality; stocking survivors; feed/bait-stock ledger; water in/out/storage; electricity; fuel; material/replacement mass; land state/area/time; asset consumers/service periods; sample design; pollutant substance/basis/medium/concentration and flow; waste handler; failures; transfer ids; A"
      collection_method: "Weigh receipt/feed/waste on calibrated scales; reconcile invoices, count samples and stock; meter water/energy or retain evidenced duty allocation; trace asset/land records; sample representative inflow/outflow and retain laboratory basis/limits or justified model"
      unit: "Actual instance kg, m3, kWh, land/service native units"
      frequency: "Each receipt, feed/event and meter period; complete crop and failure closeout"
      temporal_coverage: "Establishment and previous land history where relevant; receipt, preparation, growout, failure, maintenance and service periods"
      site_scope: "Identified Thai ponds and shared farm assets, including other consumers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale/meter calibration, invoices, logs, laboratory/model method, non-detects, ownership/service ledger, stock and water reconciliation, uncertainty and missingness"
    - protocol_id: cp_trap_harvest
      process_id: "trap_harvest"
      flow_role: "Every harvest row and concrete instance"
      record_type: "Trap-event, weighing, bait, duty and fate records"
      raw_fields: "pond; cohort; event/date; incoming stock estimate; transfer ids; collected live kg; bait identity/mass/source; trap/sampling duty; incidental outputs; rejected/dead/uncollected/escaped stock; waste and release fate; recipients; A"
      collection_method: "Weigh actual collected animals net of free water/sand/traps; reconcile stock sampling with collection; measure bait and owned/purchased harvest duty; record all removal and retained/returned fates"
      unit: "Actual instance kg and native equipment/service units"
      frequency: "Each sampling/harvest event and final stock closure"
      temporal_coverage: "All harvest events attributable to selected crop including failed attempts"
      site_scope: "Identified pond and harvest operator"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, event log, sample uncertainty, bait ledger, service specification and complete fate reconciliation"
    - protocol_id: cp_postharvest_sort
      process_id: "postharvest_sort"
      flow_role: "Every sorting row and concrete instance"
      record_type: "Actual grade/destination separation and support records"
      raw_fields: "activation evidence; incoming transfer; grade labels; target/alternate/returned/rejected kg; recipient/period; material/energy/supplied and direct water where actual; intake/return/treatment volumes; substance/basis/medium/concentration; waste fate; A"
      collection_method: "Observe actual separation and weigh every output state on calibrated scales; trace handoff, support duty, any real rinse, direct water balance, treatment and substance-specific releases; record bypass when absent"
      unit: "Actual instance kg and native utility/service units"
      frequency: "Each actual sorting event"
      temporal_coverage: "Harvest-to-next-handoff period for selected lots"
      site_scope: "Identified sorting operator and location"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale records, grade/destination ledger, activation/bypass evidence, input-output reconciliation and uncertainty"
    - protocol_id: cp_live_hold
      process_id: "live_hold"
      flow_role: "Every holding row and concrete instance"
      record_type: "Actual live-state intervention, meter and fate records"
      raw_fields: "activation; incoming lot kg/live condition; start/end; operator; actual technique; water/energy/material duty; surviving kg; mortality/refusal; waste/treatment; substance/basis/medium; transfer ids; A"
      collection_method: "Observe and document bounded intervention; weigh entering and surviving animals; meter actual support and direct water; assay or model actual releases with method; keep bypass and failed intervention records"
      unit: "Actual instance kg, m3, kWh and native service units"
      frequency: "Each holding event and meter/sample period"
      temporal_coverage: "Actual lot entry to exit including mortality and failures"
      site_scope: "Identified holding operator/location"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Live-condition and time logs, calibrated weighing/meters, laboratory/model basis, duty ownership, water/mass/fate reconciliation"
    - protocol_id: cp_presentation_delivery
      process_id: "presentation_delivery"
      flow_role: "Every presentation/delivery row and accepted reference"
      record_type: "Tare, dispatch, route, physical receipt and acceptance records"
      raw_fields: "source transfer; lot/species/origin; actual package/reuse/owner; gross kg; free-water/sand/tare/reject kg; accepted net live whole mass A; physical recipient/place/date; live condition; actual payload/distance/load/empty return; support duty; refusals and fates; shared service periods"
      collection_method: "Use calibrated same-lot net whole-animal weighing and physical acceptance records; reconcile dispatch, tare and live condition; inspect actual presentation, packaging returns and pre-acceptance physical route regardless payer or ownership; retain support and release evidence"
      unit: "kg for A and materials; t km for transport; other actual native units"
      frequency: "Each dispatch, physical receipt, refusal and container return; meter/service period"
      temporal_coverage: "Presentation through first physical acceptance and attributable pre-receipt failures"
      site_scope: "Identified farm, delivery operator and first physical recipient"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, paired dispatch/receipt, live-state evidence, tare/contaminant subtraction, route records, ownership/return ledger and complete refusal/mortality accounting"
  calculation_rules:
    - id: gate_mass_identity
      applies_to: "accepted_live_whole"
      rule: "A = accepted same-lot net live whole-animal kg; A/A = 1 kg per 1 kg reference flow"
      inputs:
        - "accepted gross mass"
        - "excluded free water"
        - sand
        - "tare and refusals"
        - cp_presentation_delivery
      output: "accepted reference mass identity"
      source_ids:
        - same-lot-mass-identity
    - id: instance_attribution
      applies_to: "all inventory rows"
      rule: "Each actual instance quantity is attributed once to its node, output and period using recorded shares, then divided by the same positive A; retain native numerator units and uncertainty"
      inputs:
        - "node protocol"
        - "actual quantities"
        - "shared/output/period ledger"
        - A
      output: "per 1 kg reference flow instance quantities"
      source_ids: []
    - id: stock_fate_reconciliation
      applies_to: "pond_growout, trap_harvest, postharvest_sort, live_hold, presentation_delivery"
      rule: "Reconcile opening stock, actual received/transferred animals, surviving closing stock, intended outputs, mortalities and other removals on compatible measured count/mass bases; growth is separately evidenced and not an assumed conservation of wet mass"
      inputs:
        - "each node protocol"
        - "transfer ids"
        - "count and whole-mass samples"
        - "growth/stock/fate records"
      output: "complete stock and fate reconciliation with uncertainty"
      source_ids: []
    - id: pollutant_water_basis
      applies_to: "collect_pond_pollutant_releases, collect_sort_pollutant_releases, collect_hold_environment"
      rule: "Use actual concentration and corresponding water volume/time with species/basis conversion evidence and inlet/background, storage or treatment terms as applicable; report direct release and treatment transfer separately"
      inputs:
        - "node protocol"
        - "paired samples"
        - "measured water"
        - "laboratory basis"
        - "justified model"
      output: "named substance/medium release inventory and uncertainty"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity_gate
      applies_to: "accepted_live_whole"
      requirement: "Species, pond route, whole native shell and actual live state must match physical recipient acceptance; a literature live channel or invoice cannot prove a delivered lot"
      evidence: "Seed/origin records; same-lot physical receipt; weighing and live-state evidence"
    - id: dq_complete_periods
      applies_to: "all processes"
      requirement: "Complete preparation-to-acceptance activity and failure/idle periods, land history, shared consumer/service denominators, replacement and stock terms; no selective successful-crop data"
      evidence: "Node/event ledger, land/assets and failure records, complete period boundaries"
    - id: dq_measurement
      applies_to: "all inventory rows"
      requirement: "Preserve native units and each concrete instance's property/support identity, calibration, sample basis, detection limits, pollutant medium and conversion uncertainty"
      evidence: "Calibrations; assays/model; raw units; density/count and species conversion evidence"
    - id: dq_ranges
      applies_to: "all inventory rows"
      requirement: "Replace each independent symbolic U_row,i with reviewed record-backed bounds or retain the quantity gap; no common empirical cap, invented pilot defaults, automatic zero or publication-critical provisional limit"
      evidence: "Row/instance range evidence and missingness report"
    - id: dq_sources
      applies_to: "all processes"
      requirement: "Historical pilot supports an eligible route only; do not reuse conflicting numerical or economic values as present production defaults. Feed fish and bait retain origin/allocation evidence"
      evidence: "Foreground applicability comparison and upstream source/burden records"
    - id: dq_bindings
      applies_to: "all inventory rows"
      requirement: "Actual exchanges require verified concrete flow/property/unit identities. Collection-scope names do not supply a UUID or make a final dataset complete"
