system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "pond_growout, trap_harvest"
      rule: "Preserve earthen-pond monoculture managed-production responsibility separately from removal of standing stock by traps. Harvest output is collected whole live animals, not pond biomass, edible meat or water-filled gross catch."
      source_ids:
        - naca-babylon-pond-2005
    - rule_id: boundary_actual_nodes
      applies_to: "postharvest_sort, live_hold, presentation_delivery"
      rule: "Sorting activates only for actual grade/destination separation; live holding only for an evidenced bounded intervention with before/after usable live states. Presentation declares the actual product/container interface. Record one actual branch and each physical handoff; no mandatory growout grading, wash or depuration."
      source_ids:
        - naca-babylon-pond-2005
        - fao-fish-feed-2009
    - rule_id: boundary_gate
      applies_to: "presentation_delivery"
      rule: "Include all physical delivery and protection until first physical acceptance regardless payer or ownership; deduplicate the actual provider service scope. Record recipient, place, date and acceptance; remote invoicing, export or restaurant retail does not define this gate."
      source_ids: []
    - rule_id: boundary_management
      applies_to: "pond_growout"
      rule: "Include pond preparation, sand/fence/pump/blower provision, water and feed management, actual seed receipt including subsequent pre-stocking mortality, any actual onfarm nursery, maintenance, replacement, losses and failed or terminated crops."
      source_ids:
        - naca-babylon-pond-2005
    - rule_id: boundary_fates
      applies_to: "all processes"
      rule: "Enumerate intended outputs, retained or returned live stock, losses and actual treatment/release fates. Separate technosphere waste transfer, direct carrier-water balance and substance-specific elementary releases; no automatic waste label, zero burden or credit."
      source_ids: []
    - rule_id: boundary_period_assets
      applies_to: "all processes"
      rule: "Record establishment and land history, preparation, crop, harvest, handling and delivery periods; list shared pond/reservoir/pump/blower, traps, storage and vehicles, every consuming node/pond and service period. One owner allocates shared burdens, including failures; no duplicate provider burdens."
      source_ids:
        - naca-babylon-pond-2005
