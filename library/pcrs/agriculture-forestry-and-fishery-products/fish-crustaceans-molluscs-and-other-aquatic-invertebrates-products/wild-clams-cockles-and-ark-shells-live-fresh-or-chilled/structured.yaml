system_boundary:
  rules:
    - rule_id: wild_start
      applies_to: "gather"
      rule: "Start with naturally occurring Cerastoderma edule in the evidenced intertidal bed, not managed cultivation. Harvest removes them from that context independently of later cleaning; natural growth is not a zero-impact farming dataset. Purchased catch is outside this capture reference and cannot be mixed into its accepted output or represented as a second environmental capture."
      source_ids:
        - nrw-dee-cockle-management
    - rule_id: first_gate
      applies_to: "handover"
      rule: "End at first evidenced harvester-to-recipient physical acceptance, alive whole native shell, before intentional depuration, sanitary relaying or growout. Later buyer purification, dispatch, distribution and consumption are excluded. Harvester depuration before first sale is outside this narrow methodology, never a burden to omit; ambiguous immersion purpose blocks matching. This gate does not attest ready-to-eat safety."
      source_ids:
        - fao-bivalve-depuration-2008
    - rule_id: conditional_nodes
      applies_to: "all nodes"
      rule: "Activate only actual independent responsibilities; cleaning, destination sorting, bounded life maintenance and presentation may overlap, repeat or be bypassed. Index node/pass/event/state; retain in-capture screening and final acceptance without inventing independent grading. Sorting requires actual at least two named destination states and each handoff. No universal local size, season, quota or gear threshold applies."
      source_ids:
        - nrw-dee-cockle-management
    - rule_id: all_duties
      applies_to: "all nodes"
      rule: "Record complete own resources, services, emissions, material/package receipts, intended outputs, stocks, losses and fates at every active node, including bagging during capture. Full attributable access, return, idle, cleaning, maintenance and support periods remain even with an offshore first handover; exclude buyer onward logistics. Manual gathering is not proof of zero fuel, disturbance or ecological effect."
      source_ids:
        - nrw-dee-cockle-management
    - rule_id: physical_ledger
      applies_to: "all nodes"
      rule: "Keep full physical throughput separate from allocation-weighted LCA amounts. Pair transfer ids on both sides with state, amount, units, custody and actual period; do not repurchase internal animal/water/package or count recirculated water again. Reconcile opening + external receipts + natural removal + evidenced biological/material exchange against closing + transfers + intended outputs + losses/fates within each material balance. Never sum different substances or force wet-mass change into animal yield."
      source_ids: []
    - rule_id: fate_media
      applies_to: "all nodes"
      rule: "Separate contained waste/liquid to technosphere receiver from direct elementary release to actual water, air or soil. Record organism species/life state/survival uncertainty and actual habitat return independently of emissions. Biological uptake, exudate, feces/pseudofeces and respiration are not assumed absent; require material component balances and uncertainty when relevant, no fossil-carbon or shell sequestration shortcut."
      source_ids: []
    - rule_id: periods
      applies_to: "all nodes"
      rule: "Declare tide/trip lot, cleaning/changeover and storage intervals, reporting periods and gear/container/asset acquisition-use-replacement-retirement phases. Identify every shared consumer/period and inventory carryover with origins. Replacement/termination and stock uncertainty cannot be hidden by a universal lifetime or annualization factor."
      source_ids: []
    - rule_id: boundary_operating_responsibility
      applies_to: "all direct resources and emissions"
      rule: "Own/owned refers to direct foreground operation/control and fuel/resource-consumption responsibility, not legal asset title. Include rented or borrowed self-operated equipment; exclude components already represented by a provider-inclusive service. Apply this definition to direct fuel, combustion, water, compression and asset/service records with one event owner."
      source_ids: []
