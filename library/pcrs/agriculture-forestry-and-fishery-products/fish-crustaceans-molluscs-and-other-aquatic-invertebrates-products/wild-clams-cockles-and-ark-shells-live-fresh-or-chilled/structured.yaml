  downstream_use: "Verified process and lifecyclemodel projections of this exact first-harvester product system"
  allowed_use: "Same species/manual wild route/live whole gate with compatible sites/periods and resolved actual exchanges"
  excluded_use: "Entire CPC leaf equivalence; farmed or mechanized substitutes; purified/processed/dead output; food safety/legal/sustainability certification; numerical defaults from unresolved symbols"
