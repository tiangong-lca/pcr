validation_rules:
  - rule_id: scope_gate
    applies_to: "reference product"
    rule: "Verify Cerastoderma edule, natural bed, manual route, life state, whole native shell, actual first physical recipient and treatment purpose. Reject scope match for mechanized suction/pump-scoop/prop-wash/box-dredge, managed relaying/growout, other species, dead/shucked/frozen/cooked/preserved outputs or intentional pre-gate depuration."
    source_ids: []
  - rule_id: card_identity
    applies_to: "all inventory rows"
    rule: "Verify each actual concrete flow and independent property/unit-group supports before final dataset exchanges; unresolved semantic umbrellas are not executable UUIDs. Record exact source/provider/medium/state and no identity inferred from name ranking."
    source_ids: []
  - rule_id: mass_check
    applies_to: "reference and transfers"
    rule: "Check calibrated tare/net records, native shell and inherent body water included, free water/sediment/other organisms/packages excluded. Reconcile internal pairs and stocks by state/component, not by an assumed meat-to-whole or moisture factor; death cannot remain live reference."
    source_ids: []
  - rule_id: inventory_complete
    applies_to: "all active nodes"
    rule: "Verify every active responsibility and bypass/pass, own resources, ancillary bags/gear and all contained/uncontained fates, including returned organisms, ashore receivers and biological uncertainty. Explain actual zeros/nonapplicability; do not invent treatment, icing, gas or emissions."
    source_ids: []
  - rule_id: range_check
    applies_to: "all inventory rows"
    rule: "Every 0..U_<row_id> is an unresolved independent Range evidence requirement, not an empirical upper, permissible maximum, default estimate or clipping rule. Obtain independent representative evidence and its basis/units before numeric screening; preserve and investigate real outliers. Final 1..1 expresses normalization only, never yield."
    source_ids: []
  - rule_id: allocation_check
    applies_to: "output and event ledger"
    rule: "Reconcile one event owner, all intended destinations, progressive remaining burden pools, provider inclusions, period/asset/stock attribution and zero-output duties. A pass does not imply legal compliance, sustainability certification, food safety or complete UUID/range evidence."
    source_ids: []
  - rule_id: validate_atomic_completion
    applies_to: "all applicable collection requirements and concrete inventory exchanges"
    rule: "Resolve every applicable section-8 collection requirement into individual physical/chemical exchanges with their own quantities, native units, composition/state, range basis or explicit uncertainty evidence, raw records, normalization, actual destinations/receiving media and verified compatible UUIDs. Any unresolved applicable requirement makes the final dataset incomplete and validation fails; unknown is not zero. Never copy aggregate amounts onto components or duplicate inclusive services with owned fuel/electricity/direct releases. Internal transfers are not fixed to the final 1 kg."
    source_ids: []
