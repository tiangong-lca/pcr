  calculation_rules:
    - id: reference_identity
      applies_to: "handover_accepted_live"
      rule: "Exactly 1 kg reference output by definition; actual accepted net live mass is separately measured before normalization, never a yield factor."
      inputs:
        - cp_handover
      output: "reference quantity"
      source_ids:
        - reference-normalization-identity
    - id: physical_reconciliation
      applies_to: "all inventory rows"
      rule: "Reconcile unweighted animal, water, sediment and package ledgers independently by actual events/stock; internal paired transfers cancel only at system aggregation, not by deleting node records."
      inputs:
        - cp_gather
        - cp_clean
        - cp_sort
        - cp_hold
        - cp_present
        - cp_handover
      output: "component balances and gaps"
      source_ids: []
    - id: attribution_ledger
      applies_to: "all inventory rows"
      rule: "Apply event_ownership then product_hierarchy/later_split/cross_period/denominator; retain raw quantities and exact once-only attributed quantities for the positive reference denominator, with all factors and evidence."
      inputs:
        - cp_gather
        - cp_clean
        - cp_sort
        - cp_hold
        - cp_present
        - cp_handover
      output: "attributed inventory and sensitivity"
      source_ids: []
  data_quality_requirements:
    - id: product_trace
      applies_to: "reference output"
      requirement: "Species/wild route/live whole state/first physical gate and recipient treatment purpose must match; trace each accepted animal lot to original in-scope capture and exclude purchased catch from the reference pool."
      evidence: "Bed/trip and recipient records; shell/life inspection; treatment ownership"
    - id: complete_balances
      applies_to: "all nodes"
      requirement: "Retain all actual events/stock periods, independent component balances, full raw throughput and all fate media; missing is not zero."
      evidence: "Paired ids, calibration, stocks, waste/receiver/biological records and uncertainty"
    - id: quantitative_evidence
      applies_to: "all rows"
      requirement: "No empirical Range, allocation factor, emission factor, lifetime, unit conversion or survival rate is supplied by qualitative sources. Obtain independent representative support or disclose unresolved review-required gaps."
      evidence: "Raw records plus independent dataset/method scope, units, temporal/technology relevance and sensitivity"
