allocation_rules:
  - rule_id: event_ownership
    applies_to: "all inventory rows"
    rule: "First subdivide each physical event/service by evidenced node/pass/period consumption once, retaining total reconciliation and provider inclusions. This owner assignment precedes independent coproduct allocation and must not allocate one event in full to every node."
    source_ids: []
  - rule_id: product_hierarchy
    applies_to: "intended outputs"
    rule: "Enumerate intended species/grades and recipient gates. Prefer measured causal subdivision; if impossible justify a physical causal relation, or an evidenced economic relation if no suitable physical relation exists. Do not default to wet mass or revenue. Record actual method, factors, denominator, representativeness and sensitivity. Released organisms, residues, rejects and waste are not automatically intended outputs or substitution credits."
    source_ids: []
  - rule_id: later_split
    applies_to: "successive output splits"
    rule: "At a genuine later product split divide the remaining carried upstream burden pool plus genuinely shared later burdens among evidenced destinations. Previously externalized product shares stay excluded from that pool; never split the original whole burden again or give a late intended output zero capture burden. Product-specific subsequent burdens follow their own output only."
    source_ids: []
  - rule_id: cross_period
    applies_to: "stocks and shared assets"
    rule: "Link each service/asset to actual consuming nodes and periods; use evidenced usage/causal service basis for attribution, retaining unused/idle capacity decisions, replacement and end-of-use. Carry animal/material/package stocks and attached burdens once with traceable origin; no new purchase or new capture at period rollover and no lifetime default."
    source_ids: []
  - rule_id: denominator
    applies_to: "reference output"
    rule: "Normalize attributed quantities only by positive accepted net live whole cockle mass for the same output set/period. Keep full physical source and destination quantities unweighted. A lot/period with no accepted reference output retains its burdens in the declared pool/stock/other-output/loss treatment; never divide by zero, silently drop a failed trip or set its burden to zero."
    source_ids: []
