system_boundary:
  rules:
    - rule_id: capture_context
      applies_to: "capture"
      rule: "Capture removes wild stock independently of sorting/conditioning. Record actual area, haul effort, seabed contact and turtle/bycatch devices and observed interactions. Devices do not imply zero bycatch, zero mortality or zero habitat effects. Keep ecological observations and omissions visible without inventing pollutant exchanges."
      source_ids:
        - noaa-white-shrimp
    - rule_id: route_states
      applies_to: "process map"
      rule: "Capture hands unsorted whole catch to sorting. Sorting assigns species, selected grade, other sale destinations and discard fates. Actual whole washing/dip produces a declared prepared state before icing. If inactive, identify direct sorted-to-icing handoff. Icing produces the never-frozen chilled state. Actual presentation yields packaged/crated state; if inactive, chilled product goes directly to receipt. Only recipient accepted output is final."
      source_ids:
        - haby-miget-wild-shrimp-2003
    - rule_id: operation_ownership
      applies_to: "all nodes"
      rule: "Record all actual fuel, power, water, cleaning, materials, direct combustion/leakage and treatment at the responsible node. A complete purchased operational service and its separately itemized fuel/emissions/assets are mutually exclusive. Purchased fuel/power production remains upstream. Onsite power is an internal transfer from recorded generation, not additional grid supply."
      source_ids: []
    - rule_id: period_assets
      applies_to: "trips and infrastructure"
      rule: "Reporting coverage includes preparation, steaming, hauling, nonproductive/failed trips, handling/holding, cleaning, changeovers, maintenance, replacement and termination. Identify vessel/engine, gear/devices, cold hold, pumps, scales, handling equipment and crates as applicable, consuming nodes and periods; retain one owner for each event and asset service share."
      source_ids: []
    - rule_id: recipient_gate
      applies_to: "receipt"
      rule: "Include actual unloading and acceptance needed for first physical receipt. Exclude recipient heading/freezing/processing, onward distribution and retail. Product acceptance, package handoff and waste fate are separate; receipt is not remote dispatch or retail delivery."
      source_ids: []
    - rule_id: fate_boundary
      applies_to: "waste and direct discharge"
      rule: "Record actual retained waste with treatment/provider and full burden, or actual direct release with pollutant substance/basis/medium and water balance. Do not create elemental emissions from bulk biomass, assume disposal has no burden, or award ecological/substitution credit for discards. Returned live organisms retain recorded fate and mortality uncertainty."
      source_ids: []
