allocation_rules:
  - rule_id: direct_assignment
    applies_to: "all nodes"
    rule: "Subdivide independently measured haul, species, grade, handling lot and destination first. Directly assign dedicated conditioning, ice, packaging, receipt and treatment to their actual lots. Internal handoffs carry lineage, not a second allocated final product."
    source_ids: []
  - rule_id: mixed_trip
    applies_to: "unresolved shared capture duty"
    rule: "For indivisible mixed-catch trip propulsion/gear duty, retain all intended sale products, including other shrimp species and retained bycatch, at their actual states and gates. After direct assignment, use observed sale-value shares at the same first-recipient transaction period for residual mixed-product capture burdens, because effort jointly obtains economically intended catch and unlike states are not physically equivalent. Record species/grade-specific net quantities and realized unit prices, aggregate value once, explain this causal choice and report mass-share sensitivity using comparable recorded whole-product bases. Missing prices, output sets or state conversions require review, not a default share. Waste/discards receive no sale-value share but their handling/treatment remains with the generating product system."
    source_ids: []
  - rule_id: period_assignment
    applies_to: "reporting-period trip and fixed events"
    rule: "Assign each productive trip once; assign failed/nonproductive trips and period cleaning/maintenance to the declared fleet/gear output population of the same period before residual mixed-output allocation. Include all intended outputs of that population. Never divide nonproductive duty by zero or drop it; disclose the pooling boundary and sensitivity."
    source_ids: []
  - rule_id: asset_assignment
    applies_to: "shared assets and services"
    rule: "Use actual metered consumption for shared energy/water; otherwise documented equipment operating hours or load-time for the consuming nodes and periods. Allocate capital/gear replacement by documented service consumption over actual lifetime with maintenance/replacement/termination evidence. Enumerate every consumer, reconcile shares to one supplied total and exclude shares already inside full services. Crates use documented completed uses and actual losses; no universal lifetime or reuse count."
    source_ids: []
  - rule_id: single_denominator
    applies_to: "all rows"
    rule: "After attribution, divide each actual exchange by A, accepted net kg of the same final selected lot or explicitly matched reporting population. Do not allocate internal product transfers again or treat mixed catch, rejected biomass, ice, tare or headed/frozen destinations as reference output."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_capture
      process_id: "capture"
      flow_role: "Actual otter-trawl capture transfers, supplies, assets, waste and releases"
      record_type: "calibrated measurement; log; supplier/service scope; factor record"
      raw_fields: "reporting period; trip/haul/lot/transfer id; species/state/grade; supplier/gate; actual activity/configuration; native amount/unit; complete intended-output set; realized species/grade-specific transaction prices; comparable whole-product mass and attribution drivers; fuel carbon and pollutant substance/basis/medium; waste destination; measured free ice/water/tare; accepted net kg A; uncertainty; consumer/period shares; finite row/instance bound evidence"
      collection_method: "Weigh net biomass and separately record ice/water/tare with calibrated equipment; meter or reconcile supplies from opening/purchases/closing records; match actual otter-trawl capture event to its own node and physical transfer. For each release retain measurement or actual owned activity and compatible factor; for each service/asset retain inclusions and shared-consumer ledger. Retain actual absence/unknown, not assumed zero."
      unit: "kg for biomass and measured substances; native unit per other actual instance"
      frequency: "each haul/lot/event; period reconciliation"
      temporal_coverage: "complete declared trips and reporting periods, including nonproductive duty, cleaning/changeovers, stock carryover and asset phases"
      site_scope: "actual vessel, deck/hold and first-recipient consumers of this node"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original logs/invoices; lot/transfer matching; source/factor applicability; service scopes; share reconciliation; uncertainty and range-bound rationale"
