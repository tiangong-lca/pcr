      requirement: "Identify each actual physically or chemically specific exchange within this collection scope and add an independent inventory card; this collection scope is not a flow. Establish substance/species, state, flow type, property, native unit, quantity, evidence, normalization, destination and UUID separately for each card. Do not copy an aggregate quantity, common upper bound or UUID onto its members. Determine final direction and product/waste/elementary type from each actual source and fate; the collection scope does not assign a universal exchange type. Collection scope: Recipient downgraded or redirected sale lots by species state and gate. Retain intended sale status and separate acceptance gate; heading/freezing destinations cannot enter the selected whole chilled reference denominator. <br> - Flow property / unit: Mass 93a60a56-a3c8-11da-a746-0800200b9a66 / kg <br> - Amount rule: Collect attributable physical quantity using cp_receipt; retain actual transfer and destination records. <br> - Value mode: Foreground record (foreground_record) <br> - Specificity: Site-specific (site_specific) <br> - Normalization basis: per 1 kg reference flow <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Collected record (collected_record) <br> - Collection protocol: cp_receipt <br> - Range: Provisional unresolved range evidence; independently establish actual bound <br> - Range role: Uncertainty range (uncertainty_range) <br> - Lower: 0 <br> - Upper: U_row,i <br> - Unit: kg <br> - Basis: per 1 kg reference flow <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Reasoned estimate (reasoned_estimate)"
      evidence: "Node collection protocol, original records and individual identity, quantity, range and destination evidence"
    - id: collect_receipt_rejects
      applies_to: "receipt; Outputs; Waste flows"
      requirement: "Identify each actual physically or chemically specific exchange within this collection scope and add an independent inventory card; this collection scope is not a flow. Establish substance/species, state, flow type, property, native unit, quantity, evidence, normalization, destination and UUID separately for each card. Do not copy an aggregate quantity, common upper bound or UUID onto its members. Determine final direction and product/waste/elementary type from each actual source and fate; the collection scope does not assign a universal exchange type. Collection scope: Recipient unsaleable rejects and removed ice or water by fate. This collection obligation covers only actual unsaleable biomass or removed ice/water sent to a confirmed treatment/disposal provider, independently recorded by fate and next owner. Returned, reusable or resale products are not automatically waste and remain traceable in product/return ledgers without disappearing from trip accounting. Directly discharged carrier water belongs in the water balance and its measured/modelled pollutants in collect_receipt_other_releases; whole-biomass fates remain independent. <br> - Flow property / unit: Mass 93a60a56-a3c8-11da-a746-0800200b9a66 / kg <br> - Amount rule: Collect attributable physical quantity using cp_receipt; retain actual transfer and destination records. <br> - Value mode: Foreground record (foreground_record) <br> - Specificity: Site-specific (site_specific) <br> - Normalization basis: per 1 kg reference flow <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Collected record (collected_record) <br> - Collection protocol: cp_receipt <br> - Range: Provisional unresolved range evidence; independently establish actual bound <br> - Range role: Uncertainty range (uncertainty_range) <br> - Lower: 0 <br> - Upper: U_row,i <br> - Unit: kg <br> - Basis: per 1 kg reference flow <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Reasoned estimate (reasoned_estimate)"
      evidence: "Node collection protocol, original records and individual identity, quantity, range and destination evidence"
    - id: collect_receipt_other_releases
      applies_to: "receipt; Outputs; Elementary flows"
      requirement: "Identify each actual physically or chemically specific exchange within this collection scope and add an independent inventory card; this collection scope is not a flow. Establish substance/species, state, flow type, property, native unit, quantity, evidence, normalization, destination and UUID separately for each card. Do not copy an aggregate quantity, common upper bound or UUID onto its members. Determine final direction and product/waste/elementary type from each actual source and fate; the collection scope does not assign a universal exchange type. Collection scope: Actual non-CO2 pollutant and leakage releases by substance basis and medium. Conditional zero, one or multiple actual direct emissions/leakages, excluding this node's separately listed CO2 and all full-service releases. Specify each combustion substance/species/particle size, refrigerant identity or measured discharged pollutant, amount basis and air/water/soil receiving medium; bulk biomass and wastewater are not automatic elemental pollutants. Apply release_evidence_mode: the foreground_record/collected_record metadata below is only the measured branch; calculated instances require calculated_value/calculated_from_collection and the evidence specified by that rule. <br> - Flow property / unit: Actual instance property / native unit of each actual instance <br> - Amount rule: Collect attributable physical quantity using cp_receipt; retain actual transfer and destination records. <br> - Value mode: Foreground record (foreground_record) <br> - Specificity: Site-specific (site_specific) <br> - Normalization basis: per 1 kg reference flow <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Collected record (collected_record) <br> - Collection protocol: cp_receipt <br> - Range: Provisional unresolved range evidence; independently establish actual bound <br> - Range role: Uncertainty range (uncertainty_range) <br> - Lower: 0 <br> - Upper: U_instance <br> - Unit: native unit of each actual instance <br> - Basis: per 1 kg reference flow; independent actual native-unit instance <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Reasoned estimate (reasoned_estimate)"
      evidence: "Node collection protocol, original records and individual identity, quantity, range and destination evidence"
    - id: dq_logistics_water_balance
      applies_to: "logistics, services and water/nutrient balances"
      requirement: "Actual payload includes accompanying water, ice, packaging and other cargo. Empty return/repositioning still consumes activity: account for its actual fuel/distance/vehicle service and explicit attribution; zero cargo tonne-kilometres cannot erase that duty. Do not duplicate a complete service and covered fuel, materials, assets or direct releases. Measure external abstraction, supplied water product, internal circulation and actual returned/discharged water separately; never deduct internal recirculation again from external intake. Net nutrient increment/retention is a separate balance diagnostic, never automatically a negative elementary flow, negative emission or avoided burden."
      evidence: "Actual load/vehicle duty records, service scope, same-lot water/substance balance and method evidence"
    - id: dq_atomic_card_identity
      applies_to: "all inventory rows"
      requirement: "Each card represents one physically identified exchange, not a collection or selector. Keep Electricity as one electrical-energy flow; supplier, geography and voltage remain actual collected qualifiers, not grounds for speculative splitting. Other actual materials, waste streams, carbon origins and receiving media must have separate identities and atomic cards before completion. Preserve every existing collection obligation; an absent card or unresolved identity never means zero or a waived exchange. Paired internal water transfers retain the same actual quality, transfer id, quantity and upstream burden, without another purchase."
      evidence: "Per-card identity, provider, state, destination and paired records"
    - id: dq_atomic_range_evidence
      applies_to: "repaired atomic flow cards"
      requirement: "U_row is an unresolved evidence requirement, not a numerical estimate, default, clipping limit or completeness pass. Establish each card's own matching-unit/reference-basis upper envelope from independent representative records or a compatible documented supplier/design bound, retaining scope, method and uncertainty. Do not reuse a removed aggregate range, copy a sibling quantity, derive a bound from the target batch itself or invent a value. Applicable missing evidence blocks quantitative QA completion; actual measurements remain required."
      evidence: "Independent envelope evidence; retained raw records and uncertainty"
validation_rules:
  - rule_id: reference_validation
    applies_to: "accepted_white_shrimp"
    rule: "Verify species, wild US Gulf near-bottom otter-trawl route, whole head-on shell-on raw chilled never-frozen accepted state and first-recipient physical gate; A is positive and excludes measured free ice/water and tare. Reject other species/states as reference denominator."
    source_ids: []
  - rule_id: handoff_validation
    applies_to: "process map and transfers"
    rule: "Verify actual optional-node states and transfer ids. Each real transfer has one output/input pairing at measured mass; only accepted_white_shrimp is normalized final output. Unknown washing/dip/presentation state requires review, not an inactive default."
    source_ids: []
  - rule_id: mixed_output_validation
    applies_to: "capture sorting and receipt"
    rule: "Reconcile all species/grade/state destinations, intended sale outputs, live returns, rejects and discards. Check direct assignment, observed-value residual mixed-trip shares and comparable mass-share sensitivity; no duplicate final gates or waste sale allocation."
    source_ids: []
  - rule_id: period_shared_validation
    applies_to: "operations assets and periods"
    rule: "Check all productive/nonproductive trip coverage, event ownership, consumer/period shares, actual lifetime/replacement evidence, and capital/service exclusions. Shares reconcile to one total before same-lot normalization."
    source_ids: []
  - rule_id: release_validation
    applies_to: "each direct-operation node"
    rule: "Verify direct fuel and CO2 plus actual non-CO2 combustion/leak/discharge coverage for capture, sorting, conditioning, preservation, packaging and receipt when present. Separate CO2 from other releases; confirm pollutant identity/basis/medium, measured/factor evidence and no full-service duplicate. Onsite electricity is not additional grid demand."
    source_ids: []
  - rule_id: evidence_validation
    applies_to: "all amounts and bindings"
    rule: "Check node-specific collection links, actual native units and uncertainty, independently supported instance bounds, current projection and bilingual alignment. Provisional symbolic ranges and unresolved identities cannot certify empirical quantities or final UUID readiness; unresolved final reference product blocks active/publication."
    source_ids: []
  - rule_id: validate_atomic_completion
    applies_to: "all applicable per-flow collection obligations and final exchanges"
    rule: "Final dataset completion and validation require every actual exchange to have an independent atomic card and its own quantity, property/native unit, collection or calculation evidence, range/uncertainty evidence, normalization, actual destination and verified UUID. Unknown identity, activity state, quantity, range evidence or fate blocks completion; it is never zero, a presumed bypass or permission to omit an obligation. Every important concrete flow retains its own range/uncertainty evidence collection duty; a symbolic upper bound is not an empirical range."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground capture-to-first-physical-recipient accepted-product data package"
  downstream_use: "secondary_dataset; background_dataset after declared review and concrete exchange resolution"
  allowed_use: "Declared US Gulf near-bottom otter-trawl Litopenaeus setiferus whole head-on shell-on chilled never-frozen channel with actual trip/lot and recipient gate"
  excluded_use: "Other species, farming, other gear/regions, live/headed/peeled/cooked/frozen references, retail delivery, legal/safety or zero-ecological-impact claims"
  required_metadata: "PCR/version; species; region/gear/devices; all trip/haul/lot ids; reporting period; actual handling and optional states; grade; holding conditions; acceptance net mass; tare/ice; recipients; suppliers/services; assets and native units; attribution"
  required_quality_disclosure: "Sampling/calibration; representativeness; failed-trip coverage; bycatch/discard fate and ecological limitations; supplier scope; factor/identity gaps; range evidence limits; shared capital/period/output allocation and sensitivity"
  update_trigger: "Species/route/state/gate, handling configuration, provider/equipment, reporting coverage, asset service, bycatch/destination, price/attribution or identity/factor evidence changes"
data_sources:
  - id: "noaa-white-shrimp"
    type: "official_guidance"
    reference: "NOAA Fisheries, White Shrimp, https://www.fisheries.noaa.gov/species/white-shrimp"
    used_for: "Species/region and near-bottom trawl context; device and bycatch/habitat observations, not amount factors or legal prescriptions"
  - id: "haby-miget-wild-shrimp-2003"
    type: "extension_guidance"
    reference: "Haby and Miget, Texas Cooperative Extension / Texas A&M Sea Grant, Wild-Harvested Shrimp Technical Assistance Curriculum, December 2003, physical pp.56,66–69 (printed pp.50,60–63), https://www2.lsuagcenter.com/seafood/pdfs/TAAWildShrimp.pdf"
    used_for: "Distinction of ice/freezer and head-on/tail channels; headed-product examples delimit applicability; no transferred dose, ice ratio, safety or trip threshold"
