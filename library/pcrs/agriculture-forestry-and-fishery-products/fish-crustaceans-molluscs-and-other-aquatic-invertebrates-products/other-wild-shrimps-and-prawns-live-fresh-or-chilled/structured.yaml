  calculation_rules:
    - id: lot_normalization
      applies_to: "all inventory rows"
      rule: "Divide the attributable exchange quantity by accepted net kg A of the same reference lot or explicitly matched population. Internal transfers retain their measured quantities; each native-unit instance is calculated independently. For derived direct releases, establish the raw release quantity and evidence under release_evidence_mode before this division."
      inputs:
        - "attributable quantity"
        - "accepted net kg A"
        - "node-specific protocol"
        - "attribution ledger"
      output: "exchange per 1 kg reference flow"
      source_ids: []
    - id: acceptance_identity
      applies_to: "accepted_white_shrimp"
      rule: "A / A = 1 kg per 1 kg reference flow for the same accepted positive-mass lot; this is normalization, not a catch-yield equation."
      inputs:
        - "accepted net kg A"
        - cp_receipt
      output: "1 kg accepted reference output"
      source_ids: []
    - id: direct_release
      applies_to: "direct emissions"
      rule: "Use actual measured release or actual owned activity times a documented compatible factor. Retain fuel carbon/substance basis, source version, receiving medium and uncertainty; factor emissions are absent when the complete operational service already owns them."
      inputs:
        - "node activity"
        - "measured release or compatible factor"
        - "ownership ledger"
      output: "independent actual pollutant amount"
      source_ids: []
    - id: balance_reconciliation
      applies_to: "product water and waste records"
      rule: "Reconcile per-species measured capture, retained products, live returns, dead discards, losses and recipient outcomes. Reconcile wash/dip water, solution retention, ice, meltwater and actual destinations separately; biomass is not required to equal accepted product plus pollutant mass."
      inputs:
        - "transfer ids"
        - "species/state masses"
        - "water/ice/solution records"
        - "destination records"
      output: "documented physical balances and uncertainty"
      source_ids: []
    - id: release_evidence_mode
      applies_to: "capture_co2; capture_co2_biogenic; sorting_co2; sorting_co2_biogenic; conditioning_co2; conditioning_co2_biogenic; preservation_co2; preservation_co2_biogenic; packaging_co2; packaging_co2_biogenic; receipt_co2; receipt_co2_biogenic; collect_capture_other_releases; collect_sorting_other_releases; collect_conditioning_other_releases; collect_preservation_other_releases; collect_packaging_other_releases; collect_receipt_other_releases"
      rule: "For each actual direct-release instance, retain foreground_record/collected_record only when the raw release quantity is directly measured. If derived from fuel, concentrations, carbon composition or another activity record, use calculated_value/calculated_from_collection for that instance. Under its own collection protocol retain the explicit formula, factor and source/version where applicable, measured input records, substance/receiving-medium basis and uncertainty. Apply the stated attribution and reference-flow normalization once. Resolve the evidence branch before finalizing; missing method or supporting evidence remains incomplete, not zero. Existing foreground/collected metadata is the measured-branch template, not certification of calculated releases; no universal emission factor is supplied."
      inputs:
        - "Instance-specific measured records"
        - "formula and factor/source/version if calculated"
        - "node protocol"
        - "attribution and accepted A"
      output: "Release instance with method-consistent value/evidence metadata and traceable quantity"
      source_ids: []
