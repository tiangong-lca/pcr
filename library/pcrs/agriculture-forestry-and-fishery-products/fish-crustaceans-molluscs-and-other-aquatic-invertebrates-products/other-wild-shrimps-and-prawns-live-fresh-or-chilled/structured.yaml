    - id: identity_quality
      applies_to: "all exchanges"
      requirement: "Resolve each actual instance with verified flow/property/unit support, supplier/gate, species/state or pollutant substance/basis/medium before final exchange construction; collection scopes do not supply a universal UUID."
      evidence: "detail confirmation and foreground specifications"
    - id: period_quality
      applies_to: "trips and assets"
      requirement: "Cover the declared representative reporting period, all included failed/nonproductive trips, holding, cleaning/changeover and replacement phases; reconcile opening/closing stocks and asset service consumption."
      evidence: "trip logs; receipts; stock ledger; asset register"
    - id: amount_quality
      applies_to: "every card"
      requirement: "Record calibrated or traceable measurements, units, uncertainty and A. All 0..U_row,i or 0..U_instance ranges are provisional unresolved evidence placeholders with independently established finite actual bounds still required; they are not empirical intervals, hard acceptance defaults or replacement measurements. Final 1..1 is only same-lot normalization."
      evidence: "node protocols; bound rationale; calibration and checks"
    - id: source_quality
      applies_to: "route and amount evidence"
      requirement: "Historical handling guidance is qualitative route context, especially for headed examples; actual whole-product practice and all quantities need current foreground records. No cited route source establishes fuel, ice, chemical, release or capital amounts."
      evidence: "declared source applicability and actual records"
    - id: coverage_quality
      applies_to: "direct ownership and outputs"
      requirement: "List all intended products, waste fates, direct combustion and non-CO2 releases/leaks including actual conditional zero cases. Missing observations or factor coverage remain gaps, not assumed zero."
