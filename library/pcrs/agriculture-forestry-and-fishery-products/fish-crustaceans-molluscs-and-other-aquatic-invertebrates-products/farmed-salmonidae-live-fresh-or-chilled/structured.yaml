      output: "per 1 kg reference flow"
      source_ids: []
    - id: service_attribution
      applies_to: "shared_services"
      rule: "Apply measured consumer use or a documented causal service share over the actual service period to manufacture, maintenance, replacement and end-of-life; sum shares across consumers/periods."
