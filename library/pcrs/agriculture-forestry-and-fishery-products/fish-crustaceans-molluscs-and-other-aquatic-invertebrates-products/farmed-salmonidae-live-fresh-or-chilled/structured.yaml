  data_quality_requirements:
    - id: quality_identity
      applies_to: "all exchanges"
      requirement: "Keep actual species, state, origin, gate, provider and receiving compartment; verify concrete downstream UUIDs and required support units. Unknown identities remain explicit gaps."
      evidence: "supplier/stage records; identity detail verification; metadata"
    - id: quality_topology
      applies_to: "all selected stages"
      requirement: "Document actual parent/child routes, own/purchased stages, freshwater versus staged marine context and technology; source examples cannot replace current farm records."
      evidence: "stage map; cp_stock_seed_rearing; cp_stock_grow_out; cp_stock_pre_gate_transfer; cp_stock_harvest; cp_stock_preservation; cp_stock_dispatch; cp_stock_shared_services; technology registers"
    - id: quality_measurement
      applies_to: "all quantities"
      requirement: "Retain calibration, tare, free-water exclusion, sample wet mass/dry matter/active basis and unit conversion evidence; propagate measurement and model uncertainty.  per 1 kg reference flow"
      evidence: "cp_mass; material specifications; monitoring/calibration"
    - id: quality_time
      applies_to: "all cohorts/assets"
      requirement: "Cover full linked cohorts and applicable fallowing, cleaning, replacement and termination across reporting periods, with no unexplained gaps or duplicate burdens."
      evidence: "cohort/run identifiers; service registers"
    - id: quality_completeness
      applies_to: "all products and losses"
      requirement: "Reconcile feed/stock/water/energy/outputs, intended co-products, mortality and escape events; quantify omissions and missing upstream support rather than treating them as zero."
      evidence: "balances; cp_outputs_grow_out; cp_outputs_dispatch; coverage and uncertainty statement"
    - id: quality_ranges
      applies_to: "every flow card"
      requirement: "Provisional reasoned ranges are screening estimates only; replace using reviewed site evidence and retain explanation for departures. No numeric screen is a regulatory or performance limit."
      evidence: "foreground records; review and replacement evidence"
    - id: dq_inventory_completion
      applies_to: "all inventory-completion requirements"
      requirement: "Create a separate card for every actual physical or chemical exchange, with process, direction, flow type, its own measured quantity, native unit, final-reference normalization, applicability, destination, UUID and independent range evidence. Never copy a family total, a grouped screening range or one UUID onto every child. Use not_applicable only for evidenced absence; unknown is not zero. Any unfulfilled applicable obligation makes the final dataset incomplete and fails validation."
      evidence: "per-flow coverage ledger, raw measurements, identity, fate and range evidence"
