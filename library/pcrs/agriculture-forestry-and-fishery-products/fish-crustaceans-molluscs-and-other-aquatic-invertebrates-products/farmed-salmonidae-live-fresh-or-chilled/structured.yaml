        - cp_waste_harvest
        - cp_waste_preservation
        - cp_waste_dispatch
        - cp_waste_shared_services
        - cp_mass
      output: "per 1 kg reference flow"
      source_ids: []
    - id: release_reconcile
      applies_to: "culture emissions and effluent"
      rule: "Reconcile feed and water substance inputs, fish retention, collected solids, water/sediment releases and uncertainty; prevent a substance counted in treatment/waste and direct release twice."
