allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "all intended outputs"
    rule: "Enumerate reference fish and every actual intentional output with purpose, state, handover and period. Subdivide independently metered hatchery, grow-out, transfer and handling operations before allocation."
    source_ids:
      - ghg-product-allocation
  - rule_id: allocation_causal
    applies_to: "shared output burdens"
    rule: "If subdivision is insufficient, use evidenced causal physical drivers such as actual feed, biomass-time, water/energy service or limiting load; a convenient mass fraction alone is not proof of causality."
    source_ids:
      - ghg-product-allocation
  - rule_id: allocation_fallback
    applies_to: "unresolved physical causality"
    rule: "Only where a causal relation cannot be supported, disclose economic fallback using representative actual quantities and contemporaneous prices; assess sensitivity and state the reason for the fallback."
    source_ids:
      - ghg-product-allocation
  - rule_id: allocation_residues
    applies_to: "loss, waste and non-reference products"
    rule: "Do not assign final fish reference mass to rejects, mortalities, escaped stock or other products. A purposeful saleable output is not simultaneously disposal waste; treatment and upstream burdens remain explicit."
    source_ids:
      - ghg-product-allocation
  - rule_id: allocation_carryover
    applies_to: "retained broodstock and standing stock"
    rule: "Allocate production inputs to actual period cohorts; carry forward evidenced attributable burden for retained broodstock/standing fish into the next period, with consistent opening/closing stock and no loss or duplicate recognition. Escapes have separate stock/fate records, not automatic disposal waste or co-products."
    source_ids:
      - ghg-product-allocation
  - rule_id: allocation_periods
    applies_to: "cohorts and shared_services"
    rule: "Link early-life, grow-out, fallowing/cleaning, harvest and asset service to actual cohorts, runs and periods. Enumerate all asset consumers, replacement and termination events; attribution shares must reconcile across all periods without repeating manufacture or utilities."
    source_ids:
      - ghg-product-allocation
