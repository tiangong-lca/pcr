      requirement: "Identify and separately collect every actual exchange covered by “Actual nitrogen species released to declared receiving water”; retain all following collection, quantity and normalization obligations: This collection obligation belongs to the once-only shared_services central release ledger for evidenced emissions from seed_rearing, grow_out, pre_gate_transfer, harvest, preservation, dispatch and actual utility operations. Each concrete exchange records its actual source node, culture or operation unit, cohort and period, linked to a unique discharge event; do not repeat the same release at the source stage or count substances retained in collected sludge again as direct emissions. Conditional monitored/modelled dissolved or particulate nitrogen release requires compound/species, N-versus-compound mass and freshwater/sea/sediment medium before exchange resolution; no universal N factor. Flow property / unit: Mass 93a60a56-a3c8-11da-a746-0800200b9a66; Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66 / kg Amount rule: Actual attributable kg from cp_emissions_shared_services, normalized once by accepted final net fish mass Value mode: Foreground record (foreground_record) Specificity: Site-specific (site_specific) Normalization basis: per 1 kg reference flow Basis kind: Reference flow (reference_flow) Evidence kind: Collected record (collected_record) Collection protocol: cp_emissions_shared_services Establish native units, measured quantities, destinations and independent range evidence for each concrete exchange. This completion requirement supplies no child quantity, default or allowed range; establish each child range independently. No actual exchange may be omitted."
      evidence: "per-flow original records under the linked protocol, identity and destination evidence"
    - id: dq_complete_phosphorus_release
      applies_to: "shared_services; outputs; elementary"
      requirement: "Identify and separately collect every actual exchange covered by “Actual phosphorus species released to declared receiving water”; retain all following collection, quantity and normalization obligations: This collection obligation belongs to the once-only shared_services central release ledger for evidenced emissions from seed_rearing, grow_out, pre_gate_transfer, harvest, preservation, dispatch and actual utility operations. Each concrete exchange records its actual source node, culture or operation unit, cohort and period, linked to a unique discharge event; do not repeat the same release at the source stage or count substances retained in collected sludge again as direct emissions. Conditional actual phosphorus releases require dissolved/particulate form, P-versus-compound mass, background subtraction and receiving medium; reconcile feed retention, solids removal and water release. Flow property / unit: Mass 93a60a56-a3c8-11da-a746-0800200b9a66; Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66 / kg Amount rule: Actual attributable kg from cp_emissions_shared_services, normalized once by accepted final net fish mass Value mode: Foreground record (foreground_record) Specificity: Site-specific (site_specific) Normalization basis: per 1 kg reference flow Basis kind: Reference flow (reference_flow) Evidence kind: Collected record (collected_record) Collection protocol: cp_emissions_shared_services Establish native units, measured quantities, destinations and independent range evidence for each concrete exchange. This completion requirement supplies no child quantity, default or allowed range; establish each child range independently. No actual exchange may be omitted."
      evidence: "per-flow original records under the linked protocol, identity and destination evidence"
    - id: dq_complete_other_culture_emissions
      applies_to: "shared_services; outputs; elementary"
      requirement: "Identify and separately collect every actual exchange covered by “Other identified culture substances to documented compartments”; retain all following collection, quantity and normalization obligations: This collection obligation belongs to the once-only shared_services central release ledger for evidenced emissions from seed_rearing, grow_out, pre_gate_transfer, harvest, preservation, dispatch and actual utility operations. Each concrete exchange records its actual source node, culture or operation unit, cohort and period, linked to a unique discharge event; do not repeat the same release at the source stage or count substances retained in collected sludge again as direct emissions. A conditional requirement for actual treatment residues or other releases: instantiate each chemical substance and receiving medium from monitoring or justified model evidence. Aggregate organic load is not an identified elementary substance. Flow property / unit: Mass 93a60a56-a3c8-11da-a746-0800200b9a66; Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66 / kg Amount rule: Actual attributable kg from cp_emissions_shared_services, normalized once by accepted final net fish mass Value mode: Foreground record (foreground_record) Specificity: Site-specific (site_specific) Normalization basis: per 1 kg reference flow Basis kind: Reference flow (reference_flow) Evidence kind: Collected record (collected_record) Collection protocol: cp_emissions_shared_services Establish native units, measured quantities, destinations and independent range evidence for each concrete exchange. This completion requirement supplies no child quantity, default or allowed range; establish each child range independently. No actual exchange may be omitted."
      evidence: "per-flow original records under the linked protocol, identity and destination evidence"
    - id: dq_complete_other_combustion_emissions
      applies_to: "shared_services; outputs; elementary"
      requirement: "Identify and separately collect every actual exchange covered by “Identified direct combustion pollutants to actual air compartment”; retain all following collection, quantity and normalization obligations: Instantiate actual chemical species and particle size from source-specific measurements or current factor models; fuel production background must not duplicate direct exhaust. Flow property / unit: Mass 93a60a56-a3c8-11da-a746-0800200b9a66; Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66 / kg Amount rule: Actual attributable kg from cp_emissions_shared_services, normalized once by accepted final net fish mass Value mode: Foreground record (foreground_record) Specificity: Site-specific (site_specific) Normalization basis: per 1 kg reference flow Basis kind: Reference flow (reference_flow) Evidence kind: Collected record (collected_record) Collection protocol: cp_emissions_shared_services Establish native units, measured quantities, destinations and independent range evidence for each concrete exchange. This completion requirement supplies no child quantity, default or allowed range; establish each child range independently. No actual exchange may be omitted."
      evidence: "per-flow original records under the linked protocol, identity and destination evidence"
    - id: dq_complete_growout_sludge
      applies_to: "grow_out; outputs; waste"
      requirement: "Identify and independently collect every actual sediment, solid-residue and sludge waste stream; retain source stage/unit/period, removal event, wet mass, dry solids, nutrient analysis and evidenced recipient without double owning the same material. Collect under cp_waste_grow_out and normalize to final accepted net fish mass. Establish independent Range evidence and exact UUID for each child; no grouped total, bound or binding is inherited. Any unresolved actual stream, fate, quantity, range evidence or UUID makes the final dataset incomplete and fails validation; unknown is not zero."
      evidence: "per-waste-stream measurements, wet/dry basis, recipient receipts and range/identity verification"
    - id: dq_atomic_card_identity
      applies_to: "all inventory rows"
      requirement: "Each card represents one physically identified exchange, not a collection or selector. Keep Electricity as one electrical-energy flow; supplier, geography and voltage remain actual collected qualifiers, not grounds for speculative splitting. Other actual materials, waste streams, carbon origins and receiving media must have separate identities and atomic cards before completion. Preserve every existing collection obligation; an absent card or unresolved identity never means zero or a waived exchange. Paired internal water transfers retain the same actual quality, transfer id, quantity and upstream burden, without another purchase."
      evidence: "Per-card identity, provider, state, destination and paired records"
    - id: dq_atomic_range_evidence
      applies_to: "repaired atomic flow cards"
      requirement: "U_row is an unresolved evidence requirement, not a numerical estimate, default, clipping limit or completeness pass. Establish each card's own matching-unit/reference-basis upper envelope from independent representative records or a compatible documented supplier/design bound, retaining scope, method and uncertainty. Do not reuse a removed aggregate range, copy a sibling quantity, derive a bound from the target batch itself or invent a value. Applicable missing evidence blocks quantitative QA completion; actual measurements remain required."
      evidence: "Independent envelope evidence; retained raw records and uncertainty"
validation_rules:
  - rule_id: validate_reference
    applies_to: "farmed_salmonidae_handover"
    rule: "Confirm complete food Salmonidae, aquaculture origin, actual live/fresh/chilled state and first producer gate; cp_mass supports 1 kg net wet fish excluding ice, water and containers."
    source_ids:
      - salmonidae-reference-definition
  - rule_id: validate_routes
    applies_to: "grow_out and route alternatives"
    rule: "Required parent grow_out exists; own/purchased stage flags and technology deltas have current evidence and coherent coexistence. Freshwater-only trout has no automatic smolt or sea stage; evidenced staged marine routes include pre-gate transfer resources."
    source_ids:
      - fao-trout-culture
      - fao-atlantic-salmon-culture
      - noaa-atlantic-salmon-aquaculture
  - rule_id: validate_handoffs
    applies_to: "all stage outputs"
    rule: "Actual biomass/count records reconcile growth, stocking, transfers, harvest and dispatch; internal fish amounts are not fixed to final reference. State-specific preservation has before/after evidence; unknown state is a gap."
    source_ids: []
  - rule_id: validate_water_emissions
    applies_to: "water, waste and elementary cards"
    rule: "Separate supply, abstraction, circulation, return, sludge and pollutant ledgers; every actual emission has substance, element/compound basis, receiving medium and evidence. Aggregated effluent cannot duplicate substances."
    source_ids:
      - noaa-atlantic-salmon-aquaculture
  - rule_id: validate_energy
    applies_to: "shared_services"
    rule: "Match actual region/voltage/provider, heat and fuel grade; reconcile meters and direct combustion without double-counting upstream fuel/heat or non-fossil CO2."
    source_ids: []
  - rule_id: validate_outputs
    applies_to: "intentional outputs and disposal"
    rule: "Enumerate actual output handovers, residues, waste, mortality, escapes and losses. Verify subdivision/causal allocation before disclosed fallback, with all shared burdens and service periods counted once."
    source_ids:
      - ghg-product-allocation
  - rule_id: validate_coverage
    applies_to: "foreground package"
    rule: "Report performed and skipped checks, missing supplier/measurement/identity evidence, screening departures and uncertainties; only a completed data package with concrete verified exchanges can be finalized."
    source_ids: []
  - rule_id: validate_inventory_completion
    applies_to: "all concrete exchanges and section 8 completion obligations"
    rule: "Verify each applicable dq_complete obligation has separately measured and identity-verified exchange cards. Check each quantity, native unit, range evidence, normalization, receiving medium, destination and non-duplication. Any unfulfilled actual child exchange, quantity, identity or destination makes the final dataset incomplete and fails validation; unknown cannot be zero. Static PCR checking does not replace this evidence."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground data package with downstream process and lifecyclemodel projections"
  downstream_use: "secondary_dataset; background_dataset after review of actual scope, identities, measurement and completeness"
  allowed_use: "Actual aquaculture-origin whole Salmonidae human food at the declared first producer handover and state with compatible species/stage/technology context"
  excluded_use: "Wild capture, non-Salmonidae, ornamental/seed-only final outputs, gutted/head-removed fish, fillets, frozen products or unqualified geography/state substitution"
  required_metadata: "Species/family; origin; actual state/form/gate; geography/date; own/purchased seed and providers; full stage/technology graph; cohort and run periods; reference measurement; upstream linkage; co-outputs; allocation; asset service and receiving media"
  required_quality_disclosure: "Coverage and omissions; calibration; sampling; unit/material basis; current provider evidence; identities; emissions models; mortality/escapes; allocation sensitivity; provisional screens; temporal and technological representativeness"
  update_trigger: "Changed species/state/gate, seed provider/ownership, feed formulation, technology/stage route, energy mix, water source/receiver, harvest/holding, asset service, output set, factors or material evidence"
data_sources:
  - id: "fao-atlantic-salmon-culture"
    type: "official_guidance"
    reference: "FAO Cultured aquatic species fact sheet: Salmo salar; https://www.fao.org/fishery/docs/DOCUMENT/aquaculture/CulturedSpecies/file/en/en_atlanticsalmon.htm ; retrieved 2026-10-09"
    used_for: "Qualitative early-life, actual marine-stage and culture input topology; historical quantities are not defaults"
  - id: "fao-trout-culture"
    type: "official_guidance"
    reference: "FAO (2009), Oncorhynchus mykiss; https://www.fao.org/fishery/docs/DOCUMENT/aquaculture/CulturedSpecies/file/en/en_rainbowtrout.htm ; retrieved 2026-10-09"
    used_for: "Qualitative owned/purchased seed and freshwater raceway/RAS/cage alternatives; no inherited historical quantitative or medication defaults"
  - id: "noaa-atlantic-salmon-aquaculture"
    type: "official_guidance"
    reference: "NOAA Fisheries, Atlantic Salmon: Aquaculture / Sustainable Seafood; https://www.fisheries.noaa.gov/species/atlantic-salmon/seafood ; retrieved 2026-10-09"
    used_for: "Qualitative actual hatchery/transfer/marine route, feed, waste, fallowing and escape data needs; no global regulatory/numeric default"
  - id: "ghg-product-allocation"
    type: "standard"
    reference: "GHG Protocol Product Life Cycle Accounting and Reporting Standard (2011), chapter 9; https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf ; retrieved 2026-10-09"
    used_for: "Subdivision, causal physical attribution, explicit fallback and sensitivity reasoning; not a claim of whole-standard compliance"
  - id: "salmonidae-reference-definition"
    type: "method_factor"
    reference: "This PCR sections 3–4 and normalize_lot; internally defined reference normalization method"
    used_for: "Defined 1 kg reference and final 1–1 kg method-definition Range; not an external measured range"
