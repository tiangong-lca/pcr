      quality_evidence: "acceptance/sales records; allocation evidence; documented absence if single output"
    - protocol_id: cp_outputs_dispatch
      process_id: "dispatch"
      flow_role: "each additional intended product"
      record_type: "handover and sales ledger"
      raw_fields: "output identity; purpose; net mass; handover; receiving use; period; price and quantity if fallback allocation; allocation driver ; unique original shared-ledger ID; this node actual share; all-beneficiary reconciliation"
      collection_method: "Enumerate each actual intended non-reference output and its handover; demonstrate subdivision or causal physical allocation, then justified economic fallback where necessary ; use the same original shared ledger and independently reconcile this node share, never copy another node total or charge the same burden twice."
      unit: "kg"
      frequency: "each output handover and attribution review"
      temporal_coverage: "same linked cohort and output/price period as shared burdens"
      site_scope: "actual producer and receiving user"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "acceptance/sales records; allocation evidence; documented absence if single output"
  calculation_rules:
    - id: normalize_lot
      applies_to: "all inventory rows"
      rule: "Divide the actually attributable lot amount in its numerator unit by the accepted final net wet fish mass in kg; retain actual stage amounts and allocation before this single normalization."
      inputs:
        - "attributable lot amount"
        - "accepted fish mass"
        - cp_mass
        - "relevant protocol"
      output: "exchange amount per 1 kg reference flow"
      source_ids:
        - salmonidae-reference-definition
    - id: stock_reconcile
      applies_to: "stocking and movement rows"
      rule: "Reconcile beginning stock plus actual receipts and growth against transfers, harvest, deaths, escapes and ending stock; retain counts and sampled wet masses separately by stage."
      inputs:
        - cp_stock_seed_rearing
        - cp_stock_grow_out
        - cp_stock_pre_gate_transfer
        - cp_stock_harvest
        - cp_stock_preservation
        - cp_stock_dispatch
