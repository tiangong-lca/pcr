system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "grow_out and seed_rearing"
      rule: "Include actual producer-controlled biological stages and upstream purchased inputs. Own-versus-purchased stage alternatives use required parent grow_out and traced stage/cohort flags. Freshwater trout does not require marine grow-out or smoltification."
      source_ids:
        - fao-trout-culture
        - fao-atlantic-salmon-culture
    - rule_id: boundary_technology
      applies_to: "grow_out"
      rule: "Declare parent grow_out, actual flow-through/raceway, RAS or cage delta, water/infrastructure requirements and stage-specific coexistence. Include evidenced smolt readiness and pre-gate transfer for actual anadromous marine routes only."
      source_ids:
        - fao-trout-culture
        - fao-atlantic-salmon-culture
        - noaa-atlantic-salmon-aquaculture
    - rule_id: boundary_harvest
      applies_to: "harvest"
      rule: "Keep removal/acceptance separate from biomass growth so harvest resources, actual whole-fish state and losses can be reconciled at their own handoff."
      source_ids:
        - fao-trout-culture
        - fao-atlantic-salmon-culture
    - rule_id: boundary_handling
      applies_to: "preservation and dispatch"
      rule: "Include actual whole-fish live holding/chilling and packaging before first producer gate; record before/after state and duration. Independent processor transport, gut/head removal, filleting and freezing lie outside the declared category."
      source_ids:
        - noaa-atlantic-salmon-aquaculture
    - rule_id: boundary_upstream
      applies_to: "purchased inputs"
      rule: "Require upstream provider burden for actual seed, feed, treatment, utility, transfer and material purchases; prevent on-site and supplier processes from covering the same stage twice."
      source_ids:
        - fao-atlantic-salmon-culture
        - ghg-product-allocation
    - rule_id: boundary_water_release
      applies_to: "water and emissions"
      rule: "Separate purchased water, resource withdrawal, circulation, return, collected waste and actual receiving-medium emissions. Reconcile any aggregated effluent model to separately reported substances and sludge."
      source_ids:
        - noaa-atlantic-salmon-aquaculture
    - rule_id: boundary_period_assets
      applies_to: "all selected stages"
      rule: "Include relevant periods, fallowing/cleaning, shared assets, replacement and termination; identify every consuming node and attribute manufacture, maintenance and end-of-life once using actual service evidence."
      source_ids:
        - ghg-product-allocation
boundary_abstraction:
  declared_starting_condition: "Actual owned broodstock/egg/juvenile stages or purchased seed stage entering the producer system, with provider gate, upstream burden and stage ownership"
  starting_condition_role: "Explicit foreground cut-in; not a claim that unobserved purchased hatchery/feed/material burdens are zero"
  product_classification_scope: "Aquaculture Salmonidae human food; whole unheaded/ungutted narrower presentation"
  recursive_input_rule: "If same-category fish enters breeding/grow-out/holding, record actual purpose, stage and upstream provider/version separately; stop recursion at an evidenced upstream dataset boundary, never replace an input with the final reference output"
  upstream_dataset_requirement: "Seed/provider and feed ingredients/processing; water, energy and material supply; controlled pre-gate transport; relevant infrastructure manufacture, maintenance and end-of-life; disclose missing evidence"
  disclosure: "Actual stage graph; own/purchased seed; technology and region; freshwater/marine source and discharge; live/fresh/chilled handover; periods/cohorts; support assets; direct releases; included/excluded upstream and post-gate operations; unresolved evidence"
