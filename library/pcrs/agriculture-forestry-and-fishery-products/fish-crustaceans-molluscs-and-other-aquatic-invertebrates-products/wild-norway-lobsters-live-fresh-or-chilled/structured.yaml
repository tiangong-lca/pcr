    used_for: "Classification scope only; the live whole creel boundary is narrower, not entire-leaf coverage."
  - id: "seafish-nephrops-creels"
    type: "official_guidance"
    reference: "Seafish, Pots and Trap - Nephrops; https://www.seafish.org/responsible-sourcing/fishing-gear-database/gear/pots-and-trap-nephrops/ ; accessed 2026-10-10"
    used_for: "Qualitative creel, bait, sorting, tubes and seawater interfaces only; no universal quantities, minimal-bycatch, survival or environmental-performance claim."
  - id: "seafish-nephrops-live-handling-1993"
    type: "literature"
    reference: "M. Jacklin, Assessment of Stress and Mortality of the Prawn (Nephrops norvegicus) During Live Handling from Vessel to Market, Seafish Technology SR424, August 1996 (reprinted January 2005); report PDF: https://www.seafish.org/media/dfpdk3me/assessment-of-stress-and-mortality-of-the-prawn-nephrops-norvegicus-during-live-handling-from-vessel-to-market.pdf ; landing-page record 32441: https://www.seafish.org/document/?id=32441 (page metadata date: 01 August 1993; report publication/reprint dates follow its cover); historical summary accessed 2026-10-10"
    used_for: "Historical landing-page summary supports the qualitative handling-stage context and actual-intervention collection only; the report cover is cited only for publication/reprint metadata. No experimental rates or recommended conditions; export transport outside gate excluded."
  - id: "reference-normalization-identity"
    type: "method_factor"
    reference: "Reference Flow definition in section 3 of this PCR: the inventory is expressed for exactly 1 kg accepted reference output."
    used_for: "Mathematical normalization identity only, not a yield, measured survival or empirical bound."
