      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Wild marine Nephrops capture context before creel setting/hauling; actual purchased supplies and complete attributable trip, not purchased final live animals |\n| starting_condition_role | Source-to-collected-output capture responsibility, independent of later grading/live maintenance |\n| product_classification_scope | CPC 3.0 04341 mapping is narrower: wild creel, live whole native shell food only |\n| recursive_input_rule | Do not recursively relabel purchased same-category live animals as wild capture. Explicitly received same-category lots require traceable upstream capture datasets and a separate declared aggregation boundary; they do not replace this source boundary or count internal transfers as new production. |\n| upstream_dataset_requirement | Identity-, region-, technology- and period-compatible supplies, assets and services; disclose cradle-to-supply content and explicit unavailable background links without erasing foreground quantities |\n| disclosure | Physical first handover onshore/offshore, actual event sequence and bypass, producer return/idle/maintenance coverage, shared consumers, asset service periods, live condition and all destinations |\n\n### Boundary Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| b_scope | reference product | Only the declared live creel product is reference; adjacent trawl/dead/processed products require other methodology. Source notes establish qualitative route interfaces, not numerical/legal/sustainability constraints. | un-cpc3-notes; seafish-nephrops-creels |\n| b_events | all process nodes | Map nodes are responsibility classes, not mandatory chronology. Declare every actual event/pass, incoming and outgoing state, predecessor/successor and transfer owner; grading can occur before/after holding or protection and repeat. Independent grading, holding and protection bypass when absent; initial capture screening and final acceptance remain with their real capture/handover owners; handover remains responsible for real local resources and losses independently of packaging. | seafish-nephrops-creels; seafish-nephrops-live-handling-1993 |\n| b_period | complete attributable producer service | The physical handover gate excludes buyer transport/distribution after acceptance but does not truncate necessary producer return travel, empty running, idle, cleaning, maintenance, asset replacement or retirement attributable to the completed trip/service period. Record acquisition, use and end-of-service periods and ownership; no universal lifetime. Zero-output periods retain documented burdens via justified opening/closing carrying records and cannot be erased or divided by zero. |  |\n| b_water | actual water and live maintenance | Holding may bypass; if bounded holding actually occurs, only the evidenced seawater-based family is covered here, not non-immersed/dry or mist variants. No mandatory specific seawater system, tubes, oxygen, fasting, temperature or duration. Record actual fit-for-purpose condition-control evidence without imposing historical experimental settings. Bought water, direct abstraction, circulation, evaporation, discharge and material carrier water remain distinct; never add recirculation as new supply or assume ice is appropriate for live animals. | seafish-nephrops-creels; seafish-nephrops-live-handling-1993 |\n| b_external | each actual output at every node | For each component and event record one actual destination: internal transfer/stock, independent intended external product, actual waste recipient, environmental return or explicitly unresolved destination. Life, commercial grade, food acceptance and legal context are separate; failure does not imply a lawful coproduct. Record actual permits/recipient acceptance without this PCR granting them. |  |\n\n"
