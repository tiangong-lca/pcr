validation_rules:
  - rule_id: v_reference
    applies_to: "producer_handover_accepted_reference"
    rule: "One actual final accepted live whole Nephrops creel food output with positive same-lot net wet animal mass; match reference link/name/state/property/unit. Exclude nonlive or excluded-route output from denominator."
    source_ids: []
  - rule_id: v_balance
    applies_to: "all events and destinations"
    rule: "Reconcile unallocated node/pass animal and constituent ledgers, paired actual receipts/transfers, opening/closing stocks, actual water changes, waste/releases and accepted independent outputs. Record unexplained residuals; economic allocation is not closure. Post-capture mortality belongs to its actual node; output sets are mutually exclusive."
    source_ids: []
  - rule_id: v_mode_period
    applies_to: "trip/lot; shared events; service periods"
    rule: "Verify actual activation, event sequence, changeover/cleaning, supplier inclusions, all shared consumers, return/idle/maintenance and acquisition/replacement/retirement periods. Check fractions and carried burdens once, zero-output-period handling and no duplicate coproduct allocation at final handover."
    source_ids: []
  - rule_id: v_ranges_units
    applies_to: "all cards"
    rule: "Check every dimensioned Range, final normalization identity, independent U evidence, native service unit and support identity, power conversion and mass/tare/water basis. Missing U/support/UUID evidence remains unresolved; checker success is not an empirical or publication-readiness conclusion."
    source_ids: []
  - rule_id: v_sources
    applies_to: "product and methodology claims"
    rule: "Source use is bounded to the explicitly cited qualitative interface/classification or historical summary. Reject universal bycatch, mortality, shelf-life, impact, legal, temperature, duration or asset-life claims without applicable current evidence."
    source_ids:
      - seafish-nephrops-creels
      - seafish-nephrops-live-handling-1993
  - rule_id: validate_atomic_completion
    applies_to: "all applicable collection requirements and concrete inventory exchanges"
    rule: "Resolve every applicable section-8 collection requirement into individual physical/chemical exchanges with their own quantities, native units, composition/state, range basis or explicit uncertainty evidence, raw records, normalization, actual destinations/receiving media and verified compatible UUIDs. Any unresolved applicable requirement makes the final dataset incomplete and validation fails; unknown is not zero. Never copy aggregate amounts onto components or duplicate inclusive services with owned fuel/electricity/direct releases. Internal transfers are not fixed to the final 1 kg."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Complete foreground package projected to process/lifecyclemodel only after concrete identities and missing evidence are resolved"
  allowed_use: "Declared species, creel route, live whole food gate, actual region/period and provider scope with uncertainty disclosure"
  excluded_use: "Trawl, aquaculture, other species, dead/processed/ornamental forms, buyer distribution, safety/legal/survival/sustainability certification or use of unresolved quantities as verified data"
  required_metadata: "All reference qualifiers; scope/event/pass map; unit and support identities; node protocols; raw/physical/attributed ledgers; all output destinations; complete periods; allocation and provider inclusions; sources and version"
  required_quality_disclosure: "Representativeness, measurements and estimation, uncertainty, independent range envelopes, residuals, backgrounds, unresolved identities/support and attribution; no implied readiness from structure alone"
  update_trigger: "Changed species/route/state/gate, actual handling/supplier scope, source/range evidence, shared infrastructure/service period, identity/support or allocation context"
data_sources:
  - id: "un-cpc3-notes"
