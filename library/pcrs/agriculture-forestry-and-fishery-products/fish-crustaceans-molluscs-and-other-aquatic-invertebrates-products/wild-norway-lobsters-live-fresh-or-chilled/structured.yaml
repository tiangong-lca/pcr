allocation_rules:
  - rule_id: a_physical
    applies_to: "all cards and process passes"
    rule: "First retain the unallocated physical/native-unit ledger, opening stock + receipts/removal = transfers + independent products + waste + environmental returns + closing stock + explicitly evidenced water/material changes or unresolved residual. Animal, bait, packaging and water ledgers are separate and composition-linked; no service/energy is added to animal mass. Pair internal transfers and keep their burdens without treating them as new production. Normalize these physical quantities by the positive same-lot final net accepted animal kg; allocation shares never close mass or hide a loss."
    source_ids: []
  - rule_id: a_coproduct
    applies_to: "every actual independent external output at creel_capture; live_grading; live_holding; live_protection; producer_handover"
    rule: "Enumerate actual accepted intended outputs and their distinct handovers. Avoid coproduct allocation through measured subdivision first. For the remaining genuinely shared producer activity, select and document a causal physical relationship supported by trip/handling measurements; otherwise apply consistent economic shares using matched period, grade and handover prices, disclose price/volume evidence and sensitivity. No mandatory mass allocation, zero-value waste credit or automatic substitution. Separate LCA attribution from physical amounts, apply a chosen share once to its owned shared burden, and do not duplicate an existing split at handover. Protect shares of products that have already left at an evidenced external handover; do not reopen those shares. If the remaining internal stream later separates into a newly accepted intended product and the continuing reference stream, split only its remaining carried upstream burden pool plus genuinely shared subsequent burdens once at that new separation, using the stated attribution precedence. Later product recognition does not make common capture burdens zero. Dedicated later burdens remain with their actual recipient; do not apply the same split again merely because the gate or grade changes. Missing evidence blocks final allocation; inspection failure alone cannot create a coproduct."
    source_ids: []
  - rule_id: a_shared
    applies_to: "shared vessels; hauling equipment; holding tanks; tubes/crates; quay facilities; utilities and services"
    rule: "Identify each shared asset/service, all consuming nodes/other products and complete service periods. Direct-meter exclusive consumption first; partition residual burdens using evidenced causal service demand, e.g. actual equipment hours or occupied holding capacity-time with configuration evidence, not arbitrary equal shares. Track fractions summing to the owned total including other users, replacement/retirement and carried burdens; exclude manufacture/energy/waste already included by providers. The node ledger owns each event once, separately from any subsequent once-only coproduct allocation."
    source_ids: []
  - rule_id: a_period
    applies_to: "trip; haul; lot; event/pass; holding interval; asset service and reporting periods"
    rule: "Link catches, supplies, cleaning/changeover, return/idle/maintenance and acquisition/replacement/retirement to actual periods and consumers. Reconcile opening/closing live stock and associated carried burdens across period cuts. A zero-reference-output period retains justified burdens pending an evidenced service/period attribution; no division by zero, silent deletion, fictitious output or routine reassignment solely to successful lots. No double annualization or repeated whole-asset charge."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_creel_capture
      process_id: "creel_capture"
      flow_role: "All actual node-owned cards; distinct identity/state/pass records"
      record_type: "Calibrated measurements; logs; invoices; acceptance and custody records"
      raw_fields: "trip/lot/event/pass ids; predecessor/successor and transfer ids; species; live/dead and whole/condition; grade; net wet/gross/tare/separable-water mass; counts; recipient/use; opening/closing stocks; material identity/composition; native quantity/unit; fuel NCV/carbon; power meter; service hours/provider inclusion; water supply/abstraction/circulation/discharge/evaporation; actual conditions/time; all destinations; shared consumers; asset periods; independent U evidence; uncertainty  auxiliary conditions where relevant: temperature value and declared scale (e.g. °C), and other numeric conditions with their own declared units; event start/end timestamps and time zone; elapsed value and min/h unit; categorical life/fresh/chilled/never-frozen state and its evidence;"
      collection_method: "Weigh same-state lots with calibrated scales and actual tare; meter utilities and service hours or retain supplier records with scope; reconcile event logs, stock and recipients. Capture removal/returns use traceable observed catch weighing, with documented estimation only when weighing impossible. At handover use calibrated accepted net live animal mass and receipt. No universal conversion or missing-as-zero.  Collect relevant temperature with a calibrated sensor and location/time record, elapsed duration from timestamped events, and categories from traceable state/history records. These auxiliary descriptors are not kg inventory amounts and supply no universal temperature/time limits."
      unit: "kg; MJ; h; actual native units; categorical state/time"
      frequency: "Each actual event/pass and transfer; meters by applicable interval; each asset event"
