      applies_to: "all process nodes"
      rule: "Map nodes are responsibility classes, not mandatory chronology. Declare every actual event/pass, incoming and outgoing state, predecessor/successor and transfer owner; grading can occur before/after holding or protection and repeat. Independent grading, holding and protection bypass when absent; initial capture screening and final acceptance remain with their real capture/handover owners; handover remains responsible for real local resources and losses independently of packaging."
      source_ids:
