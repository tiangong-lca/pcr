      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| a_physical | all cards and process passes | First retain the unallocated physical/native-unit ledger, opening stock + receipts/removal = transfers + independent products + waste + environmental returns + closing stock + explicitly evidenced water/material changes or unresolved residual. Animal, bait, packaging and water ledgers are separate and composition-linked; no service/energy is added to animal mass. Pair internal transfers and keep their burdens without treating them as new production. Normalize these physical quantities by the positive same-lot final net accepted animal kg; allocation shares never close mass or hide a loss. |  |\n| a_coproduct | every actual independent external output at creel_capture; live_grading; live_holding; live_protection; producer_handover | Enumerate actual accepted intended outputs and their distinct handovers. Avoid coproduct allocation through measured subdivision first. For the remaining genuinely shared producer activity, select and document a causal physical relationship supported by trip/handling measurements; otherwise apply consistent economic shares using matched period, grade and handover prices, disclose price/volume evidence and sensitivity. No mandatory mass allocation, zero-value waste credit or automatic substitution. Separate LCA attribution from physical amounts, apply a chosen share once to its owned shared burden, and do not duplicate an existing split at handover. Protect shares of products that have already left at an evidenced external handover; do not reopen those shares. If the remaining internal stream later separates into a newly accepted intended product and the continuing reference stream, split only its remaining carried upstream burden pool plus genuinely shared subsequent burdens once at that new separation, using the stated attribution precedence. Later product recognition does not make common capture burdens zero. Dedicated later burdens remain with their actual recipient; do not apply the same split again merely because the gate or grade changes. Missing evidence blocks final allocation; inspection failure alone cannot create a coproduct. |  |\n| a_shared | shared vessels; hauling equipment; holding tanks; tubes/crates; quay facilities; utilities and services | Identify each shared asset/service, all consuming nodes/other products and complete service periods. Direct-meter exclusive consumption first; partition residual burdens using evidenced causal service demand, e.g. actual equipment hours or occupied holding capacity-time with configuration evidence, not arbitrary equal shares. Track fractions summing to the owned total including other users, replacement/retirement and carried burdens; exclude manufacture/energy/waste already included by providers. The node ledger owns each event once, separately from any subsequent once-only coproduct allocation. |  |\n| a_period | trip; haul; lot; event/pass; holding interval; asset service and reporting periods | Link catches, supplies, cleaning/changeover, return/idle/maintenance and acquisition/replacement/retirement to actual periods and consumers. Reconcile opening/closing live stock and associated carried burdens across period cuts. A zero-reference-output period retains justified burdens pending an evidenced service/period attribution; no division by zero, silent deletion, fictitious output or routine reassignment solely to successful lots. No double annualization or repeated whole-asset charge. |  |\n\n"
