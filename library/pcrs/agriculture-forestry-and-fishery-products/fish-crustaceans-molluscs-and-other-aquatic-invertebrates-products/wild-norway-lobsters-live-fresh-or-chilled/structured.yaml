    - rule_id: b_water
      applies_to: "actual water and live maintenance"
      rule: "Holding may bypass; if bounded holding actually occurs, only the evidenced seawater-based family is covered here, not non-immersed/dry or mist variants. No mandatory specific seawater system, tubes, oxygen, fasting, temperature or duration. Record actual fit-for-purpose condition-control evidence without imposing historical experimental settings. Bought water, direct abstraction, circulation, evaporation, discharge and material carrier water remain distinct; never add recirculation as new supply or assume ice is appropriate for live animals."
      source_ids:
        - seafish-nephrops-creels
        - seafish-nephrops-live-handling-1993
    - rule_id: b_external
      applies_to: "each actual output at every node"
      rule: "For each component and event record one actual destination: internal transfer/stock, independent intended external product, actual waste recipient, environmental return or explicitly unresolved destination. Life, commercial grade, food acceptance and legal context are separate; failure does not imply a lawful coproduct. Record actual permits/recipient acceptance without this PCR granting them."
