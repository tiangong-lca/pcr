    - rule_id: b_period
      applies_to: "complete attributable producer service"
      rule: "The physical handover gate excludes buyer transport/distribution after acceptance but does not truncate necessary producer return travel, empty running, idle, cleaning, maintenance, asset replacement or retirement attributable to the completed trip/service period. Record acquisition, use and end-of-service periods and ownership; no universal lifetime. Zero-output periods retain documented burdens via justified opening/closing carrying records and cannot be erased or divided by zero."
