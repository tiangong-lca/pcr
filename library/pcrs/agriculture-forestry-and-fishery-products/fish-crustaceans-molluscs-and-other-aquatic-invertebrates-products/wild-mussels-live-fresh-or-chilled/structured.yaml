validation_rules:
  - rule_id: validation_product_gate
    applies_to: "foreground package"
    rule: "Verify wild Mytilus edulis boat hand-raked, alive whole native shell, exact first physical harvester recipient/gate before intentional depuration, accepted net animal mass, independently recorded tare and actual state. Reject scope substitution and safety/certification inference."
    source_ids: []
  - rule_id: validation_nodes_transfers
    applies_to: "foreground package"
    rule: "Each actually active node/pass has own protocol, all actual resources/packages and complete product/waste/elementary fates. Check performed/bypass/overlap sequence, paired transfer state/mass/custody and physical stock balances; activate independent grading only with two or more real destination states."
    source_ids: []
  - rule_id: validation_attribution
    applies_to: "foreground package"
    rule: "Check trip/tide batch and period coverage, full attributable return/idle/support, actual shared asset consumers and unique event ownership, independent intended outputs and remaining-pool later splits. No repeat externalized shares, provider/direct overlaps, automatic waste coproducts or zero-output zero burdens."
    source_ids: []
  - rule_id: validation_medium_biology
    applies_to: "foreground package"
    rule: "Check environmental withdrawal versus product water, new supply versus recirculation, air versus aqueous/soil receivers, contained waste versus elementary release, actual organism condition and biological mass residuals. No fossil CO2 substitution for animal respiration or default carbon/impact credits."
    source_ids: []
  - rule_id: validation_ranges_units
    applies_to: "foreground package"
    rule: "Every card has unit/role/basis/evidence and row-specific U gap or normalization-only 1..1; independently support concrete bounds before treating them as empirical. Do not use batch self-maximum, clipping or unsupported native-unit/support conversion. Positive measured reference denominator is required."
    source_ids: []
  - rule_id: validation_binding_projection
    applies_to: "foreground package"
    rule: "Each final concrete exchange needs verified compatible UUID and support details; unresolved cards remain explicit, without invented matches. English/Chinese card ids, fields, rules and all tables align; regenerate projection and check deterministic fingerprints. Structural pass is not external factual verification."
    source_ids: []
  - rule_id: validate_atomic_completion
    applies_to: "all applicable collection requirements and concrete inventory exchanges"
    rule: "Resolve every applicable section-8 collection requirement into individual physical/chemical exchanges with their own quantities, native units, composition/state, range basis or explicit uncertainty evidence, raw records, normalization, actual destinations/receiving media and verified compatible UUIDs. Any unresolved applicable requirement makes the final dataset incomplete and validation fails; unknown is not zero. Never copy aggregate amounts onto components or duplicate inclusive services with owned fuel/electricity/direct releases. Internal transfers are not fixed to the final 1 kg."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground data package with downstream process/lifecyclemodel/flow projections"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Declared matching wild live whole boat-hand-raked Mytilus edulis at first harvester pre-depuration physical gate after factual identities and data gaps are resolved"
  excluded_use: "Other species/routes, farming/relaying growout, harvester depurated output, ready-to-eat or sustainable certification, processed/dead products or whole-leaf coverage claims"
  required_metadata: "Species, wild bed/geography, boat/rake actual technology, trip/tide/lot, node/pass sequence, life/cleaning/byssus/package state, physical recipient/gate, period/stock/resource ownership, intended outputs and attribution"
  required_quality_disclosure: "Unresolved identity/support/Range evidence, actual calibration and net exclusions, missing and zero-output periods, biological/medium/fate uncertainty, conversion and service inclusions, mapping narrower limit"
  update_trigger: "Species, capture method, prior management, purpose of storage/purification, physical gate, output set, technology/provider, attribution or material evidence changes"
data_sources:
  - id: "un-cpc3-notes-2025"
    type: "official_guidance"
    reference: "UN Statistics Division, CPC 3.0 explanatory notes, 30 June 2025, printed pp. 50, 78; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf ; retrieved 2026-10-10"
    used_for: "Wild/farmed and processed classification boundaries; narrower relation, not species-route facts"
  - id: "conwy-specification"
    type: "official_guidance"
    reference: "Defra, Conwy Mussels product specification, 2015, printed pp. 2, 4–5; https://assets.publishing.service.gov.uk/media/5fd3492de90e07662b09d927/product_specification_conwy-mussels_v2.pdf ; retrieved 2026-10-10"
    used_for: "Qualitative species, natural bed, boat hand-rake and pre-purification interface; short storage/surface washing. Local numbers, legal, food-safety and environmental marketing claims not imported"
  - id: "welsh-conwy-hand-raking"
    type: "official_guidance"
    reference: "Welsh Government Food & Drink, Conwy Mussels; https://foodanddrink.wales/conwy-mussels ; retrieved 2026-10-10"
    used_for: "Independent actual natural-bed boat-hand-raking route confirmation only; no sustainable/zero-impact claim"
  - id: "fao-bivalve-depuration-2008"
    type: "official_guidance"
    reference: "Lee, Lovatelli and Ababouch, FAO Fisheries Technical Paper 511, 2008, abstract and chapter 7; https://www.fao.org/4/i0201e/i0201e00.htm ; retrieved 2026-10-10"
    used_for: "Qualitative intentional depuration distinction, handling and conditional surface cleaning/byssus duties; no universal sanitary or numeric requirement"
  - id: "reference-normalization-identity"
    type: "method_factor"
    reference: "Dimensional identity: accepted reference quantity divided by the same accepted reference quantity equals 1; not an empirical yield"
    used_for: "Final card 1..1 only; does not bound intermediate throughput"
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:1f3344fbcbd039b1ec4e875179ab7105b050d96f05e2fbe237a0998828ef16eb"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_4683"
      family: "system_boundary"
      span:
        start:
          offset: 4683
          line: 54
          column: 1
        end:
          offset: 8074
          line: 78
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Wild natural-bed Mytilus edulis immediately before the selected boat hand-raking capture event, with actual bed, date and prior management disclosed |\n| starting_condition_role | Environmental wild resource, not a purchased seed or assigned zero-burden farmed input |\n| product_classification_scope | CPC 3.0 04431; narrower |\n| recursive_input_rule | Same-species internal live transfers of the original captured animals retain original capture and carried burdens with paired ids. Externally purchased animals are outside this first-harvester natural-capture reference scope, even if an upstream dataset exists; do not mix them into its accepted reference denominator. |\n| upstream_dataset_requirement | Compatible actual fuel, electricity, supplied water, materials, packaging and service/asset datasets with inclusion boundaries disclosed; no duplicated embedded direct inputs |\n| disclosure | Actual capture context, physical gate, pre-depuration state, recipient, performed/bypassed/repeated nodes, complete output/fate and period/resource ownership; unresolved identities and empirical Range gaps |\n\n### Boundary Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `boundary_gate` | product system | Capture through all actual harvester pre-gate duties and first physical acceptance; include attributable return/idle/access/support even after offshore handover. Exclude buyer purification, onward distribution, retail and cooking. | `conwy-specification` |\n| `boundary_depuration` | product system | Intentional sanitary depuration/relaying or managed growout before gate is outside this scope, not a burden-free bypass. Washing and nonpurifying short live maintenance need actual purpose/ownership evidence. No claim that depuration removes every hazard. | `fao-bivalve-depuration-2008` |\n| `boundary_sequence` | product system | Six responsibility nodes do not prescribe one universal chronology: record every actual node/pass, state, bypass and overlap; one operation has one owner. Conditional grading needs two or more real destination states. Buyer postgate grading is excluded. | `conwy-specification` |\n| `boundary_stocks` | product system | Maintain full physical live-animal, external-material, water, fuel and package ledgers with opening/closing stocks and paired transfers; shared boats/rakes/pontoons/metered utilities/storage assets span actual consuming nodes and periods. Replacement and retirement are evidenced, no default lifetime. |  |\n| `boundary_receivers` | product system | Every actual material fate declares containment, receiver and environmental medium or technosphere destination. Biological activity and habitat disturbance remain evidenced quantities/qualitative uncertainty, not automatic fossil CO2, negative catch, harmlessness or sequestration credits. |  |\n| `boundary_operating_responsibility` | all direct resources and emissions | Own/owned refers to direct foreground operation/control and fuel/resource-consumption responsibility, not legal asset title. Include rented or borrowed self-operated equipment; exclude components already represented by a provider-inclusive service. Apply this definition to direct fuel, combustion, water, compression and asset/service records with one event owner. |  |\n\n"
