      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `allocation_physical_ledger` | physical ledger and burden attribution | Retain complete physical throughput, stocks, mortality, rejects and releases before LCA attribution; an allocated quantity never replaces real material balance. Same live lot is counted once at actual final gate. |  |\n| `allocation_event_ownership` | physical ledger and burden attribution | Assign each fuel/electricity/water/package/service/asset event uniquely to actual consuming node/pass and period using causal duty or measured service evidence. Then attribute outputs separately; do not use coproduct allocation to hide duplicate node ownership. |  |\n| `allocation_output_set` | physical ledger and burden attribution | Enumerate all genuine independent intended outputs, grades and handoffs, including any intended nonreference species; retained incidental material, waste or released animals do not become coproducts automatically. First avoid allocation by measured subdivision; otherwise justify a physically causal relation, with a documented economic alternative only when physical attribution is unsupported. Neither wet mass nor price is a universal default. |  |\n| `allocation_later_split` | physical ledger and burden attribution | At a genuine later split divide the remaining carried upstream pool plus genuinely shared subsequent burdens. Preserve previously externalized output shares; never repeat the full upstream split, omit retained carried burden or give a late grade free capture. Internal transfers carry ownership, not a second purchase. |  |\n| `allocation_periods` | physical ledger and burden attribution | Link capture trips, live-stock carryover, fuel/package stocks, cleaning/changeovers, boat/rake/landing/storage asset acquisition, replacement and retirement to actual periods and consuming nodes. Reconcile service/asset shares over the declared period; no fixed lifetime or annualization. Provider-inclusive services and direct materials/emissions must not overlap. |  |\n| `allocation_zero_output` | physical ledger and burden attribution | Normalize the attributed inventory only by measured positive accepted reference mass for the corresponding period/lot. When the denominator is zero or unknown, retain actual burdens and fates and report the nonreference period/data gap; never divide by zero, invent a yield or set burden to zero. |  |\n\n"
