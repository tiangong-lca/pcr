      markdown: "## 9. Validation Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `validation_product_gate` | foreground package | Verify wild Mytilus edulis boat hand-raked, alive whole native shell, exact first physical harvester recipient/gate before intentional depuration, accepted net animal mass, independently recorded tare and actual state. Reject scope substitution and safety/certification inference. |  |\n| `validation_nodes_transfers` | foreground package | Each actually active node/pass has own protocol, all actual resources/packages and complete product/waste/elementary fates. Check performed/bypass/overlap sequence, paired transfer state/mass/custody and physical stock balances; activate independent grading only with two or more real destination states. |  |\n| `validation_attribution` | foreground package | Check trip/tide batch and period coverage, full attributable return/idle/support, actual shared asset consumers and unique event ownership, independent intended outputs and remaining-pool later splits. No repeat externalized shares, provider/direct overlaps, automatic waste coproducts or zero-output zero burdens. |  |\n| `validation_medium_biology` | foreground package | Check environmental withdrawal versus product water, new supply versus recirculation, air versus aqueous/soil receivers, contained waste versus elementary release, actual organism condition and biological mass residuals. No fossil CO2 substitution for animal respiration or default carbon/impact credits. |  |\n| `validation_ranges_units` | foreground package | Every card has unit/role/basis/evidence and row-specific U gap or normalization-only 1..1; independently support concrete bounds before treating them as empirical. Do not use batch self-maximum, clipping or unsupported native-unit/support conversion. Positive measured reference denominator is required. |  |\n| `validation_binding_projection` | foreground package | Each final concrete exchange needs verified compatible UUID and support details; unresolved cards remain explicit, without invented matches. English/Chinese card ids, fields, rules and all tables align; regenerate projection and check deterministic fingerprints. Structural pass is not external factual verification. |  |\n| `validate_atomic_completion` | all applicable collection requirements and concrete inventory exchanges | Resolve every applicable section-8 collection requirement into individual physical/chemical exchanges with their own quantities, native units, composition/state, range basis or explicit uncertainty evidence, raw records, normalization, actual destinations/receiving media and verified compatible UUIDs. Any unresolved applicable requirement makes the final dataset incomplete and validation fails; unknown is not zero. Never copy aggregate amounts onto components or duplicate inclusive services with owned fuel/electricity/direct releases. Internal transfers are not fixed to the final 1 kg. | |\n\n"
