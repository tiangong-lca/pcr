  calculation_rules:
    - id: normalize_inventory
      applies_to: "all inventory rows"
      rule: "Preserve physical event quantities and stock movement, assign unique node/period ownership, then apply the documented independent output decision; divide attributed quantities by positive measured accepted net reference mass, retaining each numerator native unit."
      inputs:
        - "Node protocols"
        - "event/period owners"
        - "output decisions"
        - "accepted mass"
      output: "Attributed inventory per 1 kg reference flow and separate complete physical ledger"
      source_ids: []
    - id: mass_and_stock
      applies_to: "physical material ledger"
      rule: "Opening stock + actual receipts/removal = actual departures + closing stock + recorded losses/release, separately by animal/external/water/package/substance category and state; retain biological uptake/release and measurement uncertainty, not a forced unexplained animal loss."
      inputs:
        - "Node protocols"
        - "measured paired transfers and stocks"
      output: "State-specific reconciled balance and explicit residual uncertainty"
      source_ids: []
    - id: range_support
      applies_to: "each nonreference quantity range"
      rule: "U_<row_id> is an unresolved row-specific evidence requirement, not a numerical bound/default. Obtain a representative independent external or held-out reviewed sample with matching technology, unit and denominator; never validate a batch against its own maximum. Do not clip, erase or silently reject genuine outliers. Reference 1..1 is only normalization identity."
      inputs:
        - "Independent representative Range evidence and actual node protocols"
      output: "Supported guardrails or disclosed unresolved evidence gap"
      source_ids: []
  data_quality_requirements:
    - id: identity_scope
      applies_to: "actual product and gate"
      requirement: "Confirm species, wild natural bed, boat hand-rake method, live whole state, net basis and first recipient before intentional depuration; disclose ambiguity and no ready-to-eat/sustainability inference."
      evidence: "Species/route and recipient records; Conwy qualitative evidence"
    - id: complete_events
      applies_to: "each node and period"
      requirement: "Resolve actual sequence, two-or-more sorting states where active, transfers, shared-resource owners, opening/closing stock, every intended output and receiver-specific fate. Missing or zero-output periods keep burdens; absence is evidenced, never presumed."
      evidence: "Complete trip/pass/period records; stock/recipient reconciliation"
    - id: identities_ranges
      applies_to: "each actual exchange and range"
      requirement: "Resolve each concrete flow identity and support property/group separately before final data production. Keep U gaps, independent sample representativeness, biological residual, conversion and emission-factor uncertainty explicit. Checker success does not verify these facts."
      evidence: "Actual detail evidence, calibrated collection, independent Range sample and documented method"
    - id: collect_rake_fuel
      applies_to: "rake; Inputs; Product flows: Actual directly used fuel products"
      requirement: "Add a separate inventory exchange for each actual physical or chemical flow; determine its identity, flow type, composition/state, native property/unit, provider or receiving medium/destination. Preserve actual unallocated quantities, raw records and normalization under the collection duties below. This requirement is not a collection exchange, an assumed zero, or permission to copy aggregate amounts, ranges or UUIDs onto its components. Activate only for fuel actually consumed under direct foreground operating/fuelling responsibility by a boat, vehicle, pump or other equipment assigned to this node and period, regardless of legal asset ownership. Specify fuel composition, biogenic/fossil fractions and supplier. Exclude fuel already included in a purchased service. Flow property / unit: Mass 93a60a56-a3c8-11da-a746-0800200b9a66 / kg; Amount rule: Reconcile purchases and opening/closing fuel stocks to actual consumption; attribute the one resource event once.; Value mode: Foreground record (foreground_record); Specificity: site_specific; Normalization basis: per 1 kg reference flow; Basis kind: Reference flow (reference_flow); Evidence kind: Collected record (collected_record); Collection protocol: cp_rake Range-evidence collection duty (not an established interval and never copied onto each concrete exchange): Range: Unresolved independent empirical QA envelope; no numerical default Range role: QA guardrail (qa_guardrail) Lower: 0 Upper: U_rake_fuel Unit: kg Basis: per 1 kg reference flow Basis kind: Reference flow (reference_flow) Evidence kind: Reasoned estimate (reasoned_estimate)"
      evidence: "Raw measured/activity, composition, transfer/destination, supplier scope and independent range evidence; cp_rake;"
