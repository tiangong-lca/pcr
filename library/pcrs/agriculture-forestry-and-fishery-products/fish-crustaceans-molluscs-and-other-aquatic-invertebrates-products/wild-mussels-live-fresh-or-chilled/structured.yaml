system_boundary:
  rules:
    - rule_id: boundary_gate
      applies_to: "product system"
      rule: "Capture through all actual harvester pre-gate duties and first physical acceptance; include attributable return/idle/access/support even after offshore handover. Exclude buyer purification, onward distribution, retail and cooking."
      source_ids:
        - conwy-specification
    - rule_id: boundary_depuration
      applies_to: "product system"
      rule: "Intentional sanitary depuration/relaying or managed growout before gate is outside this scope, not a burden-free bypass. Washing and nonpurifying short live maintenance need actual purpose/ownership evidence. No claim that depuration removes every hazard."
      source_ids:
        - fao-bivalve-depuration-2008
    - rule_id: boundary_sequence
      applies_to: "product system"
      rule: "Six responsibility nodes do not prescribe one universal chronology: record every actual node/pass, state, bypass and overlap; one operation has one owner. Conditional grading needs two or more real destination states. Buyer postgate grading is excluded."
      source_ids:
        - conwy-specification
    - rule_id: boundary_stocks
      applies_to: "product system"
      rule: "Maintain full physical live-animal, external-material, water, fuel and package ledgers with opening/closing stocks and paired transfers; shared boats/rakes/pontoons/metered utilities/storage assets span actual consuming nodes and periods. Replacement and retirement are evidenced, no default lifetime."
      source_ids: []
    - rule_id: boundary_receivers
      applies_to: "product system"
      rule: "Every actual material fate declares containment, receiver and environmental medium or technosphere destination. Biological activity and habitat disturbance remain evidenced quantities/qualitative uncertainty, not automatic fossil CO2, negative catch, harmlessness or sequestration credits."
      source_ids: []
    - rule_id: boundary_operating_responsibility
      applies_to: "all direct resources and emissions"
      rule: "Own/owned refers to direct foreground operation/control and fuel/resource-consumption responsibility, not legal asset title. Include rented or borrowed self-operated equipment; exclude components already represented by a provider-inclusive service. Apply this definition to direct fuel, combustion, water, compression and asset/service records with one event owner."
      source_ids: []
