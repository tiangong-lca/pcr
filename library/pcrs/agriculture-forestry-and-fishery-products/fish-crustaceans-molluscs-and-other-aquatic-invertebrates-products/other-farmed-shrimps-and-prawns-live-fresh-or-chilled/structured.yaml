system_boundary:
  rules:
    - rule_id: b_route
      applies_to: "route"
      rule: "Require foreground proof of hatchery seed, Tumbes brackish semi-intensive earthen-pond mode and actual outlet bag-net drain harvest. FAO's global technical description and Peru corroboration alone do not prove any farm's harvest configuration."
      source_ids:
        - fao-whiteleg-shrimp-2009
        - fao-peru-shrimp-2025
    - rule_id: b_route_evidence
      applies_to: "route_eligibility"
      rule: "Before treating a lot as eligible or finalizing its foreground dataset, obtain the named farm/crop and lot-linked operation log: actual wash and independent sorting event ids, start/end times, incoming/outgoing state and measured mass, paired handoff ids and responsible-operator confirmation. Show that washing precedes independent grading for this lot. FAO 2009 instead describes sorting before washing; neither cited FAO source proves the selected local order. An unknown order is incomplete eligibility, not an assumed match. A contrary order is outside this selected route and requires methodology review; never relabel an actual grading operation as incidental removal to force a match."
      source_ids:
        - fao-whiteleg-shrimp-2009
        - fao-peru-shrimp-2025
    - rule_id: b_nodes
      applies_to: "foreground"
      rule: "Separate managed production, physical harvest, whole-product washing, grading, killing/chilling, conditional packaging and delivery/receipt responsibilities. Match all physical transfers; the selected washing-before-independent-grading order applies only when evidenced under b_route_evidence, with early visual removal of incidental material owned by harvest. Another node ordering requires methodology review. No deheading, peeling, cooking or freezing is included before reference receipt."
      source_ids: []
    - rule_id: b_periods
      applies_to: "crop_and_assets"
      rule: "Include preparation/fallow, seed receipt/stocking, all growout and harvest attempts, crop failures, idle/cleaning/changeover, actual holding and delivery over declared periods. Include land occupation/history, pond/levee, pumps, aerators, nets, chill equipment, boxes and vehicles with installation, service life, maintenance, replacement and termination ownership."
      source_ids: []
    - rule_id: b_services
      applies_to: "ownership"
      rule: "For each node/period, choose full supplier service or separately owned materials/fuels/electricity/assets/direct releases for that same activity; prohibit overlap. Shared pumps, generators, chill facilities, boxes and vehicles must identify all consumers and use once-only attribution. Onsite electricity already represented by fuel/assets/releases is an internal transfer."
      source_ids: []
    - rule_id: b_fates
      applies_to: "environment"
      rule: "Classify every intended sale product, downgraded lot, returned product, mortality, escape, incidental animal, sludge, wastewater and discarded material by actual fate. Direct measured/modelled pollutant substance/basis/medium is elementary; treatment transfer is waste with treatment upstream/downstream ownership. Never turn biomass disposal into automatic elemental emissions, burden-free input or ecological credit."
      source_ids: []
    - rule_id: b_gate
      applies_to: "reference_gate"
      rule: "End at first processor physical acceptance before deheading/freezing; include all actual transport and cold-chain through that gate, regardless of producer/buyer/service-provider legal ownership; declare the model owner and supplier-service coverage to avoid duplicates. A farm dispatch invoice alone is not physical acceptance evidence. Packaging bypass transfers chilled product directly; one final accepted output only."
      source_ids: []
