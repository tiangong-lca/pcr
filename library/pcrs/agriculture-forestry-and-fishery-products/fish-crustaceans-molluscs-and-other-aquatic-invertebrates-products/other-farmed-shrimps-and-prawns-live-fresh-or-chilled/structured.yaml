    rule: "First subdivide by measured crop, operation, grade, destination and exclusive equipment/service. Assign seed/feed/pond management to its crop, washing/sorting/chilling to actually treated lots and transport to actually carried lots; identify every sale product and handoff before residual allocation."
    source_ids: []
  - rule_id: a_residual
    applies_to: "joint_shrimp_lots"
    rule: "For inseparable residual burdens of one pond crop or joint sorting event, allocate across intended shrimp sale lots by measured whole wet mass at a common pre-divergence handoff, excluding free water/ice and tare. Retain grade/state-specific masses and justify biomass production/handling causality; test realized first-sale revenue shares as sensitivity when grades differ materially in price. Do not use final accepted mass to disguise omitted other products."
    source_ids: []
  - rule_id: a_failure
    applies_to: "periods"
    rule: "Include nonproductive/failed crop and maintenance duty in the declared reporting-window pond burden pool; attribute to the same pond's intended sale output over that window using the residual rule. Disclose failure timing and reasons. If no intended sale output exists, retain an unnormalized failed-operation record and widen only an evidenced reporting window; never divide by zero or delete failed duty."
    source_ids: []
  - rule_id: a_assets
    applies_to: "shared_assets"
    rule: "For shared infrastructure enumerate pond, harvest, wash, sort, chill, pack and receipt consumers actually using each asset over its service periods. Prefer meters for energy/water; use measured pump hydraulic work or equipment-hours for residual operation, occupied pond-area-time for pond land/levees, and loaded tonne-kilometres with assigned empty/return travel for vehicle services. Allocate capital/repair using documented actual lifetime service shares, including replacement/termination; once-only ledger reconciles all shares."
    source_ids: []
  - rule_id: a_waste
    applies_to: "losses"
    rule: "Retain mortality, rejected/discarded biomass and associated treatment within the responsible crop/node burden pool; assign actual treatment once. Other intended products remain products; no automatic substitution/ecological credits. Receipt rejection/return fate keeps its original burden ownership; no default zero-burden replacement. Reprocessing or return-to-upstream loops are outside this declared route; an actual loop requires methodology review before inclusion."
    source_ids: []
