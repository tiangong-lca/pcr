    - protocol_id: cp_pond
      process_id: "pond"
      flow_role: "Pond preparation and semi-intensive growout inputs, transfers, services, residues and releases"
      record_type: "event, meter, invoice, sampling, asset and acceptance records"
      raw_fields: "hatchery batch/stage and separate purchased/dispatched, received, stocked, dead/lost counts; representative sampled received-batch mean individual mass; seed transport/provider gate and upstream loss ownership; feed formulation/lot/moisture/stock changes; fertilizer/chemical product and active/nutrient content; water source/volume/salinity; pond land area/history; stocking/growth/sampling/mortality/escape/standing biomass; sludge/effluent destination; node/crop/event/date/site and reporting-window ids; transfer/custody; each actual instance property/unit/substance/provider; direct utility/fuel and full-service coverage flags; meter/invoice/asset id, service-life/replacement/maintenance and consumer-period shares; actual pollutant/substance/basis/medium, model factor/source and uncertainty; native measured amount, attributable share and receipt denominator A"
