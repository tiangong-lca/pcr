      evidence: "Independent envelope evidence; retained raw records and uncertainty"
validation_rules:
  - rule_id: v_scope
    applies_to: "eligibility"
    rule: "Check species/synonym, actual hatchery postlarvae and semi-intensive Tumbes brackish earthen-pond/outlet bag-net route against records; another route or final state requires another methodology or explicit review."
    source_ids: []
  - rule_id: v_reference
    applies_to: "reference"
    rule: "Require one accepted_whole_shrimp final output, matching reference name and same-lot denominator A > 0 at first processor receipt; free ice/water and tare excluded, head/organs/shell included, never frozen and before deheading/freezing documented."
    source_ids: []
  - rule_id: v_transfer
    applies_to: "node_links"
    rule: "Reconcile every node transfer id, crop/event/date, state and own quantity. Require the paired cp_wash/cp_sort lot-linked records specified by b_route_evidence to verify washing-before-independent-grading; missing or unknown sequence evidence prevents eligibility completion. Check packaging activation or bypass; early incidental removal remains harvest-owned. Do not impose seed/live/chilled/final mass equality; explain losses, other grades, rejection/returns and measurement uncertainty."
    source_ids: []
  - rule_id: v_ownership
    applies_to: "completeness"
    rule: "Review all crop phases including failed/nonproductive duty, utilities/materials, land/history, assets/replacement, service coverage and direct combustion/leakage/discharge by node. Check every shared consumer, period and burden ledger for omissions/duplicates; exclude separately listed fossil CO2 from other-release instances."
    source_ids: []
  - rule_id: v_native
    applies_to: "quantity_and_identity"
    rule: "Each applicable collection obligation expands into zero, one or multiple actual native-unit instances with independent identity, verified support and quantity evidence. A missing actual substance/provider/gate/property/unit is unresolved, never a generic fixed UUID; final TIDAS exchanges require concrete verified identities."
    source_ids: []
  - rule_id: v_ranges
    applies_to: "range_evidence"
    rule: "All 0..U_row/U_instance ranges below are provisional unresolved evidence markers with independently determined upper bounds, not empirical ranges, zero defaults or hard validation limits. For multi-formulation or multi-lot rows, each actual formulation/lot independently owns its U_row upper bound, including U_formulated_feed; there is no shared cap or mixed-identity total. Replace with reviewed data; exact 1..1 applies only to same accepted-lot A/A normalization."
    source_ids:
      - same-lot-normalization
  - rule_id: v_disclosure
    applies_to: "finalization"
    rule: "Disclose performed/skipped checks, uncertainty, source age/applicability, unresolved quantities/identities, output allocation rationale/sensitivity and all qualifiers. Checker pass does not verify UUID detail or prove publication readiness; unresolved reference/support identities block final concrete datasets."
    source_ids: []
  - rule_id: validate_atomic_completion
    applies_to: "all applicable per-flow collection obligations and final exchanges"
    rule: "Final dataset completion and validation require every actual exchange to have an independent atomic card and its own quantity, property/native unit, collection or calculation evidence, range/uncertainty evidence, normalization, actual destination and verified UUID. Unknown identity, activity state, quantity, range evidence or fate blocks completion; it is never zero, a presumed bypass or permission to omit an obligation. Every important concrete flow retains its own range/uncertainty evidence collection duty; a symbolic upper bound is not an empirical range."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground aquaculture data package for the declared route and physical receipt gate"
  downstream_use: "Downstream process and lifecyclemodel projections; secondary_dataset or background_dataset only after completed actual-data, methodology and identity review"
  allowed_use: "Traceable accepted chilled whole-shrimp lots whose route, upstream coverage, quantities and attribution match this PCR."
  excluded_use: "No proxy for other species, wild/live/frozen/headless/peeled products or intensive/freshwater systems; no food safety, residue, legal compliance, carbon-neutrality or biodiversity claim."
  required_metadata: "All reference qualifiers; provider/gates; farm/pond/crop and reporting dates; complete process/transfer map; native exchanges; upstream service scope; land/asset life; allocation and quantitative evidence."
  required_quality_disclosure: "Failed crop inclusion, meter/sampling coverage, uncertain biomass/fates, missing ranges, unresolved bindings, selected/sensitive allocation, source age and performed/skipped checks."
  update_trigger: "Changed species, source or seed stage, pond/harvest mode, feed/management, land/assets, product state/gate, service ownership, source evidence, quantity evidence or allocation."
data_sources:
  - id: "fao-whiteleg-shrimp-2009"
    type: "official_guidance"
    reference: "FAO 2009. Briggs M. Penaeus vannamei. Cultured aquatic species fact sheets. https://www.fao.org/fishery/docs/CDrom/aquaculture/I1129m/file/en/en_whitelegshrimp.htm; retrieved 2026-10-12"
    used_for: "Technical context for hatchery seed, semi-intensive ponds, outlet bag-net harvest and handling/ice-water killing/insulated delivery. Handling and processing describes sorting before washing; this is not evidence for the selected washing-before-independent-grading order or a specific local farm practice, and supplies no quantity default."
