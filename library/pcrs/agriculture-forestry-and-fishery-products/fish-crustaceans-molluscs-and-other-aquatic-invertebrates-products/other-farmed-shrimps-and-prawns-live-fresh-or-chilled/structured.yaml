  calculation_rules:
    - id: normalize_lot
      applies_to: "all inventory rows"
      rule: "Divide each once-attributed actual native-unit exchange by accepted net whole-shrimp receipt mass A from cp_receipt; keep product transfers and other-sale outputs independently measured. For the final accepted lot A/A = 1 kg per 1 kg reference flow."
      inputs:
        - "native instance amount"
        - "attribution shares"
        - A
        - cp_receipt
      output: "per 1 kg reference flow"
      source_ids:
        - same-lot-normalization
    - id: seed_conversion
      applies_to: "hatchery_postlarvae"
      rule: "When a kg exchange is required, multiply actual received postlarval count by that received batch's representative measured mean individual mass in kg; retain separate purchased/dispatched, received, stocked and dead/lost counts, sample statistics and stage. Seed that dies after receipt before stocking remains an input with separately recorded fate; upstream transport losses retain declared upstream ownership. No generic seed weight, survivor-only input or seed-to-harvest mass equality is allowed."
      inputs:
        - "actual received count"
        - "measured received-batch mean individual mass"
        - cp_pond
      output: "seed mass with count and uncertainty"
      source_ids: []
    - id: release_loads
      applies_to: "all inventory rows"
      rule: "Derive each actual unmeasured release only from a stated chemical basis and measured activity with a documented applicable factor/model, or concentration and actual water volume; state background versus direct ownership. Keep each pollutant/medium separate and exclude separately listed fossil CO2 from other-release totals."
      inputs:
        - "measured activity or concentration/volume"
        - "factor provenance"
        - "node protocol"
      output: "actual substance-specific release in native unit"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all cards"
      requirement: "Require concrete actual-instance flow/property/unit compatibility and upstream gate/provider scope; unresolved cards remain review gaps, not implicit generic identities."
      evidence: "detail evidence; supplier records; unresolved register"
    - id: dq_quantity
      applies_to: "all amounts"
      requirement: "Use real records or transparent model inputs; retain measurement resolution, sampling design, wet/dry/free-water basis, node/period coverage and uncertainty. Zero requires evidenced non-activation or measured zero, not missing data."
      evidence: "calibration; raw event tables; model and reconciliation"
    - id: dq_temporal
      applies_to: "crops_and_assets"
      requirement: "Cover productive and failed crops and their shared idle/preparation duty, full relevant asset periods and termination; no unrecorded service-life or crop extrapolation."
      evidence: "crop timeline; asset and consumer ledger"
    - id: dq_source
      applies_to: "source_applicability"
      requirement: "FAO 2009 provides route examples, not current local practice shares or numeric defaults; Peru 2025 corroborates location/industry, not each harvest detail. Obtain farm records for actual configuration and current quantities."
      evidence: "source-date assessment; farm route record"
