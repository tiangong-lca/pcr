      applies_to: "pond; Inputs; Product flows"
      requirement: "Identify each actual physically or chemically specific exchange within this collection scope and add an independent inventory card; this collection scope is not a flow. Establish substance/species, state, flow type, property, native unit, quantity, evidence, normalization, destination and UUID separately for each card. Do not copy an aggregate quantity, common upper bound or UUID onto its members. Determine final direction and product/waste/elementary type from each actual source and fate; the collection scope does not assign a universal exchange type. Collection scope: Actual pond preparation, fertilization and health-management material instances. Conditional collection scope: each actual lime, fertilizer, disinfectant, probiotic or other material requires its own formulation, purpose, supplier, amount, product/active/nutrient basis and verified identity. No material or dose is prescribed. <br> - Flow property / unit: Actual instance property / native unit <br> - Amount rule: Collect each actual instance amount for this row with cp_pond, attribute once under section 7, and divide by the same accepted net receipt mass A; retain its native unit and measurement/model evidence. <br> - Value mode: Calculated value (calculated_value) <br> - Specificity: Site-specific (site_specific) <br> - Normalization basis: per 1 kg reference flow <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Calculated from collection (calculated_from_collection) <br> - Collection protocol: cp_pond <br> - Range: Provisional unresolved evidence marker; independent upper bound required; no empirical range, default or hard limit <br> - Range role: Uncertainty range (uncertainty_range) <br> - Lower: 0 <br> - Upper: U_instance <br> - Unit: native unit <br> - Basis: per 1 kg reference flow; each actual instance has an independent U_instance, never mixed-unit totals <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Reasoned estimate (reasoned_estimate)"
      evidence: "Node collection protocol, original records and individual identity, quantity, range and destination evidence"
