  classification_refs: "CPC 3.0 04232; narrower relation"
  covered_products: "Aquaculture-origin food flatfish, whole unheaded ungutted, delivered live, fresh or chilled at first producer handover"
  excluded_products: "Wild fish; ornamental/nonfood seed or feed fish; eggs/gametes as final product; headed/gutted fish, fillets/meat, roe/liver, frozen or further processed products"
  representative_product: "An identified farmed whole-food-flatfish cohort; actual species is mandatory, turbot is only a qualitative example"
  production_route: "Owned hatchery/larval settlement and nursery OR documented purchased stage, then bottom-dwelling growout, independent harvest and actual live_gate OR whole_chill state. Biological parent hatchery/nursery/growout; water technology deltas attach to those parents."
  market_state: "Exactly one actual state per delivered lot: live OR whole fresh/chilled. Species, site salinity and water topology are declared; no all-flatfish marine restriction."
functional_unit:
  what: "Actual qualifying whole farmed food flatfish at first producer handover"
  how_much: "1 kg net wet fish biomass excluding water, ice, oxygen, packages and nonqualifying rejects"
  how_well: "Actual species, whole unheaded ungutted form, aquaculture provenance and food suitability; exactly one evidenced live or fresh/chilled state"
  how_long_or_cycle: "Record actual broodstock cycles, hatch/larval/settlement/nursery/growout periods, harvest, holding and dispatch dates; include carryover biomass, asset service periods, replacement and terminal events"
  reference_flow_link: "flatfish_gate_release"
system_boundary:
  rules:
    - rule_id: boundary_scope
      applies_to: "all processes"
      rule: "Include actual owned pre-gate phases and upstream purchased inputs, harvest and selected handling; stop at first producer handover. Exclude post-gate transport, culture, retail, cooking and consumption."
      source_ids:
        - flatfish-foreground-method
    - rule_id: boundary_parent
      applies_to: "hatchery; nursery; growout"
      rule: "Attach owned-vs-purchased biological alternatives to their managed-production parent. Actual stage purchase replaces only omitted owned phases; no duplicate nodes or zero-burden seed."
      source_ids:
        - flatfish-foreground-method
    - rule_id: boundary_biological_delta
      applies_to: "hatchery; nursery; growout"
      rule: "For each actual phase declare one owned or purchased-stage option; different phases may coexist, but the same phase/cohort cannot include both supplier production and owned duplicate production. The delta changes upstream dataset coverage versus owned feed/water/energy/health and emission inventories, phase count/mass and survival calculations, and reproduction/metamorphosis evidence. Select actual natural/induced/artificial reproduction only for an owned reproductive phase and evidence the corresponding handling/material inventory."
      source_ids:
        - flatfish-foreground-method
    - rule_id: boundary_water
      applies_to: "all water-using processes"
      rule: "Resolve actual flow-through, cage or RAS topology per unit-period; retain source-stage treatment/backwash/disinfection and energy links. Environmental abstraction, supplied water, internal circulation and final discharge are distinct."
      source_ids:
        - flatfish-foreground-method
    - rule_id: boundary_state
      applies_to: "growout; harvest; live_gate; whole_chill"
      rule: "Activate whole_chill only from actual fresh/chilled dispatch records; inactive requires evidenced live delivery. Preserve state and suitability by event: live fish enter the selected route; naturally dead fish enter whole_chill only with independent evidence that they still qualify as fresh food, otherwise mortality waste; unknown suitability never qualifies as product. The same fish cannot be both product and mortality waste. whole_chill owns actual bounded pre-killing holding and its resources/losses for the fresh/chilled route, with live_gate inactive. Exactly one final output per lot; internal transfers retain measured quantities, not fixed 1 kg."
      source_ids:
        - flatfish-foreground-method
    - rule_id: boundary_shared
      applies_to: "all processes"
      rule: "Meter or allocate shared pumps, oxygenation, heating/cooling, biofilters, discharge treatment, broodstock and tanks/cages across every actual consumer, cohort and period once; retain service-life, replacement, termination and residual capacity records."
      source_ids:
        - flatfish-foreground-method
    - rule_id: boundary_fate
      applies_to: "all processes"
      rule: "Record mortalities, rejects, escapes, spent feed/cultures, wastewater/sludge, combustion and refrigerant/substance releases at source stages. Link internal treatment transfers to final fate once; no unobserved absence becomes zero."
      source_ids:
        - flatfish-foreground-method
boundary_abstraction:
  declared_starting_condition: "Actual owned broodstock/egg/larval phase, or documented purchased eggs, larvae or juveniles; continue remaining owned production at the actual stage and retain upstream burdens"
  starting_condition_role: "Physical foreground starting stage plus explicit upstream dataset interface"
  product_classification_scope: "Aquaculture-origin whole food flatfish subset of CPC 3.0 04232; origin, form, use and gate are independently evidenced"
  recursive_input_rule: "Record purchased same-category fish as actual stage-qualified input with upstream dataset boundary; stop recursive authoring at documented supplier gate, never erase upstream production or count it twice"
  upstream_dataset_requirement: "Require actual stage/species/origin, supplier gate, geography/time, feed/water/energy coverage, survival/loss and attribution compatibility; missing burdens are explicit data gaps"
  disclosure: "Declare owned and purchased phases, all selected water routes, resource/treatment ownership, actual final state, first handover, temporal carryover and excluded post-gate operations"
