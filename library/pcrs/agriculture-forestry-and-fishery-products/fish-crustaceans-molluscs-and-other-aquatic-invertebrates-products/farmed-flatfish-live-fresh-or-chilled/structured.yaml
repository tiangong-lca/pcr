validation_rules:
  - rule_id: validate_scope
    applies_to: "reference lot"
    rule: "Verify actual species with independent taxon evidence, aquaculture origin, human-food use, whole unheaded ungutted form and first producer gate. Neither a CPC label nor turbot example proves these facts."
    source_ids:
      - flatfish-foreground-method
  - rule_id: validate_branch
    applies_to: "live_gate_final; whole_chill_final; flatfish_gate_release"
    rule: "Verify exactly one evidenced live or fresh/chilled preparation branch supplies the final gate; independently measured branch transfer and acceptance losses reconcile to the sole 1 kg final reference output. Never fix a branch transfer to 1 kg or combine states. Unknown state or food suitability fails completeness."
    source_ids:
      - flatfish-foreground-method
  - rule_id: validate_phases
    applies_to: "hatchery; livefood; nursery; growout"
    rule: "Owned larval records must evidence first feeding, metamorphosis, settlement and feed transition; purchased stage must identify upstream coverage. Check phase-specific feed wet/dry basis, count/representative weight, bottom-contact area/occupancy and survival without universal stocking/FCR/temperature values."
    source_ids:
      - flatfish-foreground-method
  - rule_id: validate_topology
    applies_to: "water; energy; treatment"
    rule: "Require actual unit-period water diagram, sources and meters; RAS requires actual circulation, filtration/biofilter, solids/backwash and treatment evidence. Confirm abstraction/supply/recirculation distinction, current energy provider and treatment ownership."
    source_ids:
      - flatfish-foreground-method
  - rule_id: validate_closure
    applies_to: "all processes"
    rule: "Reconcile phase counts/wet biomass, transfers, growth, mortality, escapes, rejects and final handoff with uncertainty. Check growout_fish → harvest_ready_fish → harvest_collected_fish → selected state intake by event: fresh whole fish require independent suitability evidence and only whole_chill; live_gate receives live fish only; product and mortality waste are exclusive. whole_chill alone owns fresh/chilled-lot pre-killing holding resources/losses, including actual maintenance feed and escape fates. Link all actual stage resources, cleaning/health events, direct releases and waste transfers to unique source unit/cohort/period and final fate; check feed nutrient/material and treatment balances with substance, concentration, background, flow, duration and lab QA."
    source_ids:
      - flatfish-foreground-method
  - rule_id: validate_detection
    applies_to: "direct release and concentration records"
    rule: "Retain raw results, detection/quantification limits, sampling background and analytical uncertainty. Non-detect is not an automatic zero: disclose a justified bounded estimate or gap. A negative inlet-adjusted concentration/load triggers sampling/background review; preserve raw data, do not clip to zero or claim environmental removal without independently supported physical uptake and boundary evidence."
    source_ids:
      - flatfish-foreground-method
  - rule_id: validate_outfall_basis
    applies_to: "direct waterborne-substance inventory and diagnostic balances"
    rule: "Check outfall_load and quality_outfall_basis: the inventory has one supported E_s on the declared site-attributable basis; G_s remains a separate diagnostic and B_pass_s represents only evidenced incoming background actually reaching the same receiver. Check independent stream flows, substance/element conversion, interval/residence alignment, stocks and all treatment/removal destinations. Missing applicable background/fate evidence blocks the affected exchange; no arbitrary gross/net choice, unsupported full-inlet subtraction, recirculation subtraction, duplicate estimate, clipping or unsupported negative credit is permitted."
    source_ids:
      - flatfish-foreground-method
  - rule_id: validate_attribution
    applies_to: "common resources; periods; products"
    rule: "Check complete output and consumer lists, phase/run/period boundaries, carryover and replacement/terminal events, drivers and denominator totals, shared invoices/meters and no duplicate internal flows or upstream burdens."
    source_ids:
      - flatfish-foreground-method
  - rule_id: validate_ranges
    applies_to: "all cards"
    rule: "Use foreground measurements first. All provisional reasoned_estimate ranges are replaceable QA screens, not design/operation limits or substitute values; review outliers and expand with evidence, never clip. Zero requires documented non-use, not missing records."
    source_ids:
      - flatfish-foreground-method
  - rule_id: validate_identity
    applies_to: "all exchanges"
    rule: "Resolve each actual concrete product/waste/elementary exchange and compatible property/unit before final TIDAS use. Conditional collection obligations in Section 8 require actual distinct substances/materials and destinations. Fixed identity evidence does not prove quantity, emission factor or publication readiness."
    source_ids:
      - flatfish-foreground-method
  - rule_id: validate_inventory_completion
    applies_to: "all concrete exchanges and section 8 completion obligations"
    rule: "Verify each applicable dq_complete obligation has separately measured and identity-verified exchange cards. Check each quantity, native unit, range evidence, normalization, receiving medium, destination and non-duplication. Any unfulfilled actual child exchange, quantity, identity or destination makes the final dataset incomplete and fails validation; unknown cannot be zero. Static PCR checking does not replace this evidence."
    source_ids: []
  - rule_id: validate_final_gate
    applies_to: "declared_gate_release"
    rule: "Exactly one evidenced actual-state branch feeds the final gate; reference definition, actual fish state and release record agree. Use final accepted net mass at this gate as the sole denominator throughout; reconcile receipt, acceptance rejects, losses and output without fixing internal transfers to 1 kg. Own operating resources once at the actual responsible node. Unknown state, denominator or fate makes the dataset incomplete and fails validation."
    source_ids:
      - flatfish-foreground-method
published_dataset_profile:
  dataset_role: "Foreground data package; completed secondary_dataset or background_dataset with disclosed coverage"
  downstream_use: "Source-grounded process and lifecyclemodel projections using resolved concrete exchange identities"
  allowed_use: "Same declared species/stage, origin, whole state, water topology, geography/time and first farmgate or justified adaptation with sensitivity"
  excluded_use: "Universal flatfish recipe; automatic live/chilled equivalence; frozen/gutted/fillet guidance; final TIDAS exchange with unresolved identity; unqualified whole-sector mean"
  required_metadata: "PCR version; species/origin/purpose; declared phases, units/cohorts and period; whole form/state; gate; output mass/count; water and feed route; area occupancy; upstream coverage; allocations; source references"
  required_quality_disclosure: "Measurement/sampling quality, loss closure, treatment/emission method and substance basis, unresolved identities/activities, provisional QA ranges and uncertainty"
  update_trigger: "Change in species, source stage, feed, water topology, site/energy provider, health regime, delivered state, losses, allocation or new reviewed evidence"
