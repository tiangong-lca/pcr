allocation_rules:
  - rule_id: allocation_precedence
    applies_to: "common burdens"
    rule: "Subdivide independently measured stages first. For remaining shared burdens use evidenced causal activity: pump/thermal/oxygen demand, measured treatment load, or bottom-area-time where it represents actual occupation. Document driver and denominator; wet fish mass alone is not assumed causal."
    source_ids:
      - ghg-product-allocation-2011
      - flatfish-foreground-method
  - rule_id: allocation_outputs
    applies_to: "intended products"
    rule: "Enumerate all intended sale outputs at their actual handoffs, including food-size grades, independently sold seed/eggs or qualifying retired broodstock if present. Internal transfers are not extra products. Retain mortality/waste burdens with production; no automatic avoided-burden credits."
    source_ids:
      - ghg-product-allocation-2011
      - flatfish-foreground-method
  - rule_id: allocation_fallback
    applies_to: "remaining common burdens"
    rule: "If a causal physical relationship cannot be established, justify common-gate economic shares using actual matched-period prices and quantities; disclose sensitivity to plausible alternatives. Use the same method for comparable outputs and no unexplained mixing."
    source_ids:
      - ghg-product-allocation-2011
      - flatfish-foreground-method
  - rule_id: allocation_period
    applies_to: "cohorts; assets; broodstock"
    rule: "Index actual batch/continuous unit-periods, cleaning/changeover, opening/closing live stocks and transfer burdens. Carry unfinished-cohort burdens forward once; share broodstock maintenance over evidenced spawning outputs/cycles, not an invented lifetime. Record replacement, retirement and terminal fates."
    source_ids:
      - ghg-product-allocation-2011
      - flatfish-foreground-method
  - rule_id: allocation_assets
    applies_to: "shared assets and contracted services"
    rule: "Enumerate all consuming nodes and periods for pumps, tanks, cages, cold rooms, transport/loading or contracted services. Deduplicate common meter/invoice/event ids. Unknown service identities remain in an auxiliary provider activity ledger with actual provider units; never create a generic kg service."
    source_ids:
      - ghg-product-allocation-2011
      - flatfish-foreground-method
  - rule_id: allocation_internal_extension
    applies_to: "all exchanges"
    rule: "The flatfish foreground method applies this allocation precedence to resource and non-GHG exchanges as well as emissions. This is an explicit internal extension, not a claim of full Product Standard compliance."
    source_ids:
      - ghg-product-allocation-2011
      - flatfish-foreground-method
