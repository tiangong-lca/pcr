  calculation_rules:
    - id: normalize_lot
      applies_to: "all inventory rows"
      rule: "Sum actual attributable stage quantities over matched cohort/period; divide each by delivered qualifying net wet fish mass in kg to report per 1 kg reference flow. Count only the actually selected final state; retain actual internal transfer yields."
      inputs:
        - "primary quantity"
        - "allocation share"
        - "actual net delivered fish mass"
        - cp_harvest
        - cp_live_gate
        - cp_whole_chill
        - cp_gate_release
      output: "normalized exchange in original compatible property/unit"
      source_ids:
        - flatfish-foreground-method
    - id: count_mass
      applies_to: "fish and live-food transfers"
      rule: "Use actual cohort count times representative measured individual wet biomass only when sampling is defensible; retain water/tare exclusion, stratification and uncertainty. Egg/cell counts have no universal fish-mass equivalence."
      inputs:
        - "actual count"
        - "measured sample weight"
        - "sample count"
        - tare
        - stage
      output: "actual stage-qualified wet biomass"
      source_ids:
        - flatfish-foreground-method
    - id: outfall_load
      applies_to: "direct substance release"
      rule: "Calculate gross outlet load G_s by integrating actual outlet flow times duration times concentration for each identified substance s, with explicit elemental/species and unit conversions. The final direct-release inventory uses site-attributable load E_s = G_s minus B_pass_s, where B_pass_s is the independently evidenced incoming background amount of that same substance that actually passes through to that same receiving medium in the matched accounting interval. Establish B_pass_s from paired inlet/outlet records and an explicit source/fate balance including opening/closing water and substance stocks, residence-time lags, internal transfers, treatment, retained growth, removed solids and other actual destinations. Use each stream's own measured flow; do not assume equal inlet/outlet volume, subtract the whole inlet load by default, or deduct recirculation again. Gross G_s is retained as a diagnostic, not added again as a second inventory emission. If B_pass_s or its exclusion as inapplicable cannot be evidenced, retain the gross observation and the unresolved attribution gap; do not silently choose gross/net or finalize the affected E_s. Negative or uncertain differences require review, not clipping or removal credit. Apply normalize_lot to the supported original E_s once. Feed-input balance estimates are an alternative evidence route only with composition, retained growth and all removal fates reconciled to this same site-attributable boundary; never equate feed nutrient input to direct emission or add both estimates."
      inputs:
        - "actual stream-specific flow"
        - duration
        - "matched inlet/outlet substance concentrations and units"
        - "source/fate and opening/closing stock records"
        - "lab QA"
        - "background pass-through evidence"
      output: "kg site-attributable substance to identified medium before normalize_lot"
      source_ids:
        - flatfish-foreground-method
    - id: combustion_leak
      applies_to: "fuel emissions and fugitive releases"
      rule: "Use actual fuel quantity with independently supported fuel composition/emission factor, or direct measurement; distinguish fossil/biogenic carbon. For refrigerants reconcile opening charge, refill, recovered and closing charge by actual substance and event; no default factor is prescribed."
      inputs:
        - "actual fuel/charge"
        - "verified factor or monitoring"
        - "event and equipment records"
      output: "kg actual substance by source stage and receiving air"
      source_ids:
        - flatfish-foreground-method
  data_quality_requirements:
    - id: quality_identity
      applies_to: "reference and routes"
      requirement: "Independently identify actual species, aquaculture/food purpose, whole state, gate and each owned/purchased phase; evidence current topology without importing a turbot recipe."
      evidence: "taxon record; supplier/site/dispatch evidence"
    - id: quality_closure
      applies_to: "cohort and environment"
      requirement: "Reconcile all stock phases and transfer ids, growth, feed moisture, mortality/escape/rejects; preserve all stage fates and outfall lab QA; disclose residual balances and detection limits."
      evidence: "primary ledger, calibration and lab QA"
    - id: quality_outfall_basis
      applies_to: "direct substance release at every actual stage/outfall under its own collection protocol"
      requirement: "Retain gross outlet G_s, evidenced incoming background B_pass_s and resulting site-attributable E_s separately in kg of each actual substance before final reference normalization. Link sample, stream, node, receiver, event/interval and residence-time alignment; document each flow/duration/concentration conversion, background source and its actual pass-through versus treatment/retention/other fate, opening/closing stocks, uncertainty and any unresolved evidence. Recirculation and internal wastewater transfers are not new environmental inputs or final discharges. Do not net different substances, media or unmatched periods, assume the entire inlet load passes through without source/fate evidence, or count provider treatment/direct releases twice. A supported zero background contribution requires evidence, not absent inlet records."
      evidence: "Paired stream measurements and laboratory reports; source/fate and stock balance; background-attribution calculation and uncertainty"
    - id: quality_coverage
      applies_to: "all quantities"
      requirement: "No omitted owned phase, resource, emission or supplier burden may be replaced by silent zero. State measured, calculated or estimated coverage and uncertainty; provisional QA ranges never supply missing observations."
      evidence: "coverage and uncertainty register; flatfish-foreground-method"
    - id: quality_attribution
      applies_to: "shared periods/products/assets"
      requirement: "One driver/period ledger must enumerate all consumers and outputs and reconcile meter/invoice totals once, including broodstock, unfinished cohort, replacements and service activity."
      evidence: "allocation ledger and sensitivity; ghg-product-allocation-2011"
    - id: dq_inventory_completion
      applies_to: "all inventory-completion requirements"
      requirement: "Create a separate card for every actual physical or chemical exchange, with process, direction, flow type, its own measured quantity, native unit, final-reference normalization, applicability, destination, UUID and independent range evidence. Never copy a family total, a grouped screening range or one UUID onto every child. Use not_applicable only for evidenced absence; unknown is not zero. Any unfulfilled applicable obligation makes the final dataset incomplete and fails validation."
      evidence: "per-flow coverage ledger, raw measurements, identity, fate and range evidence"
    - id: dq_complete_hatchery_other_water
      applies_to: "hatchery; inputs; product"
      requirement: "Identify and separately collect every actual exchange covered by “Other actual externally supplied water”; retain all following collection, quantity and normalization obligations: Use the actual material, supply or receiving-medium evidence for this stage; instantiate separate concrete exchanges when several materials or substances occur. Flow property / unit: Mass 93a60a56-a3c8-11da-a746-0800200b9a66; Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66 / kg Amount rule: Specify potable, freshwater or supplied seawater identity, supplier and treatment; keep distinct from industrial process water; record actual source-stage, unit, cohort, event and period, including cleaning/start-up where used. Normalize attributable total to actual delivered reference biomass; zero only for evidenced non-use. Value mode: calculated_value Specificity: site_specific Normalization basis: per 1 kg reference flow Basis kind: reference_flow Evidence kind: calculated_from_collection Collection protocol: cp_hatchery Sources: flatfish-foreground-method Establish native units, measured quantities, destinations and independent range evidence for each concrete exchange. This completion requirement supplies no child quantity, default or allowed range; establish each child range independently. No actual exchange may be omitted."
      evidence: "per-flow original records under the linked protocol, identity and destination evidence"
    - id: dq_complete_hatchery_fuel
      applies_to: "hatchery; inputs; product"
      requirement: "Identify and separately collect every actual exchange covered by “Actual equipment or backup-generator fuel”; retain all following collection, quantity and normalization obligations: Use the actual material, supply or receiving-medium evidence for this stage; instantiate separate concrete exchanges when several materials or substances occur. Flow property / unit: Mass 93a60a56-a3c8-11da-a746-0800200b9a66; Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66 / kg Amount rule: Identify each actual fuel and net mass, density if measured by volume, equipment and combustion fate; no fishing-vessel fuel substitution; record actual source-stage, unit, cohort, event and period, including cleaning/start-up where used. Normalize attributable total to actual delivered reference biomass; zero only for evidenced non-use. Value mode: calculated_value Specificity: site_specific Normalization basis: per 1 kg reference flow Basis kind: reference_flow Evidence kind: calculated_from_collection Collection protocol: cp_hatchery Sources: flatfish-foreground-method Establish native units, measured quantities, destinations and independent range evidence for each concrete exchange. This completion requirement supplies no child quantity, default or allowed range; establish each child range independently. No actual exchange may be omitted."
      evidence: "per-flow original records under the linked protocol, identity and destination evidence"
    - id: dq_complete_hatchery_heat
      applies_to: "hatchery; inputs; product"
      requirement: "Identify and separately collect every actual exchange covered by “Externally supplied heating or cooling energy”; retain all following collection, quantity and normalization obligations: Use the actual material, supply or receiving-medium evidence for this stage; instantiate separate concrete exchanges when several materials or substances occur. Flow property / unit: Net calorific value 93a60a56-a3c8-11da-a746-0800200c9a66; Units of energy 93a60a57-a3c8-11da-a746-0800200c9a66 / MJ Amount rule: Meter actual purchased thermal energy and provider; avoid double counting own fuel or electricity used to produce the same heat/cooling; record actual source-stage, unit, cohort, event and period, including cleaning/start-up where used. Normalize attributable total to actual delivered reference biomass; zero only for evidenced non-use. Value mode: calculated_value Specificity: site_specific Normalization basis: per 1 kg reference flow Basis kind: reference_flow Evidence kind: calculated_from_collection Collection protocol: cp_hatchery Sources: flatfish-foreground-method Establish native units, measured quantities, destinations and independent range evidence for each concrete exchange. This completion requirement supplies no child quantity, default or allowed range; establish each child range independently. No actual exchange may be omitted."
      evidence: "per-flow original records under the linked protocol, identity and destination evidence"
    - id: dq_complete_hatchery_chemicals
      applies_to: "hatchery; inputs; product"
      requirement: "Identify and separately collect every actual exchange covered by “Actual health, cleaning or water-treatment materials”; retain all following collection, quantity and normalization obligations: Use the actual material, supply or receiving-medium evidence for this stage; instantiate separate concrete exchanges when several materials or substances occur. Flow property / unit: Mass 93a60a56-a3c8-11da-a746-0800200b9a66; Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66 / kg Amount rule: List each actual material, formulation/active ingredient, dose/event, authority/site records and fate; no mandatory medication recipe; include buffers, salts or treatment media only if used; record actual source-stage, unit, cohort, event and period, including cleaning/start-up where used. Normalize attributable total to actual delivered reference biomass; zero only for evidenced non-use. Value mode: calculated_value Specificity: site_specific Normalization basis: per 1 kg reference flow Basis kind: reference_flow Evidence kind: calculated_from_collection Collection protocol: cp_hatchery Sources: flatfish-foreground-method Establish native units, measured quantities, destinations and independent range evidence for each concrete exchange. This completion requirement supplies no child quantity, default or allowed range; establish each child range independently. No actual exchange may be omitted."
      evidence: "per-flow original records under the linked protocol, identity and destination evidence"
