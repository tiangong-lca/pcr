    used_for: "Qualitative hatchery/weaning/growout, harvest and whole presentation examples only; retrieved 2026-10-09"
  - id: "fao-flounder-culture"
    type: "official_guidance"
    reference: "FAO, Biology and culture of selected species, section 2.5. https://www.fao.org/4/Y2257E/y2257e05.htm"
    used_for: "Qualitative metamorphosis/settlement, feed transition and bottom occupancy questions only; no historical taxonomy/numerical prescription; retrieved 2026-10-09"
  - id: "uf-ifas-ras-fa099"
    type: "extension_guidance"
    reference: "UF/IFAS, Fish Health Management Considerations in Recirculating Aquaculture Systems—Part 1, FA099. https://ask.ifas.ufl.edu/publication/FA099"
    used_for: "Generic actual RAS water-quality, filtration and biosecurity categories only; retrieved 2026-10-09"
  - id: "ghg-product-allocation-2011"
    type: "standard"
    reference: "WRI/WBCSD (2011), Product Life Cycle Accounting and Reporting Standard, chapter 9. https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Allocation precedence and sensitivity; no full-compliance claim; retrieved 2026-10-09"
  - id: "flatfish-foreground-method"
    type: "method_factor"
    reference: "Self-defined internal methodology in this PCR, sections 3–9; no external observational dataset."
    used_for: "Gate/form boundary, measurement and collection/calculation rules, stage/fate ledgers, cross-period attribution, unit conversions and 1–1 kg internal reference identity. Broad non-reference screening ranges are separately labelled reasoned_estimate and are not empirical factors."
