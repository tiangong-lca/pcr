    - id: quality_identity
      applies_to: "all roles"
      requirement: "Verify exact identity by actual substance, flow type/direction, state, use, geography and receiving compartment. Unverified identities or support units remain gaps; a conceptual card cannot replace a concrete final TIDAS exchange."
      evidence: "Concrete identity and support-data evidence"
    - id: quality_events
      applies_to: "fish and organ chain"
      requirement: "Reconcile capture, gutting, grading, cold and handover states per event; every organ/blood fate and live return/dead discard needs evidence. Unknown cannot pass."
      evidence: "Event graph, measurements, acceptance and time-temperature records"
    - id: quality_complete
      applies_to: "period and resource ownership"
      requirement: "Cover complete voyages, failed/no-output periods, shared assets and service inclusion matrix; disclose non-mass ecological interactions instead of claiming no impact. Unresolved quantities, ranges, services and output sets block a complete package."
