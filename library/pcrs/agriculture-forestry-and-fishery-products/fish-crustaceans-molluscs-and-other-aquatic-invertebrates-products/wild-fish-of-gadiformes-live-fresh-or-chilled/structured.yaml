        - cp_condition
        - cp_grade
        - cp_preserve
        - cp_present
        - cp_handover
      output: "Unallocated physical per-reference view and separate LCA attribution view"
      source_ids: []
    - id: gutting_balance
      applies_to: "condition"
      rule: "Actual fish and water/ice/other receipts plus opening stock equal mutually exclusive actual partial-condition fish transfers, completed gutted carcass transfers, sold organs, organs/rejects to management, direct releases, each water fate and closing stock at that pass; close blood and water loads using a nonduplicate convention. Do not assume prepared net carcass equals received whole fish."
      inputs:
        - cp_condition
      output: "Independently evidenced mass closure and discrepancy investigation"
      source_ids: []
    - id: unit_conversion
      applies_to: "all inventory rows"
      rule: "Original kWh multiplied by 3.6 gives MJ; original t multiplied by 1000 gives kg, g multiplied by 0.001 gives kg. Retain raw units, conversions and property evidence; do not mass-convert real service functional units."
      inputs:
        - "raw units"
        - "verified support groups"
      output: "Consistent units with original quantities"
      source_ids: []
    - id: service_range
      applies_to: "external service cards"
      rule: "Expand services by provider, scope and actual native functional unit; provider_service_unit is not a controlled unit. Each U_<node>_external_service is a nonnegative finite upper bound supported by matching independent comparable service-period data or matching supplier evidence, normalized to positive accepted final net fish kg. Retain raw quantities, functional unit, denominator, scope, coverage period and independent applicability rationale; never self-validate from the same batch maximum. Without evidence retain the symbol and property/unit-group gaps, without claiming quantitative Range QA or final exchange completion."
      inputs:
        - "actual provider units"
        - "independent service evidence"
        - "node protocol"
      output: "Evidenced service bounds or retained gaps"
      source_ids: []
    - id: range_review
      applies_to: "non-reference ranges"
      rule: "Role-specific upper screens are provisional broad estimates per 1 kg reference flow: fish/organs 100 kg, bait/consumables/gear 20 kg, packages 10 kg, water 10000 kg, gate carrier water/ice 1000 kg, purchased ice 20 kg, direct fuel 100 kg, fossil CO2 400 kg, other air substances 20 kg, refrigerants 5 kg and energy 1000 MJ; none is an empirical QA threshold. Near-zero output can exceed them: never clip actual values. Independently comparable data or matching supplier evidence must establish applicability before final inventory QA."
      inputs:
        - role
        - "independent observations"
        - "supplier scope"
      output: "Evidenced range or quantitative evidence gap"
      source_ids: []
    - id: conditional_interface_envelopes
      applies_to: "condition_actual_live_fish_return; condition_actual_dead_fish_release; grade_actual_live_fish_return; grade_actual_dead_fish_release; preserve_actual_live_fish_return; preserve_actual_dead_fish_release; present_actual_dead_fish_release; handover_actual_dead_fish_release; condition_partially_prepared_fish; dq_complete_handover_direct_fuel; handover_electricity; dq_complete_handover_operating_materials; dq_complete_handover_external_service; dq_complete_handover_operating_waste; handover_fossil_co2; dq_complete_handover_other_direct_release; dq_complete_present_actual_alternative_fish_product; dq_complete_handover_actual_alternative_fish_product"
      rule: "For each listed conditional role, instantiate actual identity/state/node/pass/numerator unit and matching positive final kg before quantitative QA. U_<row_id> is a finite nonnegative same-unit upper on the explicitly labelled physical or LCA view, established from a separate representative campaign maximum times a predeclared margin >=1, or a matching independent supplier/design envelope. Retain independent source/raw samples, scope, conversion, denominator, view and uncertainty; never use the target batch maximum to validate itself. A symbol, provisional old screen or checker pass supplies no numeric evidence. Service unit/property/unitgroup gaps remain blockers; actual kg-handled is allowed only for a verified native provider reference. No clipping or invented zero."
      inputs:
        - "independent campaign/supplier evidence"
        - "actual role and unit"
        - "final kg"
        - "declared view"
      output: "independently evidenced U bounds or explicit unresolved gaps"
      source_ids: []
