allocation_rules:
  - rule_id: allocation_views
    applies_to: "physical ledger and single-output LCA"
    rule: "Always retain two views: an unallocated physical ledger closes captured biomass, organs, carcasses, water/ice, products and wastes; LCA attribution allocates burdens without changing physical partitions. Own shared resources at one node/period first, then attribute once at each actual relevant output boundary, never applying final output shares again."
    source_ids: []
  - rule_id: allocation_outputs
    applies_to: "intended outputs and residues"
    rule: "Enumerate actual sold reference fish, other species/grades, accepted liver/roe/other organs or offal and usable bait, with each actual handover/use. Internal transfers, packages, water/ice and stocks are not automatically economic co-products; waste does not become product through hypothetical value."
    source_ids: []
  - rule_id: allocation_precedence
    applies_to: "joint capture and preparation burdens"
    rule: "First subdivide truly independently measured activities. Allocate residual joint burdens by demonstrable physical relationship only with product-specific causal evidence; otherwise use contemporaneous actual net-revenue shares at the relevant boundary, retaining mass, price, revenue, currency, period and sensitivity. Zero/missing prices, no positive total revenue or unresolved output sets block economic allocation, without default mass allocation or system expansion; no automatic avoided-burden credit."
    source_ids: []
  - rule_id: allocation_periods
    applies_to: "trip runs assets and shared infrastructure"
    rule: "Index trips, capture events, handling runs and reporting periods; link actual cleaning/changeovers to served runs. Allocate vessels, generators, cold systems, tools and reusable boxes by actual service life, replacement/termination and use hours or measured causal driver to consumers and periods, retaining totals and weights summing to 1. Retain no-output, failed, return and idle burdens through the same actual service-period ledger, never deleting them or annualizing twice."
    source_ids: []
