validation_rules:
  - rule_id: validate_reference
    applies_to: "final output"
    rule: "Only food_handover is final reference. Check marine wild species, head retained/viscera removed, actual gills, food acceptance, nonfrozen history and net mass; unknown cannot enter denominator. One first gate per lot, without duplicating internal transfers."
    source_ids:
      - un-cpc-3-2025
  - rule_id: validate_balance
    applies_to: "actual physical records"
    rule: "Reconcile gutting mass partitions, water/ice fates, other species, stocks, wastes and sea returns in the unallocated ledger; pair receipts/outputs by same transfer id. Never close economically allocated amounts against unallocated whole fish or fill unexplained differences with evaporation."
    source_ids: []
  - rule_id: validate_technology
    applies_to: "capture and handling events"
    rule: "Check actual parent, technology deltas, event coexistence/exclusion, cleaning/changeovers and repeated-pass ids. Actual trawl/net/hook inputs, bycatch, losses and habitat evidence require real coverage, not completion asserted from candidate routes."
    source_ids:
      - noaa-atlantic-cod
  - rule_id: validate_attribution
    applies_to: "LCA resources and periods"
    rule: "Independently check allocation matrix and unallocated physical view: own each resource once, shares at each boundary sum to 1, no second final share; missing revenue and no output do not erase burdens. Reconcile complete return, asset service, replacement and inclusive-service scope to avoid duplicates."
    source_ids: []
  - rule_id: validate_ranges
    applies_to: "all cards and final package"
    rule: "Check supplied Ranges on the same actual numerator unit, final-reference basis and physical or LCA view. Provisional estimates do not prove plausibility or supply missing amounts. Cards without numerical Ranges retain an independent range/uncertainty evidence need, not a fabricated bound. Before actual exchange completion obtain each instance’s own representative evidence, quantity, identity and real service unit; before numerical QA establish the applicable independent envelope without using the tested batch to validate itself. Preserve and investigate genuine outliers without clipping."
    source_ids: []
  - rule_id: validate_inventory_completion
    applies_to: "all concrete exchanges and section 8 completion obligations"
    rule: "Verify each applicable dq_complete obligation has separately measured and identity-verified exchange cards. Check each quantity, native unit, range evidence, normalization, receiving medium, destination and non-duplication. Any unfulfilled actual child exchange, quantity, identity or destination makes the final dataset incomplete and fails validation; unknown cannot be zero. Static PCR checking does not replace this evidence."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground data package for wild marine head-on gutted Gadiformes food at first producer handover."
  downstream_use: "secondary_dataset; background_dataset; process and lifecyclemodel projections only after actual exchange and quality completion."
  allowed_use: "Matching actual species/form/origin/gate/context with explicit quantitative and identity evidence."
  excluded_use: "Whole-leaf universal average; live/ungutted/headed/filleted/frozen/farmed/inland/processed fish; later trader gate; unsupported service or identity substitutions."
  required_metadata: "Actual species, waterbody, gear, producer/gate, event graph, gill/viscera state, food acceptance, cold history, period, unit/net drainage, output set, upstream scope and resource ownership."
  required_quality_disclosure: "Identity/quantity/range/service gaps, source age and representativeness, mass closure, unallocated and LCA views, allocation method/sensitivity, no-output treatment and non-mass ecological evidence."
  update_trigger: "Changed origin/form/gate/gear, gutting or cold practice, output prices/fates, suppliers, service scope, asset periods, accepted food requirements or independent quantitative evidence."
data_sources:
  - id: "un-cpc-3-2025"
    type: "official_guidance"
    reference: "UN Statistics Division, CPC 3.0 explanatory notes, 30 June 2025, subclass 04241. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification origin/taxonomic/state scope only; our marine head-on gutted subset is narrower."
  - id: "noaa-atlantic-cod"
    type: "official_guidance"
    reference: "NOAA Fisheries, Atlantic Cod. https://www.fisheries.noaa.gov/species/atlantic-cod"
    used_for: "Atlantic cod gear examples only; no universal gear, performance, stock status or legal rule."
  - id: "fao-wet-fish-handling"
    type: "official_guidance"
    reference: "FAO, Some Notes on Fish Handling and Processing. https://www.fao.org/4/x5927e/x5927e01.htm"
    used_for: "Historical qualitative wet-fish gutting, washing, icing and organ-destination interfaces; no numeric yields, ice ratios or shelf-life defaults."
  - id: "fao-inshore-fish-handling"
    type: "official_guidance"
    reference: "FAO, Handling Inshore Fish. https://www.fao.org/4/x5892e/x5892e01.htm"
    used_for: "Qualitative cleaning, gut removal and handling risks; historical advice is not universal discharge permission or current legal compliance."
  - id: "reference-normalization-identity"
    type: "method_factor"
    reference: "Dimensional normalization identity defined in this PCR, sections 3 and 8: accepted net carcass kg divided by the same positive accepted net carcass kg equals 1. This is a declared method identity, not an external observation."
    used_for: "Fixed reference-quantity identity only; no yield, factor, real batch mass or empirical interval."
