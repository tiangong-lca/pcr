system_boundary:
  rules:
    - rule_id: boundary_sequence
      applies_to: "actual event graph"
      rule: "Table order is not a mandatory route. Prove actual capture, gutting, grading, preservation and presentation sequence using event/pass and paired transfer ids, preserving pending status. A parcel becomes reference output only after gutting, acceptance and nonfrozen requirements all hold."
      source_ids:
        - fao-wet-fish-handling
        - fao-inshore-fish-handling
    - rule_id: boundary_trip
      applies_to: "trip and shared resources"
      rule: "Attribute complete trip, idle/maintenance, replacement and actual asset-service periods to true consumers and periods; at-sea handover does not erase return resources or extend post-gate physical handling. Capture owns propulsion and shared onboard generation once."
      source_ids: []
    - rule_id: boundary_services
      applies_to: "external and shared services"
      rule: "Keep actual outsourced gutting, cleaning, chilling, ice manufacture and pre-gate movement in each node auxiliary service ledger with real invoiced functional unit, quantity, supplier data, contract scope and covered-resource matrix; never invent kg of service. Unverified service units/support identities remain blocking interfaces, not omitted burdens or a complete final inventory; separately inventory only non-inclusive resources."
      source_ids: []
    - rule_id: boundary_water
      applies_to: "water and residues"
      rule: "Record actual purchased/abstracted water, recirculation make-up, paired internal water/ice transfers, meltwater, product-carried water, releases, treatment, independently evidenced evaporation and opening/closing stocks. Recirculation is not new abstraction, melting is not new supply, and constituent loads do not duplicate whole-water mass. Each material parcel has one fate."
      source_ids: []
    - rule_id: boundary_technology
      applies_to: "capture parent and deltas"
      rule: "Under capture parent prove actual event-specific trawl/net/hook technology deltas in topology, energy, bait/gear materials, bycatch/loss and habitat-interaction categories. Never duplicate full catch or shared resources for one event or claim universally minimal impact."
      source_ids:
        - noaa-atlantic-cod
boundary_abstraction:
  declared_starting_condition: "Wild marine stock before actual producer capture; real trip, vessel/gear and asset service records."
  starting_condition_role: "Environment-to-capture origin and attributable resource start, not a burden-free purchased gutted input."
  product_classification_scope: "Marine wild head-on gutted fresh/chilled subset of CPC 3.0 04241."
  recursive_input_rule: "Same-category fish bought after a first producer gate cannot replace own capture; resale is excluded. Actual purchased bait remains its own input with supplier burden. Internal fish transfers use paired ids and no duplicated upstream capture."
  upstream_dataset_requirement: "Trace actual fuel, electricity, bait, consumables, water, ice, packages, capital and external service supply; record unresolved interfaces, not zero burdens."
  disclosure: "Declare ownership, marine source, actual gate, event sequence, time/grade states, scope of inclusive services, complete voyage/asset periods and exclusions."
