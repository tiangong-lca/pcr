system_boundary:
  rules:
    - rule_id: scope_origin
      applies_to: "all foreground"
      rule: "Include actual wild marine capture of Thunnus spp. or Katsuwonus pelamis through own first producer food handover of head-on gutted fresh/nonfrozen chilled fish. Capture is an independent removal responsibility; it does not imply farming and differs from subsequent gutting."
      source_ids:
        - un-cpc3-notes
        - noaa-tuna-gear
        - fao-tuna-handling-2025
    - rule_id: actual_sequence
      applies_to: "all handling nodes"
      rule: "The map is a responsibility list, not a fixed timeline. Keep event/pass/transfer ids and actual predecessor/successor state for every revisit. Grading, pre-chilling, killing/bleeding/gutting, gilling, washing and presentation may occur in actual evidenced order. Final handover requires completed gutting and actual food acceptance irrespective of last node name; unknown status is pending stock/data gap, never an inactive default."
      source_ids:
        - fao-tuna-handling-2025
    - rule_id: capture_delta
      applies_to: "capture; bait_supply; fad_service"
      rule: "Parent activity is capture. Hook/line methods activate actual purchased or own bait responsibility; purse-seine/skiff operation activates its actual equipment/energy and only evidenced FAD-associated events activate fad_service. Free-school/FAD-associated sets and gear variants are disjoint event facts, not duplicated catch. Retain observed bycatch, releases, deaths, gear/material loss and habitat/animal interactions; no universal impact claim, FAD life, catch efficiency or factor."
      source_ids:
        - noaa-tuna-gear
        - noaa-yellowfin
    - rule_id: mass_interfaces
      applies_to: "all nodes"
      rule: "Physical unallocated ledgers record actual species/tissues, water/ice, packaging, stock, loss and intended products first. Gutting must reconcile incoming whole fish with head-on gutted carcass, actually removed viscera/liver/roe/gills/blood and all measured fates; retained gills/tissues remain carcass mass. Do not assume whole input equals final gutted mass, or count the same blood/tissue both in waste mixture and constituent discharge."
      source_ids: []
    - rule_id: gate_and_trip
      applies_to: "capture; shared_resources; handover"
      rule: "Gate is the actual first producer-responsible food handover at sea, port or another documented collector point, not automatically port. Stop fish handling there, but retain attributable complete outward/search/fishing/return, failed/no-output voyages, idle/maintenance and asset service periods. No new downstream merchant holding or distribution activity belongs inside presentation."
      source_ids: []
    - rule_id: resource_ownership
      applies_to: "all nodes; shared_resources"
      rule: "Assign each actual resource/event to one node and period, excluding supplier-service-inclusive fuel, power, water and packaging from duplicate direct rows. shared_resources owns only genuine unpartitioned pools and assets across named consuming nodes/periods. Actual purchased services retain their provider functional unit and scope; if unsupported, preserve invoice and unresolved property/unit in auxiliary ledger before exchange publication."
      source_ids: []
    - rule_id: cold_history
      applies_to: "grade; chill; handover"
      rule: "Retain capture/death/bleeding/gutting/chill/transfer times, temperatures, instrument evidence, deviations and applicable competent-authority/market acceptance. Histamine-related hazards require actual decision evidence; later chilling/washing does not erase earlier unsafe history. This methodology does not certify food safety, set universal time/temperature limits or import US rules globally."
      source_ids:
        - fda-histamine-2024
        - fao-tuna-handling-2025
boundary_abstraction:
  declared_starting_condition: "Actual wild marine stock context, complete voyage opening, equipment/bait stocks and supply-chain receipts; no foreground aquaculture biomass production"
  starting_condition_role: "Wild removal context and burden-bearing product/service supply, not free bait or burden exemption"
  product_classification_scope: "CPC 3.0:04251; narrower"
  recursive_input_rule: "Own catch enters internal handling, not a newly recursively produced final product. Purchased post-first-gate same-category resale fish is outside this route; purchased same-species bait remains independent supplied product and burden."
  upstream_dataset_requirement: "Provide matching source/state/unit upstream data for actual fuel, electricity, water, ice, bait, materials, services and assets; own supply records its actual resources without duplicate supplied-product burden."
  disclosure: "Disclose voyage responsibility/opening/closing periods, actual chronology/gate, stocks/failed no-output periods, purchased/own resource ownership, service inclusions, coproduct attribution, asset-use/life evidence and unresolved identity/quantity gaps."
