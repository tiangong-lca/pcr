  calculation_rules:
    - id: physical_normalization
      applies_to: "all inventory rows"
      rule: "First close unallocated actual opening/receipt/transfer/output/loss/closing stock ledger and own shared node/period resources once; then divide by positive accepted final net kg. Separate LCA attributed view applies relevant output shares only once under section 7, retaining original ledger/matrix without shrinking mass partitions."
      inputs:
        - "actual node records"
        - "accepted final net kg"
        - "allocation matrix"
      output: "per 1 kg reference flow"
      source_ids: []
    - id: carcass_partition
      applies_to: "conditioning"
      rule: "Actual whole-fish receipts plus opening fish equal mutually exclusive actual partial-condition or completed head-on gutted transfers for that pass, removed organ/blood/gill fates, rejects/losses and closing fish; water/packaging use separate ledgers. Keep physical mass unallocated; retained gills/tissues remain carcass, and dissolved blood mixture/constituents cannot duplicate."
      inputs:
        - cp_conditioning_mass
        - "paired transfers"
      output: "physical closure and actual yield"
      source_ids: []
    - id: cold_history
      applies_to: "grade; chill; handover"
      rule: "Join same-lot species capture/death/handling/gate timestamps with continuous temperature records, deviations and applicable acceptance evidence; missing intervals are not controlled by default and later cooling does not reverse history; no fixed numeric threshold."
      inputs:
        - "actual lot history"
        - instruments
        - "acceptance decision"
      output: "traceable state and acceptance gap decision"
      source_ids:
        - fda-histamine-2024
    - id: water_fates
      applies_to: "all inventory rows"
      rule: "Separate actual supplied/abstracted/paired internal water and ice/melt ledgers; reconcile product-carried, transfer, treatment, actual-medium discharge, evidenced evaporation and stocks per period. Recirculation throughput is not new abstraction; pollutants and mixture amounts reconcile without duplication."
      inputs:
        - "actual node mass and fate records"
      output: "water/ice physical balance and identity-specific discharges"
      source_ids: []
    - id: direct_emissions
      applies_to: "all inventory rows"
      rule: "Use actual single-substance measurements or actual fuel carbon/composition/fossil fraction/oxidation and sourced factors; retain model algebra, units, raw factors, independent validation and uncertainty. Flow UUID supplies no factor."
      inputs:
        - "node-specific emission protocol"
        - "actual fuel"
        - "factor/source"
      output: "actual substance-specific release"
      source_ids: []
