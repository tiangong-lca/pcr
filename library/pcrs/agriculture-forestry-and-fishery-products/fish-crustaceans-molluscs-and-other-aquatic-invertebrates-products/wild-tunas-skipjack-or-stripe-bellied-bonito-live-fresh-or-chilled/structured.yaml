published_dataset_profile:
  dataset_role: "Foreground-record-based wild head-on gutted tuna/skipjack production data package"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Use for process or lifecyclemodel projections only when species/origin/form/first gate, actual technology/period match and concrete exchange identity/quantity gaps are resolved"
  excluded_use: "Not whole-CPC-leaf equivalent, farmed/live/ungutted/headed/processed/frozen-thawed products, later merchant gate, food-safety certification or complete quantitative data while gaps remain"
  required_metadata: "Species/waterbody/dates, gear/school association, actual handling events, net mass/gill state, complete cold-history acceptance, first gate, voyage/campaign periods, intended output set, allocation matrix, supplier service and asset boundaries"
  required_quality_disclosure: "Actual data coverage, representativeness/calibration/uncertainty, physical closure, independent QA and provisional ranges, unresolved identity/property/unit/quantity, failed no-output and service-inclusive ownership"
  update_trigger: "Species/boundary/form/gate, actual technology/cold acceptance or supplier/asset ownership changes; resolved identity/quantity evidence and empirical ranges"
data_sources:
  - id: "un-cpc3-notes"
    type: "official_guidance"
    reference: "United Nations Statistics Division. CPC Version 3.0 Explanatory Notes (30 June 2025), 04251. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification species/origin context only; proposed PCR is narrower, not a whole-leaf equivalent."
  - id: "noaa-tuna-gear"
    type: "official_guidance"
    reference: "NOAA Fisheries. West Coast Highly Migratory Species Fisheries and Gear. https://www.fisheries.noaa.gov/west-coast/sustainable-fisheries/west-coast-highly-migratory-species-fisheries-and-gear"
    used_for: "Qualitative actual capture-gear alternatives; no universal purse seine/FAD route or performance factor."
  - id: "noaa-yellowfin"
    type: "official_guidance"
    reference: "NOAA Fisheries. Pacific Yellowfin Tuna. https://www.fisheries.noaa.gov/species/pacific-yellowfin-tuna"
    used_for: "Species and regional gear/aggregation example only, not global impact, legality, fuel or FAD factor."
  - id: "fao-tuna-handling-2025"
    type: "official_guidance"
    reference: "FAO Common Oceans. First few minutes are key in handling tuna caught one-by-one (1 April 2025). https://www.fao.org/in-action/commonoceans/newsroom/news-and-stories/news-detail/first-few-minutes-are-key-in-handling-tuna-caught-one-by-one/en"
    used_for: "Qualitative killing/bleeding/gutting/gilling, nonfreezing cooling and protective presentation route; no numerical default or copied universal sequence."
  - id: "fda-histamine-2024"
    type: "official_guidance"
    reference: "US FDA. FDA Issues Final Compliance Policy Guide for Scombrotoxin (Histamine)-forming Fish and Fishery Products (2024). https://www.fda.gov/food/hfp-constituent-updates/fda-issues-final-compliance-policy-guide-scombrotoxin-histamine-forming-fish-and-fishery-products"
    used_for: "Hazard-history rationale only: formed histamine is not removed by later washing/freezing/heating; no US limit imported globally."
