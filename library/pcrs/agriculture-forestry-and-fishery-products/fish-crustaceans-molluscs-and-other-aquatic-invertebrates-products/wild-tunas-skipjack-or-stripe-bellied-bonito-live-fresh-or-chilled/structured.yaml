allocation_rules:
  - rule_id: physical_then_lca
    applies_to: "all inventory"
    rule: "Keep two labelled views: unallocated physical receipts/transfers/outputs/losses/stocks with node/period shared-resource ownership once, then normalize to positive accepted final net kg; separately retain a single-output LCA attributed inventory/burden view plus allocation matrix. Apply output shares only to relevant burden/attributed exchange ownership, never to physical carcass/organ/water partitions, and never twice at downstream handover."
    source_ids: []
  - rule_id: attribution_order
    applies_to: "bait_supply; capture; conditioning; grade; present; handover"
    rule: "First subdivide independently metered responsibilities and assign direct intended-product burdens. For genuinely joint remaining burdens, use an evidenced physical causal relationship only if justified for this fishery/handling boundary; otherwise use consistent economic shares of actual accepted output quantities and comparable same-gate values over the stated period, with sensitivity to data uncertainty. Retain chosen boundary, numerator/denominator, zero-value handling and alternative sensitivity. No invented zero burden, substitution or ecosystem credit."
    source_ids: []
  - rule_id: output_set
    applies_to: "bait_supply; capture; conditioning; grade; present; handover"
    rule: "Enumerate intended target and other catch, independent organ/offal/bait products and accepted other grades at their actual external handoffs. Internal transfers do not create new intended outputs. Waste, live return, dead discharge, retained stocks and packaging physically accompanying product are separately classified; organ removal alone does not prove coproduct status."
    source_ids: []
  - rule_id: trip_period_assets
    applies_to: "capture; fad_service; shared_resources"
    rule: "Declare voyage/batch/campaign boundaries and actual phases: departure/search/capture/handling/return/idle/cleaning/maintenance, FAD/buoy deployment/retrieval/replacement/retirement and vessel/port asset service. Retain no-output periods in the appropriate campaign burden pool; do not divide them by zero or drop them. Use observed service capacity/time/use and period opening/closing stocks, no universal lifetime. Resolve missing replacement/termination evidence before quantitative finalization."
    source_ids: []
  - rule_id: shared_once
    applies_to: "all nodes"
    rule: "For each shared vessel, generator, cold store, port facility, FAD/buoy or external service, identify all actual consumers and periods, record metered subdivision or justified capacity/time-use share, reconcile shares to the complete owned pool, and subtract already inclusive/direct responsibilities. Repeated handling passes inherit no second manufacturing charge or repeated output allocation."
    source_ids: []
