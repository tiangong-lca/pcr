    rule: "Check wild Thunnus/Katsuwonus pelamis, retained head, removed viscera and actual gill state, nonfrozen fresh/chilled condition, food acceptance and actual first producer gate. Reject other bonito species, farming/ranching, live/whole-ungutted final product, heading, fillets/loins/steaks, organs, frozen/thawed or processed products from denominator."
    source_ids:
      - un-cpc3-notes
  - rule_id: sequence_and_pairs
    applies_to: "all nodes"
    rule: "Every selected node and revisit has actual event/pass/transfer ids, compatible preceding/following state and paired internal quantity. Mandatory conditioning, actual destination grading and food/cold-history evidence are complete before final gate; node ordering never substitutes for evidence."
    source_ids: []
  - rule_id: physical_closure
    applies_to: "all nodes"
    rule: "Reconcile unallocated mass separately for fish/tissue, bait, water/ice, packaging and operational materials with opening plus receipts equals actual outputs plus losses plus closing stock, within declared measurement uncertainty. Separate environmental removal from purchased suppliers and inter-node transfers; flag missing fates, not force closure with evaporation."
    source_ids: []
  - rule_id: quantitative_gap
    applies_to: "all inventory"
    rule: "Each actual identity/unit/state/node has a Range, records and independent QA envelope. Provisional screening estimates are not measured defaults or accepted allowed limits: outliers trigger investigation, never clipping or false pass. Missing actual quantities, empirical support, service-unit conversion, substance identity or fate evidence remains an explicit data gap; no finalized quantitative exchange from an unresolved umbrella."
    source_ids: []
  - rule_id: cold_acceptance
    applies_to: "grade; chill; handover"
    rule: "Compare continuous actual capture-to-gate history with applicable documented market/authority requirements and actual acceptance, including deviations, corrective decisions and missing intervals. No universal threshold, current-temperature-only pass or safety certification follows from this PCR."
    source_ids:
      - fda-histamine-2024
  - rule_id: ownership_allocation
    applies_to: "all nodes"
    rule: "Check complete intended output set and external gates, direct/subdivided/joint attribution precedence, same-boundary values, actual production mode, cleaning/changeover/no-output/return periods and all asset consumers. Shares cover each owned pool exactly once; physical balances remain unallocated and downstream shares are not reapplied."
