system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "wild_pick; predry_hold; sun_dry; dry_grade; bag_present"
      rule: "Keep physical wild removal independent of drying and grading. Include required sun drying. Holding is a separately observed pre-dry intervention, not a generalized compulsory preservation node. No universal washing, trimming, salting or cultivation is assumed. Materially different cleaning evidence requires route review before expanding this boundary."
      source_ids:
        - fao-dulse-2003
        - dulse-ledger-method
    - rule_id: boundary_holding
      applies_to: "predry_hold"
      rule: "Record observed start/end, water handling and product state for active holding. Proven bypass requires contemporaneous route evidence. Unknown remains a data gap, never zero or bypass; reconcile the harvest-to-drying transfer for the chosen state."
      source_ids:
        - dulse-ledger-method
    - rule_id: boundary_gate
      applies_to: "receipt_logistics"
      rule: "Include every actual movement, waiting/storage service and handling step before first physical food-product receipt, irrespective of who pays or owns the cargo. Pair any inter-node movement with its actual source/recipient; receipt is a physical custody and acceptance event, not an invoice date."
      source_ids:
        - dulse-ledger-method
    - rule_id: boundary_fates
      applies_to: "all nodes"
      rule: "Enumerate every actual intended product, usable alternative, stock, return, reject, waste, carrier/free water, incidental material and environmental release. Collection obligations require one independent card for each actual concrete exchange after records establish occurrence, native unit and fate. Missing evidence does not create a zero."
      source_ids:
        - dulse-ledger-method
    - rule_id: boundary_period_assets
      applies_to: "all nodes"
      rule: "Index complete trips, drying runs, season/reporting periods, preparation, failed lots, cleanup, replacement and termination. For shared platforms, containers, trips or services identify every consuming node/output/period and allocate actual service once, including other consumers outside this reference system."
      source_ids:
        - dulse-ledger-method
    - rule_id: boundary_wild_growth
      applies_to: "wild_pick"
      rule: "Natural growth and photosynthesis before removal are not foreground managed production and confer no automatic carbon credit. Record actual biomass removal and evidenced disturbance/release separately; do not invent fertilizer, irrigation, respiration or sequestration exchanges."
      source_ids:
        - dulse-ledger-method
