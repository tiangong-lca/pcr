measurement_rules:
  - id: reference_net_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "A is the positive accepted net mass of the same whole dried food lot at physical receipt. Weigh using cp_receipt; subtract independently recorded packaging, free water and incidental matter. Native moisture remaining in dried plant tissue stays in A. A is neither anhydrous biomass nor fresh harvest mass."
  - id: moisture_state
    applies_to: "plant and water transfers"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Retain actual state, wet/dried-as-received basis, independently measured moisture and analytical dry-matter method. Dry matter = as-received plant mass × (1 - measured wet-basis moisture fraction). Convert reported percent to fraction explicitly. Never substitute fresh mass, anhydrous mass or another lot's moisture for A."
  - id: handoff_pairing
    applies_to: "internal plant, carrier water, incidental matter, packaging, stocks and returns"
    required_property_ref:
      name: "Matched transfer native property"
      uuid: ""
    required_unit: "Matched transfer native unit"
    rule: "Pair source output and recipient input by transfer id, physical identity, state, gate, native property/unit and time. Plant/water transfers use mass kg; variable support and item exchanges keep their actual verified native unit. Maintain fresh and dried transfer measurements independently. Explain timing differences with actual stock/return records; no internal feed is fixed to 1 kg merely because the reference is 1 kg."
  - id: native_energy_service
    applies_to: "actual energy-carrier and service instances"
    required_property_ref:
      name: "Actual instance native property"
      uuid: ""
    required_unit: "Actual instance native unit"
    rule: "Retain each concrete exchange in its verified native property/unit: electricity may use kWh, fuel kg or m3, supplied heat MJ, and each provider service its actual native unit. If required, calculate auxiliary electricity energy MJ = actual kWh × 3.6; fuel-volume energy requires measured density and documented heating value/basis. Auxiliary MJ never replaces a carrier exchange or creates a second energy burden. No universal service-to-mass or service-to-energy conversion exists."
  - id: stock_quantity
    applies_to: "opening, received reused, closing and returned stocks"
    required_property_ref:
      name: "Actual stock native property"
      uuid: ""
    required_unit: "Actual stock native unit"
    rule: "Record quantities, native property/unit, state, origin, ownership/custody and inherited burdens of each actual plant, water, package, support material and reusable item. Plant/water use mass kg; other items retain actual verified native units. Attribute consumed service or losses independently of stock quantity. Never assume opening or returned stocks are zero."
