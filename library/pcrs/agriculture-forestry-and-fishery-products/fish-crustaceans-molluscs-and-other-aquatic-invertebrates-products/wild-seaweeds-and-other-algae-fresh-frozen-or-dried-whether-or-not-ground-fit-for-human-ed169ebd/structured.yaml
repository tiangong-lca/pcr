      markdown: "## 9. Validation Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `validate_reference` | whole_dulse_received | Require positive same-lot net A, exactly one reference link/output, whole dried wild handpicked Palmaria palmata state, actual food fitness plus primarily human-food use and actual physical recipient. Exclude free water, incidentals and package; retain measured native plant moisture. A/A checks normalization, not yield or safety. | `dulse-ledger-method` |\n| `validate_holding_drying` | predry_hold; sun_dry | Check active/proven bypass/unknown holding evidence and paired selected handoff. Unknown fails completeness; active holding has bounded start/end and water/plant fates. Require actual sun drying independently of holding; no mandatory washing/trimming/salting or invented purchased heat. | `dulse-ledger-method` |\n| `validate_all_fates` | all nodes | Check each actual output/grade/destination, usable alternative, reject, waste, incidental return, water, package, stocks and returns. Match same-state/native-unit handoffs and quantity/burden ledgers. A missing occurrence record is not zero. | `dulse-ledger-method` |\n| `validate_mass_water` | plant and water | Independently check fresh and dried masses, wet-basis moisture/dry matter, side losses and stock changes; separate actual evaporation from pollutant mass. Do not impose a universal fresh-to-dried factor or fixed internal-feed mass. | `dulse-ledger-method` |\n| `validate_energy_release` | actual carrier/service/release instances | Retain verified native exchange quantities/properties/units. Each directly measured amount uses foreground_record/collected_record; each computed carrier, electricity, service or release amount uses calculated_value/calculated_from_collection with per-instance measured inputs, formula and factor/unit/source. Auxiliary MJ cannot replace a native fuel exchange or add duplicate energy burden. Substance and receiving medium precede identity selection. Confirm complete-service coverage excludes duplicate component burdens and records actual asset consumers. | `dulse-ledger-method` |\n| `validate_output_period` | all allocation ledgers | Check every intended output and handoff, complete run/season failures/cleanup, retained-stock valuation/burdens, shared consumers and period attribution once. Economic fallback requires comparable nonnegative producer-gate net-sales values and positive denominator; zero/negative/missing values require a justified alternate with sensitivity and remaining-gap disclosure. | `dulse-ledger-method` |\n| `validate_ranges_identity` | all cards and concrete exchanges | Verify every Range role/unit/basis/evidence; provisional 0..U cannot be treated as measured amount or admissibility cap. Reference 1..1 is normalization only. Verify concrete UUID/property/unit compatibility separately; automated structural checks do not prove identity, physical plausibility, translation equivalence or publication readiness. | `dulse-ledger-method` |\n| `validate_atomic_completion` | all applicable per-flow collection obligations and final exchanges | Final dataset completion and validation require every actual exchange to have an independent atomic card and its own quantity, property/native unit, collection or calculation evidence, range/uncertainty evidence, normalization, actual destination and verified UUID. Unknown identity, activity state, quantity, range evidence or fate blocks completion; it is never zero, a presumed bypass or permission to omit an obligation. Every important concrete flow retains its own range/uncertainty evidence collection duty; a symbolic upper bound is not an empirical range. | |\n\n"
