      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Wild Palmaria palmata attached in the actual collection habitat immediately before hand removal; supplier-provided previously collected material is an explicit upstream cut with retained collection burdens and state. |\n| starting_condition_role | Evidence-backed foreground starting fact; wild growth is not managed cultivation. |\n| product_classification_scope | Only wild algae lots actually fit and primarily used for human consumption, within the narrower whole sun-dried handpicked Palmaria palmata boundary. |\n| recursive_input_rule | Received fresh or dried dulse of the same category is a separately measured input with provenance, state and upstream burden. End recursion at a declared documented supplier boundary; do not treat purchase, opening stock, return or wild origin as zero burden. |\n| upstream_dataset_requirement | Link verified upstream collection, material, energy, service and treatment datasets appropriate to actual exchanges and disclosed stopping boundary. Missing upstream evidence remains a gap; a generic algae dataset cannot silently replace this route. |\n| disclosure | Locations, actual wild origin, trips/runs/lots, active/bypass/unknown holding, sun drying, food qualification, all pre-receipt legs regardless of payer, side destinations, stocks/returns, shared assets/consumers, period/service-life attribution, upstream cuts and remaining gaps. |\n\n### Boundary Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `boundary_route` | wild_pick; predry_hold; sun_dry; dry_grade; bag_present | Keep physical wild removal independent of drying and grading. Include required sun drying. Holding is a separately observed pre-dry intervention, not a generalized compulsory preservation node. No universal washing, trimming, salting or cultivation is assumed. Materially different cleaning evidence requires route review before expanding this boundary. | `fao-dulse-2003`; `dulse-ledger-method` |\n| `boundary_holding` | predry_hold | Record observed start/end, water handling and product state for active holding. Proven bypass requires contemporaneous route evidence. Unknown remains a data gap, never zero or bypass; reconcile the harvest-to-drying transfer for the chosen state. | `dulse-ledger-method` |\n| `boundary_gate` | receipt_logistics | Include every actual movement, waiting/storage service and handling step before first physical food-product receipt, irrespective of who pays or owns the cargo. Pair any inter-node movement with its actual source/recipient; receipt is a physical custody and acceptance event, not an invoice date. | `dulse-ledger-method` |\n| `boundary_fates` | all nodes | Enumerate every actual intended product, usable alternative, stock, return, reject, waste, carrier/free water, incidental material and environmental release. Collection obligations require one independent card for each actual concrete exchange after records establish occurrence, native unit and fate. Missing evidence does not create a zero. | `dulse-ledger-method` |\n| `boundary_period_assets` | all nodes | Index complete trips, drying runs, season/reporting periods, preparation, failed lots, cleanup, replacement and termination. For shared platforms, containers, trips or services identify every consuming node/output/period and allocate actual service once, including other consumers outside this reference system. | `dulse-ledger-method` |\n| `boundary_wild_growth` | wild_pick | Natural growth and photosynthesis before removal are not foreground managed production and confer no automatic carbon credit. Record actual biomass removal and evidenced disturbance/release separately; do not invent fertilizer, irrigation, respiration or sequestration exchanges. | `dulse-ledger-method` |\n\n"
