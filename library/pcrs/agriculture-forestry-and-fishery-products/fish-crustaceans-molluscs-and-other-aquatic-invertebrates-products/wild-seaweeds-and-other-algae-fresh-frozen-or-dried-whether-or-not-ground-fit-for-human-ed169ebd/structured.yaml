      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `allocate_subdivide` | all nodes | First subdivide independently measured collection, holding, drying, grading, bagging and logistics responsibilities and output-specific work. Assign direct work to its actual output. Keep the complete actual output set: whole-food product, usable inferior alternatives, retained stocks, returns, rejects and waste. | `dulse-ledger-method` |\n| `allocate_shared_outputs` | shared pre-grade burdens | For inseparable common burdens prefer an evidenced causal physical relation. Fresh/dried moisture differences make a simple kg ratio insufficient without justification. Only when subdivision and an evidenced causal physical attribution cannot resolve the actual joint burden, use comparable nonnegative producer-gate net-sales values for actual usable outputs, with a strictly positive total denominator, consistent currency/date/boundary and documented valuation of retained usable stock. Shares = each output's comparable value / sum of comparable values. Never use profit. | `dulse-ledger-method` |\n| `allocate_value_gaps` | zero, negative or missing values | Do not silently drop an output or accept an invalid denominator. Explain zero/negative/missing prices or retained-stock valuation, select an evidenced alternate physical attribution with rationale and sensitivity, and retain unresolved cases as gaps. Treatment of waste is not automatically a revenue co-product or an avoided-burden credit. | `dulse-ledger-method` |\n| `allocate_period` | trips, runs, season and stocks | Attribute preparation, failed trips/lots, changeover, cleanup, replacements and termination across the complete declared useful-service/output period. Opening and received reused stocks retain inherited burdens; closing/returned stocks carry the documented residual burden. Reconcile quantities and burden carryover so neither period receives a duplicate or free service. | `dulse-ledger-method` |\n| `allocate_shared_assets` | platforms, containers, vehicles and complete services | Enumerate every actual consumer/node/output/period, including other products. Attribute shared trip/platform service once using evidenced occupancy, area-time, load-distance or another causal driver in its native unit; document service life, replacement, actual use and unused/failed capacity. Complete-service coverage takes precedence over separately covered components. | `dulse-ledger-method` |\n\n"
