validation_rules:
  - rule_id: validate_reference
    applies_to: "whole_dulse_received"
    rule: "Require positive same-lot net A, exactly one reference link/output, whole dried wild handpicked Palmaria palmata state, actual food fitness plus primarily human-food use and actual physical recipient. Exclude free water, incidentals and package; retain measured native plant moisture. A/A checks normalization, not yield or safety."
    source_ids:
      - dulse-ledger-method
  - rule_id: validate_holding_drying
    applies_to: "predry_hold; sun_dry"
    rule: "Check active/proven bypass/unknown holding evidence and paired selected handoff. Unknown fails completeness; active holding has bounded start/end and water/plant fates. Require actual sun drying independently of holding; no mandatory washing/trimming/salting or invented purchased heat."
    source_ids:
      - dulse-ledger-method
  - rule_id: validate_all_fates
    applies_to: "all nodes"
    rule: "Check each actual output/grade/destination, usable alternative, reject, waste, incidental return, water, package, stocks and returns. Match same-state/native-unit handoffs and quantity/burden ledgers. A missing occurrence record is not zero."
    source_ids:
      - dulse-ledger-method
  - rule_id: validate_mass_water
    applies_to: "plant and water"
    rule: "Independently check fresh and dried masses, wet-basis moisture/dry matter, side losses and stock changes; separate actual evaporation from pollutant mass. Do not impose a universal fresh-to-dried factor or fixed internal-feed mass."
    source_ids:
      - dulse-ledger-method
  - rule_id: validate_energy_release
    applies_to: "actual carrier/service/release instances"
    rule: "Retain verified native exchange quantities/properties/units. Each directly measured amount uses foreground_record/collected_record; each computed carrier, electricity, service or release amount uses calculated_value/calculated_from_collection with per-instance measured inputs, formula and factor/unit/source. Auxiliary MJ cannot replace a native fuel exchange or add duplicate energy burden. Substance and receiving medium precede identity selection. Confirm complete-service coverage excludes duplicate component burdens and records actual asset consumers."
    source_ids:
      - dulse-ledger-method
  - rule_id: validate_output_period
    applies_to: "all allocation ledgers"
    rule: "Check every intended output and handoff, complete run/season failures/cleanup, retained-stock valuation/burdens, shared consumers and period attribution once. Economic fallback requires comparable nonnegative producer-gate net-sales values and positive denominator; zero/negative/missing values require a justified alternate with sensitivity and remaining-gap disclosure."
    source_ids:
      - dulse-ledger-method
  - rule_id: validate_ranges_identity
    applies_to: "all cards and concrete exchanges"
    rule: "Verify every Range role/unit/basis/evidence; provisional 0..U cannot be treated as measured amount or admissibility cap. Reference 1..1 is normalization only. Verify concrete UUID/property/unit compatibility separately; automated structural checks do not prove identity, physical plausibility, translation equivalence or publication readiness."
    source_ids:
      - dulse-ledger-method
  - rule_id: validate_atomic_completion
    applies_to: "all applicable per-flow collection obligations and final exchanges"
    rule: "Final dataset completion and validation require every actual exchange to have an independent atomic card and its own quantity, property/native unit, collection or calculation evidence, range/uncertainty evidence, normalization, actual destination and verified UUID. Unknown identity, activity state, quantity, range evidence or fate blocks completion; it is never zero, a presumed bypass or permission to omit an obligation. Every important concrete flow retains its own range/uncertainty evidence collection duty; a symbolic upper bound is not an empirical range."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground collection package first; process and lifecyclemodel are derived publication/validation/use projections."
  downstream_use: "A completed, reviewed package may become a secondary_dataset or background_dataset only for concretely verified exchanges and disclosed route/gate."
  allowed_use: "Represent actual wild handpicked whole sun-dried Palmaria palmata food lots with compatible origin, state, first-physical-recipient boundary, stock/period attribution and native moisture basis."
  excluded_use: "Automatic substitution for cultivated algae, fresh/frozen/ground/flaked/extracted/salted/cooked final products, unqualified food lots, anhydrous biomass, downstream use/end of life, or automatic carbon sequestration credits."
  required_metadata: "PCR id/version; locations/species/wild route; trips/runs/lots/periods; holding state/evidence; sun drying; food fitness/use/receipt; A and tare/free water/incidentals; moisture method/results; all legs/payers/custody; side outputs; support/package reuse; asset/service consumers; stock/returns/burdens; allocation/factor/identity evidence; upstream cuts."
  required_quality_disclosure: "Actual temporal/site coverage; incomplete nodes/exchanges; measured versus calculated records; factor compatibility; provisional/empirical Range distinction; all unresolved UUID/supports; balance residuals; failed lots; stock carryover; valuation/alternative-method sensitivity; checks performed/skipped and completeness."
  update_trigger: "Actual route/species/origin/form/gate or food-destination change; new holding/cleaning intervention; revised moisture/measurement method; new grade/fate; changed package, service scope, asset use/life or period attribution; improved factors/identity/range evidence."
data_sources:
  - id: "fao-dulse-2003"
    type: "official_guidance"
    reference: "McHugh, D.J. (2003), A guide to the seaweed industry, FAO Fisheries Technical Paper 441, chapter 8 section 8.9; https://www.fao.org/4/y4765e/y4765e0b.htm ; retrieved 2026-10-12"
    used_for: "Historical wild dulse route and distinction from cultivated, whole versus inferior alternative processing; not actual lot quantities, current food certification, safety, shelf life or receipt evidence."
  - id: "dulse-ledger-method"
    type: "method_factor"
    reference: "Declared accounting and foreground collection method in sections 4–9 of this PCR"
    used_for: "Net dried-as-received reference, node/transfer/stock/water/period accounting, normalization, native energy/service and per-instance release methods, attribution and completeness checks; future actual records/factors remain required."
