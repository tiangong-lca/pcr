allocation_rules:
  - rule_id: allocate_subdivide
    applies_to: "all nodes"
    rule: "First subdivide independently measured collection, holding, drying, grading, bagging and logistics responsibilities and output-specific work. Assign direct work to its actual output. Keep the complete actual output set: whole-food product, usable inferior alternatives, retained stocks, returns, rejects and waste."
    source_ids:
      - dulse-ledger-method
  - rule_id: allocate_shared_outputs
    applies_to: "shared pre-grade burdens"
    rule: "For inseparable common burdens prefer an evidenced causal physical relation. Fresh/dried moisture differences make a simple kg ratio insufficient without justification. Only when subdivision and an evidenced causal physical attribution cannot resolve the actual joint burden, use comparable nonnegative producer-gate net-sales values for actual usable outputs, with a strictly positive total denominator, consistent currency/date/boundary and documented valuation of retained usable stock. Shares = each output's comparable value / sum of comparable values. Never use profit."
    source_ids:
      - dulse-ledger-method
  - rule_id: allocate_value_gaps
    applies_to: "zero, negative or missing values"
    rule: "Do not silently drop an output or accept an invalid denominator. Explain zero/negative/missing prices or retained-stock valuation, select an evidenced alternate physical attribution with rationale and sensitivity, and retain unresolved cases as gaps. Treatment of waste is not automatically a revenue co-product or an avoided-burden credit."
    source_ids:
      - dulse-ledger-method
  - rule_id: allocate_period
    applies_to: "trips, runs, season and stocks"
    rule: "Attribute preparation, failed trips/lots, changeover, cleanup, replacements and termination across the complete declared useful-service/output period. Opening and received reused stocks retain inherited burdens; closing/returned stocks carry the documented residual burden. Reconcile quantities and burden carryover so neither period receives a duplicate or free service."
    source_ids:
      - dulse-ledger-method
  - rule_id: allocate_shared_assets
    applies_to: "platforms, containers, vehicles and complete services"
    rule: "Enumerate every actual consumer/node/output/period, including other products. Attribute shared trip/platform service once using evidenced occupancy, area-time, load-distance or another causal driver in its native unit; document service life, replacement, actual use and unused/failed capacity. Complete-service coverage takes precedence over separately covered components."
    source_ids:
      - dulse-ledger-method
dataset_production:
  collection_protocols:
    - protocol_id: cp_pick
      process_id: "wild_pick"
      flow_role: "Own-node harvest biomass, fresh product, supplies, services, energy, stocks, waste and releases"
      record_type: "Trip/lot records, calibrated weights, supplier and observation records"
      raw_fields: "Species; wild site; exposed-rock handpick evidence; trip/lot/time; fresh plant removed/collected; separate carried water/incidentals; loss/fates; actual supplies/stock/returns; service coverage/consumers; native energy; actual release substance/medium; inherited burdens; A link"
      collection_method: "Observe collection and custody; independently weigh actual net fresh plant, incidental/free-water and support quantities; record each actual fate; meter or trace actual services/energy; reconcile transfer and season stock ledger"
      unit: "kg for plant/water; actual carrier/material/service native property and unit; auxiliary MJ separately if calculated"
      frequency: "Every trip, transfer, event and stock boundary"
      temporal_coverage: "Complete declared season/reporting period including failed trips, preparation and cleanup"
      site_scope: "Actual collection site and each harvest service consumer"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration/tare; species/provenance; transfer receipts; complete trip/stock/consumer ledger; factor provenance and uncertainty"
    - protocol_id: cp_hold
      process_id: "predry_hold"
      flow_role: "Own-node fresh plant, holding water, supplies, services, energy, stocks, returns, waste and releases"
      record_type: "Observed holding-event records or proven bypass evidence"
      raw_fields: "Event/lot/time; active/bypass/unknown; fresh plant in/out and moisture; supplied/direct/reused water by origin; water return/evaporation/managed fate; incidentals; support stock/returns; energy/service coverage; substance/medium; factors; A link"
      collection_method: "Observe start/end or evidence bypass; independently weigh plant/water/support and actual fates; meter water or convert measured volume with documented density; retain no-zero treatment for unknown"
      unit: "kg for plant/water; actual carrier/material/service native property and unit; auxiliary MJ separately if calculated"
      frequency: "Every actual event, transfer and stock boundary"
      temporal_coverage: "Complete holding events and reporting periods including deterioration, failed lots and cleanup"
      site_scope: "Actual holding location/source water/receiving medium and service consumers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "State evidence; weights/meters; water and plant balance; stock/return pairing; supplier scope; factor records"
    - protocol_id: cp_dry
      process_id: "sun_dry"
      flow_role: "Own-node fresh and dried plant, platform, supplies, services, energy, stock, rejects, evaporation and releases"
      record_type: "Drying-run weights, observations, moisture measurements and resource ledger"
      raw_fields: "Run/lot/start/end/weather; actual sun exposure; fresh/dried masses; moisture method/results/sample ids; carried/free water; side products/waste; water removals; support/platform opening/reused/closing/return; occupancy/consumers/service period; actual energy/service/release and factor records; A link"
      collection_method: "Independently weigh same-run fresh and dried states; sample moisture by declared representative method; separately measure side outputs/stock and water routes; record actual platform and handling service, interruptions, failed lots and cleanup"
      unit: "kg for plant/water; moisture fraction or percent with explicit basis; actual carrier/material/service native property and unit; auxiliary MJ separately if calculated"
      frequency: "Every run and transfer; representative moisture samples at each measured state"
      temporal_coverage: "Complete drying runs, failures, preparation, cleanup and platform service periods"
      site_scope: "Actual drying site/platform and every consumer"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated/tared weights; same-lot moisture evidence; state-specific water balance; measured platform use/life; complete run ledger"
    - protocol_id: cp_grade
      process_id: "dry_grade"
      flow_role: "Own-node dried input, all grades/destinations, support, service, energy, stock, waste and releases"
      record_type: "Lot grading, qualification, weighing, destination and resource records"
      raw_fields: "Lot/input state/moisture; each actual grade/food fitness/use evidence; whole-food mass; usable inferior mass/handoff; rejects and destinations; stock/returns; supports; energy/services/coverage; actual substance/medium; output values/currency/date/stock valuation; A link"
      collection_method: "Independently weigh each actual output state and reconcile input/stock; retain actual food acceptance and primarily human-food use evidence; separate usable alternatives from waste; record all native resources and fates"
      unit: "kg for plant; actual carrier/material/service native property and unit; auxiliary MJ separately if calculated; comparable output values"
      frequency: "Every lot/grade/handoff/event/stock boundary"
      temporal_coverage: "Complete declared lots and reporting periods including failed/returned lots and cleanup"
      site_scope: "Actual grading location and every output destination/service consumer"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Grade criteria/qualification; weights; food/use records; destination receipts; complete output/stock/value ledger and sensitivity"
    - protocol_id: cp_bag
      process_id: "bag_present"
      flow_role: "Own-node whole plant, packaging, supports, services, energy, stocks, waste and releases"
      record_type: "Packing-run weights, package inventory and presentation records"
      raw_fields: "Packing run/lot/time; whole plant input/output/moisture; actual bag/closure/label material; per-item tare samples/count; new/reused/opening/closing/return stocks and burdens; rejects; support/service/energy/coverage; actual release/factors; dispatch transfer; A link"
      collection_method: "Independently weigh net plant and actual packaging separately; use representative same-item tare samples for counts; record whole-frond state and package reuse/custody; reconcile run stocks, waste and dispatch"
      unit: "kg for plant/package; actual carrier/material/service native property and unit; auxiliary MJ separately if calculated; item count retained separately"
      frequency: "Every run/dispatch/event/stock boundary"
      temporal_coverage: "Complete packing runs, failures, changeover and cleanup periods"
      site_scope: "Actual packing site and service consumers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Tare/calibration; package identity/reuse; whole state; paired dispatch; complete material/stock/service ledger"
    - protocol_id: cp_receipt
      process_id: "receipt_logistics"
      flow_role: "Own-node all pre-receipt legs, plant/package acceptance, alternatives, supports, services, energy, stocks, waste and releases"
      record_type: "Leg/custody/receipt records, calibrated weights and resource ledger"
      raw_fields: "Every leg/time/source/recipient/state; payer-independent custody; actual load/distance/duration; service coverage/consumers; energy/factors; opening/reused/closing/return stocks and burdens; plant net/gross/tare/free water/incidentals; moisture method/result; A; food fitness/primarily human-food use/physical acceptance; alternative/rejected destinations; actual release substance/medium"
      collection_method: "Trace every movement and waiting/storage/handling event; independently weigh accepted whole dried plant excluding actual package/free water/incidentals; retain actual remaining tissue moisture; pair each real state handoff and separately weigh package/side outputs; evidence actual physical recipient/date and food acceptance"
      unit: "kg for plant/package; km; time; actual carrier/material/service native property and unit; auxiliary MJ separately if calculated"
      frequency: "Every leg, receipt, side handoff, event and stock boundary"
      temporal_coverage: "Entire pre-receipt chain and complete allocated trip/season/service periods including failures, returns, repositioning and cleanup"
      site_scope: "All actual pre-receipt sites, modes and first physical food-product recipient"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Positive net A; calibration/tare; food/destination/physical acceptance; complete legs/stock/consumer ledger; scope exclusions; native-unit/factor evidence"
  calculation_rules:
    - id: reference_normalization
      applies_to: "whole_dulse_received"
      rule: "Accepted reference quantity = A / A = 1 kg per 1 kg reference flow, with A the same positive net dried-as-received physically accepted whole-food lot mass."
      inputs:
        - A
        - cp_receipt
        - reference_net_mass
      output: "Reference amount with same-lot provenance and moisture retained"
      source_ids:
        - dulse-ledger-method
    - id: ledger_normalization
      applies_to: "all inventory rows"
      rule: "For each actual exchange, retain measured native quantity x and attributable share s; normalized quantity = x × s / A per 1 kg reference flow. s is documented output/consumer/period attribution, not a default. Internal transfers keep their actual x, and quantities and inherited burdens are reconciled separately."
      inputs:
        - "Actual node-owned protocol records"
        - x
        - "documented s"
        - A
        - "stock/return ledger"
      output: "Each exchange in its declared native numerator unit per 1 kg reference flow"
      source_ids:
        - dulse-ledger-method
    - id: instance_energy
      applies_to: "collect_pick_energy; collect_hold_energy; collect_dry_energy; collect_grade_energy; collect_bag_energy; collect_logistics_energy"
      rule: "Keep the actual carrier exchange in verified native property/unit with measured or calculated metadata matching its actual amount evidence. Only when useful and supported, auxiliary electricity energy MJ = measured kWh × 3.6; auxiliary fuel energy MJ = measured fuel mass × documented heating value, or measured fuel volume × measured/documented density × documented heating value. Supplied heat keeps its actual measured energy unit. State each formula, factor/unit/source/basis and uncertainty. Auxiliary MJ is an analytical result, never a replacement fuel exchange or a second energy exchange/burden. Normalize attributed actual carrier quantity by A; unknown inputs/factors are gaps."
      inputs:
        - "Own-node actual carrier identity"
        - "native quantity/property/unit"
        - "measured inputs"
        - "any actual conversion/density/heating-value factors and sources"
        - attribution
        - A
      output: "Native carrier exchange and, separately if supported, auxiliary energy with full calculated metadata"
      source_ids:
        - dulse-ledger-method
    - id: instance_release
      applies_to: "collect_pick_environment; collect_hold_environment; collect_dry_environment; collect_grade_environment; collect_bag_environment; collect_logistics_environment"
      rule: "For each actual substance and receiving medium, release mass = independently measured activity × applicable documented substance-specific factor, with stated units, geography/technology/basis and source; normalize attributed release by A. Directly measured returns/releases retain collected metadata. Do not derive a generic pollutant, carbon credit or occurrence from this formula."
      inputs:
        - "Own-node measured inputs"
        - "actual substance/medium"
        - "factor/formula/source"
        - "coverage exclusions"
        - A
      output: "Each actual release in kg with calculated or measured metadata as applicable"
      source_ids:
        - dulse-ledger-method
    - id: water_balance
      applies_to: "dry_evaporation; collect_hold_environment"
      rule: "Water opening + actual water input + water in plant input = water closing + water in plant output + water in side outputs + actual carried/direct-return/managed water + evaporation. Use independent state masses and measured moisture; solve evaporation only after all other terms and uncertainty are supported. Native plant dry matter, incidental matter, rejects and stock changes remain separate."
      inputs:
        - "cp_dry or cp_hold measured state-specific water"
        - moisture
        - "side-output and stock records"
      output: "Actual evaporation water and water-balance uncertainty, separately from pollutant releases"
      source_ids:
        - dulse-ledger-method
    - id: transport_activity
      applies_to: "collect_logistics_service"
      rule: "Only for a verified mass-distance service, activity tkm = actual carried tonnes × actual leg km; include actual packaging/carrier load and attributable empty/repositioning legs consistently. Other services retain their actual native unit and method. Divide attributed service by A."
      inputs:
        - "cp_receipt actual leg/load/distance/service coverage and attribution"
      output: "Actual provider-native transport/service quantity per 1 kg reference flow"
      source_ids:
        - dulse-ledger-method
  data_quality_requirements:
    - id: quality_identity_route
      applies_to: "reference and all plant transfers"
      requirement: "Demonstrate species, wild origin, handpicking, whole state, actual sun drying, holding status and food-lot qualification/destination; source narrative supports route design only."
      evidence: "Actual provenance, route observations, lot qualification and physical recipient records; fao-dulse-2003 for historical context only"
    - id: quality_state_balance
      applies_to: "each real node and handoff"
      requirement: "Reconcile independently measured plant, water, incidentals, package/support, opening/received reused/closing/return stock and every actual fate by state/unit/time. Dry mass and fresh mass are not interchangeable."
      evidence: "Own-node protocol records; paired transfer ids; moisture tests; explicit balance residual and uncertainty"
    - id: quality_amount_evidence
      applies_to: "every exchange and Range"
      requirement: "Actual records and documented formulas produce values. Qualitative FAO guidance does not supply measured amounts. Replace provisional U with independent evidence before treating a Range as empirical; retain unavailable quantities as gaps."
      evidence: "Measured raw records, factor/source/formula metadata; independent comparable range sample and rationale"
    - id: quality_period_complete
      applies_to: "attribution and assets"
      requirement: "Include complete trips/runs/seasons, failures, cleanup, replacement, termination, all shared consumers and burden carryover. No duplicate whole-service/component attribution."
      evidence: "Period/consumer/coverage ledgers; asset life/use records; stock burden reconciliation; output valuation/sensitivity"
    - id: quality_binding
      applies_to: "concrete exchanges"
      requirement: "Resolve each actual identity, property and native unit by detail verification before TIDAS exchange publication. Collection obligations are collection requirements, never generic UUID substitutes."
      evidence: "Concrete per-instance verification evidence retained with the data package; unresolved manifest entries for candidate PCR gaps"
    - id: collect_pick_support_in
      applies_to: "wild_pick; Inputs; Product flows"
      requirement: "Identify each actual physically or chemically specific exchange within this collection scope and add an independent inventory card; this collection scope is not a flow. Establish substance/species, state, flow type, property, native unit, quantity, evidence, normalization, destination and UUID separately for each card. Do not copy an aggregate quantity, common upper bound or UUID onto its members. Determine final direction and product/waste/elementary type from each actual source and fate; the collection scope does not assign a universal exchange type. Collection scope: Actual harvest supplies and received reusable stocks. Record each actual tool, container or ancillary material separately, including opening/received reused quantity, state and inherited burden; include only the attributable service of durable items. <br> Quantity calculation requirement: Independently recorded instance quantity and attributable burden using cp_pick; normalize by accepted A under ledger_normalization. <br> - Flow property / unit: Actual instance native property / actual instance native unit <br> - Amount rule: Record the actual node-owned quantity in its declared native unit per 1 kg reference flow; the quantity calculation requirement above and section 8 govern measurement, attribution and calculation evidence. <br> - Value mode: foreground_record <br> - Specificity: site_specific <br> - Normalization basis: per 1 kg reference flow <br> - Basis kind: reference_flow <br> - Evidence kind: collected_record <br> - Collection protocol: cp_pick <br> - Sources: dulse-ledger-method <br> - Range: Provisional harvest-support uncertainty; U requires independent evidence <br> - Range role: uncertainty_range <br> - Lower: 0 <br> - Upper: U <br> - Unit: actual instance native unit <br> - Basis: per 1 kg reference flow <br> - Basis kind: reference_flow <br> - Evidence kind: reasoned_estimate"
      evidence: "Node collection protocol, original records and individual identity, quantity, range and destination evidence"
    - id: collect_pick_energy
      applies_to: "wild_pick; Inputs; Product flows"
      requirement: "Identify each actual physically or chemically specific exchange within this collection scope and add an independent inventory card; this collection scope is not a flow. Establish substance/species, state, flow type, property, native unit, quantity, evidence, normalization, destination and UUID separately for each card. Do not copy an aggregate quantity, common upper bound or UUID onto its members. Determine final direction and product/waste/elementary type from each actual source and fate; the collection scope does not assign a universal exchange type. Collection scope: Actual uncovered harvest energy carriers. Separate actual electricity and fuel instances; retain native source units and documented conversions. Do not infer motor use from handpicking. <br> Quantity calculation requirement: Record each actual uncovered carrier exchange in its verified native property/unit using its own node protocol: electricity may be kWh, fuel kg or m3, and supplied heat MJ as actually verified. Normalize actual carrier quantity by A under ledger_normalization. instance_energy produces a separately labelled auxiliary MJ result only when supported; it never replaces the carrier exchange or creates an additional energy burden. Each actual instance must use foreground_record/collected_record for a directly measured quantity, or calculated_value/calculated_from_collection with measured inputs, formula, factor/unit/source for a calculated quantity. No carrier occurrence is presumed. <br> - Flow property / unit: Actual carrier native property / actual carrier native unit <br> - Amount rule: Record the actual node-owned quantity in its declared native unit per 1 kg reference flow; the quantity calculation requirement above and section 8 govern measurement, attribution and calculation evidence. <br> - Value mode: foreground_record <br> - Specificity: site_specific <br> - Normalization basis: per 1 kg reference flow <br> - Basis kind: reference_flow <br> - Evidence kind: collected_record <br> - Collection protocol: cp_pick <br> - Sources: dulse-ledger-method <br> - Range: Provisional harvest-energy uncertainty; U requires independent evidence <br> - Range role: uncertainty_range <br> - Lower: 0 <br> - Upper: U <br> - Unit: actual carrier native unit <br> - Basis: per 1 kg reference flow <br> - Basis kind: reference_flow <br> - Evidence kind: reasoned_estimate"
      evidence: "Node collection protocol, original records and individual identity, quantity, range and destination evidence"
    - id: collect_pick_service
      applies_to: "wild_pick; Inputs; Product flows"
      requirement: "Identify each actual physically or chemically specific exchange within this collection scope and add an independent inventory card; this collection scope is not a flow. Establish substance/species, state, flow type, property, native unit, quantity, evidence, normalization, destination and UUID separately for each card. Do not copy an aggregate quantity, common upper bound or UUID onto its members. Determine final direction and product/waste/elementary type from each actual source and fate; the collection scope does not assign a universal exchange type. Collection scope: Actual complete harvest services. Record only actual provider-defined services. Enumerate shared-trip consumers and precisely exclude covered components. <br> Quantity calculation requirement: Each cp_pick service instance retains measured native quantity, provider coverage and attributable share; normalize by A under ledger_normalization. <br> - Flow property / unit: Provider native service property / provider native service unit <br> - Amount rule: Record the actual node-owned quantity in its declared native unit per 1 kg reference flow; the quantity calculation requirement above and section 8 govern measurement, attribution and calculation evidence. <br> - Value mode: foreground_record <br> - Specificity: route_specific <br> - Normalization basis: per 1 kg reference flow <br> - Basis kind: reference_flow <br> - Evidence kind: collected_record <br> - Collection protocol: cp_pick <br> - Sources: dulse-ledger-method <br> - Range: Provisional service uncertainty in each declared native unit; U requires independent evidence <br> - Range role: uncertainty_range <br> - Lower: 0 <br> - Upper: U <br> - Unit: provider native service unit <br> - Basis: per 1 kg reference flow <br> - Basis kind: reference_flow <br> - Evidence kind: reasoned_estimate"
      evidence: "Node collection protocol, original records and individual identity, quantity, range and destination evidence"
