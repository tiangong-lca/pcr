system_boundary:
  rules:
    - rule_id: wild_start
      applies_to: "capture"
      rule: "Start with actual wild marine removal, not a purchased/farmed seed or invented zero-burden same-category supply. Record capture area/time, species and gear; natural stock growth is not a foreground growout activity."
      source_ids:
        - noaa-caribbean-spiny-lobster
    - rule_id: gate_complete
      applies_to: "all nodes"
      rule: "End each animal chain at first evidenced producer physical acceptance, onshore/offshore stated. Include necessary producer outbound/return travel, idle, cleaning, maintenance and replacements through complete attributable trip/asset/service periods even if performed after an offshore animal handover. Exclude buyer distribution and later buyer holding/processing. Declare any cut-off quantitatively rather than erasing return burdens."
      source_ids: []
    - rule_id: events_states
      applies_to: "all nodes"
      rule: "The process list indexes responsibilities, not mandatory chronology. Use actual event ids, node/pass, time, state, life status, owner and paired transfers. Optional nodes may bypass or recur; grading can precede/follow holding or presentation, but every physical event has one owner. Incoming live-only nodes reject dead state. Unaccepted pre-gate animals remain at the actual event owner as retained stock or an evidenced alternative accepted output, release or waste; they are not an assumed upstream rework loop. Any upstream rework/return route requires separate scope and module review. Accepted buyer returns are outside scope. Never force internal animal feed to1 kg or duplicate the same animal as reference and another fate."
      source_ids: []
    - rule_id: technology_delta
      applies_to: "capture"
      rule: "Capture is the parent. Trap events require actual trap/line/buoy deployment, retrieval, bait/attractant and lost/retired-gear records; diver events require actual dive equipment/gas/compressor or contracted dive-service evidence; bullynet events require actual shallow-water net/lighting event evidence. These are qualitative requirement categories, not mandatory resource quantities. At each event choose actual technology; mixed trips may coexist only with disjoint event/effort and uniquely owned shared vessel burden. Do not model all alternatives as simultaneous default burdens."
      source_ids:
        - noaa-caribbean-spiny-lobster
    - rule_id: bait_lifecycle
      applies_to: "capture"
      rule: "Maintain a separate animal attractant ledger by species/state/lot: opening live stocks plus actual external purchases, wild designation and inter-node/period receipts reconcile with closing live stocks, actual live transfers, release, death/material fate and verified losses. Same-node reuse is an event, not new purchase or extra biomass. Separate live attractants from consumed material bait, native/carrier water and food reference animals. When a target animal is designated attractant it cannot also be food output at that event. Any later food handoff needs actual state/use acceptance, full carried burden and unique fate. No local bait practice establishes universal legality or a fixed mortality."
      source_ids:
        - noaa-caribbean-spiny-lobster
    - rule_id: water_materials
      applies_to: "all nodes"
      rule: "Supplied materials, environmental abstraction, internal circulation, carried water and actual receiving destinations remain distinct. Animal body water is part of net animal mass; detachable water/package is not. Record uptake, exudate, fragments, molt or other actual stock/loss terms with evidence; short holding does not justify assuming exact constant wet mass or managed growth. No compulsory washing/conditioning node is inferred; an independent material-changing operation requires scope review before use."
      source_ids: []
    - rule_id: service_period
      applies_to: "all nodes"
      rule: "Identify shared vessel, tanks, pumps, diver equipment, lighting, scales and containers as actually used, their consuming nodes/events and complete periods. Keep acquisition, operation, cleaning, maintenance, replacement and retirement evidence; no default lifespan. Opening/closing animals, bait, packages and carried burdens bridge periods. A zero-reference-output period retains its actual output/waste/service ledger and supported carry-forward/other-product treatment; never divide by zero or discard its burdens."
      source_ids: []
    - rule_id: two_views
      applies_to: "all inventory rows"
      rule: "First retain unallocated physical receipts, events, products, losses, waste and stock with uncertainty; match transfers once and normalize reconciled node-assigned amounts by positive final accepted net kg. This physical view is not co-product allocation. Only then attach the separate once-only LCA attribution view described in section 7. Physical biomass balance is never closed with economic shares or by clipping unknown values."
      source_ids: []
