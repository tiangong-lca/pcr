validation_rules:
  - rule_id: identity_gate
    applies_to: "live_argus_handover"
    rule: "Require Panulirus argus, wild origin, alive/whole/native-shell condition, food destination, first producer acceptance evidence and positive net kg. Reject other taxa, growout/fattening, ornamental, tails/meat, dead reference, freezing/cooking/thawing and later buyer gate. All required qualifiers must be declared."
    source_ids:
      - un-cpc3-aquatic-2025
  - rule_id: event_reconciliation
    applies_to: "all nodes"
    rule: "Check real chronology and each node/pass receipt-output-loss-stock balance by material/species and wet/other basis with uncertainty. Pair transfers once, validate live-only receipt conditions, unique external fates and physically measured reference. Changes of grade do not create mass; missing uptake/loss terms remain gaps, never forced exact closure."
    source_ids: []
  - rule_id: technology_events
    applies_to: "capture"
    rule: "Check actual trap/diver/bullynet parent implementation and the corresponding current deployment, equipment/service, effort, bait, lighting and fate evidence. Mixed events require disjoint ownership. No stack of all gear defaults; no borrowed universal legality, stock claim, mortality or performance."
    source_ids:
      - noaa-caribbean-spiny-lobster
  - rule_id: attractant_balance
    applies_to: "capture"
    rule: "Reconcile separate live bait stocks, actual purchases/designation, internal transfers, reuse, releases and death/material fates. Same-node loops are not exchanges; food reference and attractants cannot double own one animal. Scope exclusions do not erase attributable live-attractant burden."
    source_ids:
      - noaa-caribbean-spiny-lobster
  - rule_id: two_view_attribution
    applies_to: "all nodes"
    rule: "Require the unallocated physical ledger and separately labelled once-only LCA view; inspect every intended output handoff, allocation precedence, shared consumer fractions, service completeness, stock carry and zero-output periods. Never use attribution to repair physical balance or repeat common burden downstream."
    source_ids: []
  - rule_id: range_independence
    applies_to: "all inventory rows"
    rule: "Each non-reference 0..U is only an unresolved evidence-envelope slot in the stated numerator unit per 1 kg reference. Instantiate independent row/identity/state/pass-specific U from a reviewed distinct campaign, design capacity or supplier evidence with scope and uncertainty before QA use. Do not use the target batch maximum to validate itself, claim a universal physical limit, default unknown to zero or clip outliers. 1..1 on reference is arithmetic normalization, not yield or measured survival."
    source_ids: []
  - rule_id: identity_projection
    applies_to: "all inventory rows"
    rule: "Resolve each actual concrete exchange identity, geography/provider, property/unit and compartment with evidence before dataset release; expand collection obligations in Section 8 without a fake fixed UUID. Keep bilingual cards, rules, protocols and projection aligned. A methodology check does not verify actual data, legal compliance, UUIDs or safety."
    source_ids: []
  - rule_id: validate_inventory_completion
    applies_to: "all concrete exchanges and section 8 completion obligations"
    rule: "Verify each applicable dq_complete obligation has separately measured and identity-verified exchange cards. Check each quantity, native unit, range evidence, normalization, receiving medium, destination and non-duplication. Any unfulfilled actual child exchange, quantity, identity or destination makes the final dataset incomplete and fails validation; unknown cannot be zero. Static PCR checking does not replace this evidence."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground data package"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Evidence-complete wild live whole Panulirus argus first-producer-gate modelling with declared capture technology, event topology, complete service periods and explicit once-only attribution."
  excluded_use: "Other species/routes outside declared scope, farmed/fattened, ornamental, dead/processed reference, later buyer gate, legal/welfare/safety certification or universal yield/survival factors."
  required_metadata: "All reference qualifiers, actual location/time/node/pass/state, collection protocol, complete boundary and service periods, stocks/fates, upstream links, native quantities, physical and LCA views, source/identity evidence."
  required_quality_disclosure: "Uncertainty and missing evidence, provisional envelope status, actual scope limitations, completeness and nonduplication checks; no pass implies empirical data or publication readiness."
  update_trigger: "Change to species/state/gate, independent operation or capture delta, supplier/native property, stock/service/attribution boundary, evidence or accepted recipient/use."
