  calculation_rules:
    - id: physical_normalization
      applies_to: "all inventory rows"
      rule: "First reconcile the unallocated real event and stock quantities; assign shared service quantities once to node/period; divide each reconciled numerator by positive final accepted net animal kg for the same attributable lot/period. Final output divided by itself is 1. Keep the separate LCA attribution result labelled and never use it to close physical mass."
      inputs:
        - "actual node protocols"
        - "final handover net weighing"
      output: "Unallocated native-unit quantity per 1 kg reference; separately labelled LCA attribution"
      source_ids:
        - net-mass-normalization-identity
    - id: stock_fate_reconcile
      applies_to: "all nodes"
      rule: "Use opening stock plus actual receipts and evidenced uptake, against actual outgoing transfers/products/releases/waste/loss and closing stock, separately by species/material and wet basis with uncertainty. Internal circulation is not new supply; retain body-water changes and observed fragments. Bait has a parallel live/consumed-stock ledger, not an assumed consumption fraction."
      inputs:
        - "actual node protocols"
        - "paired transfers"
        - "stock/fate evidence"
      output: "Physical reconciliation and explicit gaps, not forced exact closure"
      source_ids: []
    - id: shared_then_product
      applies_to: "all nodes"
      rule: "First attribute complete shared asset/service use to documented consumers/periods by supported causal driver; then subdivide dedicated product burdens and allocate remaining common burdens once using section 7 precedence. Retain stock-carried burden and disclose uncertain prices or physical relationships. Protect earlier externally exited shares; permit a genuinely new separation of the remaining carried pool under section 7, without duplicating any previous split."
      inputs:
        - "consumer/service/period ledger"
        - "accepted external product evidence"
      output: "Separate once-only LCA view linked to unallocated ledger"
      source_ids: []
