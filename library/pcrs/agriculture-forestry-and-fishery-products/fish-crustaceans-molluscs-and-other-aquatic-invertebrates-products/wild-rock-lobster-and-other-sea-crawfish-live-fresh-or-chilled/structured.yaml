    - id: dq_representative
      applies_to: "all nodes"
      requirement: "Use current site/gear/season-specific primary records and complete trip/service periods; disclose sample selection, missing events, source geography/time limitations and uncertainty, not generic performance claims."
      evidence: "Dated logs, receipts, calibration and scoped supplier data"
    - id: dq_facts
      applies_to: "all nodes"
      requirement: "Class notes constrain classification only; NOAA qualitative examples do not transfer local rules/numbers globally; live-grading study abstract supports interface only, not universal mortality prediction, survival or food-safety certification."
      evidence: "Explicit source-use limitations and actual acceptance/use records"
    - id: dq_range_identity
      applies_to: "all inventory rows"
      requirement: "Retain independent row/identity/state/pass U evidence and native unit support; symbolic U is unresolved quantitative coverage, not observed guidance or default quantity. No near-match UUID may broaden real scope."
      evidence: "Independent scoped campaign/design/supplier envelope; detail/support confirmation per concrete identity"
