allocation_rules:
  - rule_id: physical_first
    applies_to: "all nodes"
    rule: "Retain all unallocated physical outputs by actual node/pass and destination, including every target grade, incidental species, live attractant, non-reference accepted animal/material product, release, waste and retained stock. No lost/dead/rejected quantity disappears or becomes a co-product automatically. Internal transfers/stock are not sales; later separated products retain their evidenced share of the common upstream burden carried by their actual material stream; absent product-specific activities are not invented."
    source_ids: []
  - rule_id: shared_node_event
    applies_to: "all nodes"
    rule: "Assign directly metered events first; split complete common service/asset burden using documented causal activity such as engine time, measured pump load or occupancy appropriate to the asset, and enumerate consumers/periods with fractions summing to one. A claim of equal shares needs evidence; no universal proxy or life is supplied. This node/time ownership precedes and differs from cross-product LCA allocation. Inclusive supplier services and their component resources are mutually exclusive for the same boundary."
    source_ids: []
  - rule_id: coproduct_once
    applies_to: "capture; grading; holding; presentation; handover"
    rule: "For every genuinely accepted external intended output at its real handoff, first subdivide separately measured product-specific activities. For the remaining inseparable common burdens use a documented causal physical relationship if supported. Otherwise declare economic attribution using comparable actual gate revenues over the same representative service period, product set and currency; disclose price basis, uncertainty and physical-allocation sensitivity. If neither causal nor comparable price evidence exists, keep attribution unresolved, not an invented factor. Protect shares of products that have already left at an evidenced external handover; do not reopen those shares. If the remaining internal stream later separates into a newly accepted intended product and the continuing reference stream, split only its remaining carried upstream burden pool plus genuinely shared subsequent burdens once at that new separation, using the stated attribution precedence. Later product recognition does not make common capture burdens zero. Dedicated later burdens remain with their actual recipient; do not apply the same split again merely because the gate or grade changes. No avoided-burden credit is assumed."
    source_ids: []
  - rule_id: period_bridge
    applies_to: "all nodes"
    rule: "Link lot/trip, season/reporting period and actual asset service phases. Record opening and closing quantity plus attributable burden so held animals/attractants/packages do not erase or receive repeated burden across periods. Separate manufacture/repair/retirement once and disclose remaining service and termination treatment. Zero-output periods use the supported stock/other-output ledger rather than an artificial positive denominator."
    source_ids: []
