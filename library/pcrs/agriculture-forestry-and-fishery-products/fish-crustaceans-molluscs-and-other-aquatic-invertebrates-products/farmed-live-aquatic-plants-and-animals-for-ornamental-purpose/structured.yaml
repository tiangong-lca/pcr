      raw_fields: "cohort; broodstock supplier/ancestry; opening/closing stock; count; animal wet mass; input quantities; hatching/growout events; feed/moss/water; energy; asset/runtime; returns; mortality; cleanup; service driver; uncertainty"
      collection_method: "Record actual captive cohorts/periods, calibrated stock/sample masses and counts, supplied feed/moss/water, energy metering or documented power/runtime, conditioned-water inputs, shared asset/service and waste/release evidence; reconcile opening plus arrivals and growth with departures/losses/closing stock, documenting biological mass changes"
      unit: "kg; individuals; kWh; each service/material native unit"
      frequency: "Each input/stock/transfer/event and meter interval"
      temporal_coverage: "Complete breeding/incubation/direct-hatch/growout and linked prior/future stock periods, including failed cohorts and termination"
      site_scope: "Actual culture site/tank and attributable suppliers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Primary supplier and ancestry records; calibration/tare/sample logs; cohort balance; service-life/driver evidence; sensitivity and gap register"
    - protocol_id: cp_collection
      process_id: "live_collection"
      flow_role: "All collection cards and actual instances"
      record_type: "Operation and transfer record"
      raw_fields: "collection id; culture cohort; start/end; method; CM0/T0/T1/CW1/IM1; live count/mass/state; incidental identity/mass; inputs; losses; returns; resources; uncertainty"
      collection_method: "Observe actual live physical removal; weigh/count animals independently of carrier water and incidentals, reconcile sender/receiver signed transfers and measured resource/service records; classify returned animals and recovered materials separately"
      unit: "kg; individuals; each actual instance native unit"
      frequency: "Each operation and handoff"
      temporal_coverage: "All collection operations feeding declared received lots, including failed operations"
      site_scope: "Actual culture-to-collection interface and operation"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Operation observations; paired transfer ledger; calibrated tare/sample records; losses and incidental destination evidence"
    - protocol_id: cp_sorting
      process_id: "live_sorting"
      flow_role: "All sorting cards and actual instances"
      record_type: "Grade and destination ledger"
      raw_fields: "T1/CW1/IM1; grade criteria actually used; T2H/T2B; CW2H/CW2B; count/mass/state; incidental destination; returns/waste; resources; uncertainty"
      collection_method: "Observe each incoming live/incidentals stream and every actual destination; calibrated net mass/count with same-lot sample evidence where necessary; confirm holding activation or direct bypass from both interfaces"
      unit: "kg; individuals; each actual instance native unit"
      frequency: "Each sorting lot, destination and resource event"
      temporal_coverage: "All declared lots and sorting failures"
      site_scope: "Actual sorting site/operator"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Actual grade/acceptance records; paired transfers; measurements; evidenced holding/bypass; live-reject disposition"
    - protocol_id: cp_holding
      process_id: "live_holding"
      flow_role: "All holding cards and actual instances"
      record_type: "Intervention, meter and transfer record"
      raw_fields: "activation; start/end; T2H/T3/CW2H/CW3; actual conditions; animal counts/masses/states; water; electricity; supplies/services; mortality; returns; uncertainty"
      collection_method: "Confirm bounded intervention from actual operator/time/resource records; observe live states at both interfaces and all grade/return/waste destinations, meter actual energy/water or document calibrated estimates; separately evidence bypass outside this node"
      unit: "kg; individuals; kWh; each actual instance native unit"
      frequency: "Every actual holding interval/resource and handoff"
      temporal_coverage: "All activated intervals including failed lots"
      site_scope: "Actual holding tanks/operator"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Time/condition logs; meter/runtime evidence; paired transfers; service exclusions; mortality and destination records"
    - protocol_id: cp_presentation
      process_id: "live_presentation"
      flow_role: "All presentation cards and actual instances"
      record_type: "Lot packaging and carrier-water record"
      raw_fields: "T3/T2B; CW3/CW2B; new water; T4/CW4/PK4; animal count/mass/state; package id/material/reuse; inputs; rejects/returns; uncertainty"
      collection_method: "Reconcile actual held or evidenced bypass animals; weigh/count live animals separately from carrier freshwater and packages; record actual materials/services, reuse/service turns, cleanup, replacement and all outgoing destinations"
      unit: "kg; individuals; each actual instance native unit"
      frequency: "Every actual lot/package, water addition and handoff"
      temporal_coverage: "Complete presentation events for declared lots including failures"
      site_scope: "Actual presentation site/operator"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Paired handoffs; calibrated tare/sample records; material purchase/issue and reusable service ledger; wastewater/destination evidence"
    - protocol_id: cp_delivery
      process_id: "recipient_delivery"
      flow_role: "All delivery cards and final reference"
      record_type: "Shipment/custody, physical receipt and net-mass records"
      raw_fields: "T4/CW4/PK4; all legs/operators/times/distance/load; actual resources; covered service components; recipient receipt; live count/state/grade; accepted net animal mass A; carrier/package/incidentals tare; sample count/mass/uncertainty; rejected/returned/dead quantities; destinations"
      collection_method: "Trace every movement/wait/maintenance through first physical recipient; confirm signed actual custody/receipt and live acceptance. Determine same-lot A with calibrated tare-controlled weighing that excludes separable carrier/free water, moss, packaging and incidentals while retaining animal body water, or representative same-lot count-and-weighed-sample records with uncertainty; preserve commercial count. Reconcile all outcomes and document all pre-receipt services/own-operated activities"
      unit: "kg; individuals; kWh; tonne-kilometre or actual native service unit; each instance native unit"
      frequency: "Every leg/custody event, maintenance input and physical receipt"
      temporal_coverage: "Dispatch through first physical receipt, including failed shipments and actual returns/service periods"
      site_scope: "All actual pre-receipt sites/operators, including recipient pickup at culture site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated tare/sample records; live physical receipt/custody evidence; route/load data; actual component coverage; waste/returns and failed-shipment reconciliation"
  calculation_rules:
    - id: normalize_lot
      applies_to: "all inventory rows"
      rule: "Attributable actual instance quantity divided by A gives its native quantity per 1 kg reference flow; A is the accepted same-lot net animal wet mass in kg. Keep every transfer's actual numerator; no internal-feed normalization to 1 kg."
      inputs:
        - "actual instance quantity"
        - "attribution share"
        - A
        - cp_delivery
      output: "Native-unit quantity per 1 kg reference flow"
      source_ids:
        - mass-balance-identity
    - id: final_reference
      applies_to: "accepted_live_shrimp"
      rule: "Accepted output normalization is A/A = 1 kg for the same accepted live lot with A greater than zero; the card's finite expression is 1 kg. This is a calculation from receipt records, not a fixed empirical yield."
      inputs:
        - A
        - cp_delivery
      output: "1 kg accepted net live animal mass"
      source_ids:
        - mass-balance-identity
    - id: sample_mass
      applies_to: "all animal rows"
      rule: "A recorded count multiplied by representative same-lot sampled mean net live animal mass estimates that lot's mass only; retain sampling design, weighed sample/count, live condition/grade representation, tare/drain method and propagated uncertainty. No species-wide conversion is supplied."
      inputs:
        - "lot count"
        - "sample animal mass"
        - "sample count"
        - "sampling uncertainty"
        - "own-node protocol"
      output: "Estimated same-lot animal mass with uncertainty"
      source_ids: []
    - id: stock_service
      applies_to: "managed_biology"
      rule: "Reconcile carried opening burden plus new attributable breeding service against current offspring, intended alternate products, actual losses and carried closing/future service. Biological growth is not a purchase; future service is a ledger commitment rather than hypothetical animal output."
      inputs:
        - "cohort/period stock and events"
        - "service pool"
        - "causal driver"
        - sensitivity
      output: "Reconciled current and carried stock/service shares"
      source_ids: []
    - id: instance_range
      applies_to: "all non-reference cards"
      rule: "Establish U_<row-instance> in the actual native unit from independently reviewed observations, limits and sensitivity. Until established, 0..U is symbolic reasoned uncertainty only; a missing bound or conditional state blocks a final inventory value, not a default zero."
      inputs:
        - "actual instance unit"
        - observations
        - "uncertainty evidence"
        - sensitivity
      output: "Supported per-instance uncertainty bounds"
      source_ids: []
  data_quality_requirements:
    - id: dq_scope
      applies_to: "reference lot"
      requirement: "Demonstrate species, captive origin, selected moss route, whole live never-frozen ornamental acceptance and first physical recipient; experimental source cannot substitute for application delivery evidence"
      evidence: "Supplier/cohort and physical receipt records"
    - id: dq_transfers
      applies_to: "all nodes"
      requirement: "Paired animal/water/incidental/package and return transfers agree in id, owner, quantity, native unit/state; all intended outputs, waste and closing stock are complete"
      evidence: "Sender/receiver ledgers and balances with uncertainty"
    - id: dq_periods
      applies_to: "all cohorts and assets"
      requirement: "Include failed batches, opening/closing stocks, cleaning/changeover/replacement/termination, future breeding service and all shared consumers; justify life/use drivers and sensitivity"
      evidence: "Period and service ledgers"
    - id: dq_bounds
      applies_to: "all cards"
      requirement: "Symbolic bounds and unknown conditional states are unresolved data needs, never measured ranges, universal caps or default zeros; retain quantity/identity gaps"
      evidence: "Primary records, supported uncertainty and gap register"
    - id: dq_services
      applies_to: "all services"
      requirement: "Match complete-service coverage to actual energy/assets/materials/releases and retain only uncovered components; each power-times-runtime or emissions calculation declares actual-instance formula/factor, measured components and calculated_value/calculated_from_collection metadata"
      evidence: "Service boundary and component ledger"
    - id: dq_identity
      applies_to: "all actual exchanges"
      requirement: "Verify concrete flow/property/unit support for each final exchange; retain conditional umbrella until observed instances exist; reference identity gap precludes publication"
      evidence: "Compatible identity detail evidence and dataset records"
    - id: dq_emissions
      applies_to: "water/waste/emissions"
      requirement: "Distinguish supplied versus abstracted water, internal/recovered carrier, treatment versus direct return, individual substances/medium and carbon provenance; no generic pollutants or duplicated service releases"
      evidence: "Measurements or explicit reviewed factor/source, destination and chemical/element basis"
    - id: dq_translation
      applies_to: "bilingual PCR"
      requirement: "Preserve every row/protocol/rule id, quantity/range/native-unit, actual condition and source meaning across both renderings"
      evidence: "Per-card/manual parity audit"
