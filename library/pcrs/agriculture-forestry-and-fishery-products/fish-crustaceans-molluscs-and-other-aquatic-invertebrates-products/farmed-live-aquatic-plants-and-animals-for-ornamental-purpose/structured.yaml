      name: "Actual instance property"
      uuid: ""
    required_unit: "Native unit"
    rule: "Retain electricity as energy, transport as its service unit, gases/materials as their verified property and unit; never convert services or electricity into kg. Water is recorded in kg here; volume measurements require recorded same-condition density and conversion evidence."
