allocation_rules:
  - rule_id: al_subdivide
    applies_to: "all_nodes"
    rule: "Prefer separately measured cohorts, grades, operations and service instances. Each animal or material has one transfer identity and burden owner; output at an internal handoff is not also a final independently sold output. No substitution or environmental credit is supplied."
    source_ids: []
  - rule_id: al_broodstock
    applies_to: "managed_biology"
    rule: "Attribute received breeding stock, ancestry/opening burdens and adult maintenance across their actual reproductive service and intended outputs. Preserve service already consumed by current offspring, remaining service carried to future cohorts, replacement/death/termination and closing stock. Use evidenced breeder occupancy/biomass-time and reproductive-service records with a documented causal rationale; if no defensible causal driver exists, disclose the gap and test alternative time, biomass and output-value drivers rather than claiming completed attribution. Do not charge all current offspring while also carrying the same burden forward."
    source_ids: []
  - rule_id: al_cohorts
    applies_to: "managed_biology"
    rule: "Trace actual incubation/direct-hatch/growout cohorts and overlapping tanks/periods. Allocate shared operating burdens by measured equipment use, occupied tank-time or another documented causal service driver; separate directly attributable feed/water first. Include unsuccessful/no-output cohorts, mortality, replacements, cleaning and changeover in their responsible service pool, rather than dropping them or dividing a failed period by zero. Carry to linked viable outputs or disclose unresolved allocation."
    source_ids: []
  - rule_id: al_outputs
    applies_to: "all_intended_outputs"
    rule: "Enumerate every reference grade, alternate ornamental grade, transferred breeding/juvenile product, usable incidental and actual return/closing stock. After subdivision, use demonstrated causal biological/service drivers when possible. Where joint output burdens cannot be causally separated, document economic shares from comparable nonnegative producer-gate net-sales values, including declared retained-stock values, with price period/source and a strictly positive denominator. Zero, negative or unavailable values require a justified alternative driver and sensitivity; do not use profit ratios. Test mass and service-driver alternatives. Count is supplementary and not an unqualified equivalent for animals of different size. No hierarchy shortcut makes downgraded products waste."
    source_ids: []
  - rule_id: al_shared
    applies_to: "assets_and_services"
    rule: "Maintain one service ledger for culture tanks, aeration/heating/light equipment, facility, collection/sorting/holding equipment, containers and each actual shared service; enumerate consuming nodes/cohorts/periods. Attribute installed/replaced/maintained assets over evidenced service life and actual use/capacity, using observed runtime/occupancy or physically justified driver. Include idle/failure/cleanup/termination shares and sensitivity to utilization and life; unsupported standard lifetimes or free infrastructure are prohibited. Shares plus carried service must reconcile to one pool."
    source_ids: []
  - rule_id: al_packaging
    applies_to: "presentation_and_delivery"
    rule: "Single-use materials receive actual attributable production and treatment burdens. Reusable containers require actual service turns, cleaning/repair/replacement, losses, return movements and end-of-use evidence with a consistent service denominator and sensitivity; no unlimited reuse or omitted return logistics. Presentation owns package introduction; downstream movements do not repurchase it."
    source_ids: []
  - rule_id: al_delivery
    applies_to: "recipient_delivery"
    rule: "Attribute actual pre-receipt legs using documented shipment composition, carrier water/package gross load, distance, capacity, empty/return movements and relevant service driver. Retain animal net mass for reference normalization. Complete transport or holding services replace covered components explicitly; uncovered components remain. All failed shipments and other destinations retain burdens. No payer or invoice boundary truncates transport."
    source_ids: []
