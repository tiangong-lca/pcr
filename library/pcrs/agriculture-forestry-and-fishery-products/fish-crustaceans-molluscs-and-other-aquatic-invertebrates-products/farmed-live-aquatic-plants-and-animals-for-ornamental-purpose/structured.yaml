validation_rules:
  - rule_id: vr_reference
    applies_to: "accepted_live_shrimp"
    rule: "Verify same-lot positive A, live receipt and exact net wet-animal basis, reference name/link/support, separate water/moss/package/incidentals and actual counts/grades; final A/A gives 1 kg only for accepted live output."
    source_ids:
      - mass-balance-identity
  - rule_id: vr_route
    applies_to: "all_nodes"
    rule: "Verify complete managed-biology/collection/sorting/presentation/delivery records and actual holding activation or evidenced bypass; no planktonic phase, sacrifice/freezing or chapter 5 alternative trial is substituted into this live route."
    source_ids:
      - sganga-red-cherry-2019
  - rule_id: vr_handoffs
    applies_to: "all_transfers"
    rule: "Require paired CM0/T0/T1/T2H/T2B/T3/T4, CW1/CW2H/CW2B/CW3/CW4, IM1/PK4 and every R/RW instance as applicable, with exact state/unit/quantity/custody and no double reference output or unrecorded destination."
    source_ids: []
  - rule_id: vr_outputs
    applies_to: "all_intended_outputs"
    rule: "Enumerate every actual live grade/recipient, breeding/juvenile alternate, usable incidental, return and retained stock, separately from mortality/residue/waste; output rejection alone does not justify waste classification."
    source_ids: []
  - rule_id: vr_attribution
    applies_to: "all_periods_and_consumers"
    rule: "Reconcile broodstock/opening/future service, overlapping cohorts, failed/no-output events, shared assets/services, cleanup/replacement/termination and reusable containers; causal/economic choices need evidence and sensitivity, one burden owner and no double carried/current allocation."
    source_ids: []
  - rule_id: vr_delivery
    applies_to: "pre_receipt"
    rule: "Prove first physical receipt and include every preceding movement/wait/maintenance regardless payer, including failed shipments; service coverage excludes duplicate components but not uncovered activities."
    source_ids: []
  - rule_id: vr_instances
    applies_to: "all_card_instances"
    rule: "Every instance needs observed activation/absence, independent native property/unit, own-node protocol, identity/destination and attributable amount/uncertainty. U_<row-instance> and unknown actual state remain evidence gaps; no service kg coercion or search-top-hit binding."
    source_ids: []
  - rule_id: vr_environment
    applies_to: "actual_releases_and_wastes"
    rule: "Require individual pollutant chemical/carbon/medium basis, water-return separation, treatment destination and service exclusions; no unverified discharge, factor or environmental credit."
    source_ids: []
  - rule_id: vr_integrity
    applies_to: "PCR_and_dataset"
    rule: "Require current schema-valid deterministic projection, bilingual parity and selected-target checks; state performed/skipped checks and unresolved identities/ranges distinctly. Checker pass does not prove external identity verification, commercial completeness or publication readiness."
    source_ids: []
  - rule_id: validate_atomic_completion
    applies_to: "all applicable per-flow collection obligations and final exchanges"
    rule: "Final dataset completion and validation require every actual exchange to have an independent atomic card and its own quantity, property/native unit, collection or calculation evidence, range/uncertainty evidence, normalization, actual destination and verified UUID. Unknown identity, activity state, quantity, range evidence or fate blocks completion; it is never zero, a presumed bypass or permission to omit an obligation. Every important concrete flow retains its own range/uncertainty evidence collection duty; a symbolic upper bound is not an empirical range."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground data package with process/lifecyclemodel projections; secondary_dataset or background_dataset only after completed evidence/identity/quality review"
  downstream_use: "Foreground ornamental shrimp data package and subsequent process/lifecyclemodel projections through the declared first physical receipt gate"
  allowed_use: "Matching captive-bred Neocaridina davidi moss-route whole-live ornamental supply, with actual site/period, compatible upstream boundary and quality disclosure"
  excluded_use: "Wild collection; fish or other species; food/frozen/dead products; chapter 5 alternative experimental trials; laboratory sacrifice; post-receipt use; extrapolated commercial scale or health/safety/welfare/legal guarantees"
  required_metadata: "Species/origin/supplier/ancestry; actual route/site/cohorts/periods; starting stock; full node activation and transfer/state/quantity records; receiver receipt; water/package exclusion and counts; upstream coverage; burden ownership and service/component boundary; allocation choices/sensitivity; identity and uncertainty"
  required_quality_disclosure: "Evidence coverage and gaps; measured/sample-estimated net animal mass; unestablished ranges; failed/open/closing stock; breeding/future service; infrastructure life/utilization/reuse; complete-service exclusions; all pre-receipt logistics; unresolved identity/support and non-publication readiness where applicable"
  update_trigger: "Changed species/origin/route/market state/receipt gate; changed water/feed/moss/equipment or holding/presentation/logistics; improved primary/identity/range evidence; changed service life/reuse/allocation; newly established actual intended outputs"
data_sources:
  - id: "sganga-red-cherry-2019"
    type: "literature"
    reference: "Daniela Eliana Sganga, 2019, Universidad de Buenos Aires, Modeladores de la calidad de progenie en un crustáceo de interés económico, el camarón ornamental red cherry Neocaridina davidi. https://bibliotecadigital.exactas.uba.ar/download/tesis/tesis_n6688_Sganga.pdf ; general methods printed pp.19–21; breeding/offspring printed pp.47–49"
    used_for: "Qualitative captive breeding/direct-hatching/juvenile growth route, dechlorinated water/plastic aquaria/aeration/heaters/light/Java moss/TetraColor evidence; experimental scope only, no inventory defaults or commercial receipt proof; chapter 5 variants and laboratory sampling excluded"
  - id: "un-cpc-3-2025"
    type: "official_guidance"
    reference: "United Nations, CPC Version 3.0 explanatory notes, 2025, printed pp.53–54. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "04913 farmed live ornamental aquatic plants/animals scope and exclusions; narrower crustacean mapping context"
  - id: "mass-balance-identity"
    type: "method_factor"
    reference: "Same-lot accounting identity: accepted net animal mass A divided by that same accepted mass A equals 1; measured exchanges divided by A retain their native numerator unit per kg reference"
    used_for: "Exact final reference normalization and transfer/quantity accounting; no empirical yield, environmental factor or default conversion"
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:162482179ecf1b1ad6730f2d550c61c287179889f245bec5a228a8730642f5e4"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_6473"
      family: "system_boundary"
      span:
        start:
          offset: 6473
          line: 53
          column: 1
        end:
          offset: 10681
          line: 75
          column: 1
      markdown: "## 5. System Boundary\n### Boundary Abstraction\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Received broodstock and their supplied ancestry burden, attributable opening captive stock, supplied freshwater plus independently recorded actual dechlorination inputs/operations, feed/Java moss/materials and shared assets at the actual culture site |\n| starting_condition_role | Disclosed foreground entry of managed breeding stock and inputs, not a zero-burden biological origin |\n| product_classification_scope | Captive-bred live ornamental crustacean subset of cpc:3.0:04913 |\n| recursive_input_rule | Same-category received/returned/retained animals retain cohort, quantity and inherited burden. Declare the upstream stopping boundary; never recurse indefinitely or reset broodstock/opening stock to zero. Internal stock transfers are not new purchases. |\n| upstream_dataset_requirement | Require compatible supplied-stock, feed, water treatment, electricity, material, infrastructure and service datasets with boundary/quality disclosure; record unresolved upstream gaps instead of excluding burdens |\n| disclosure | Site, supplier/ancestry and opening inventory, actual cohort/periods, all node activations, animal and water transfers, attribution drivers, assets/lifetimes/replacement/cleaning, pre-receipt service coverage, physical recipient gate, gaps and sensitivity |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| `sb_managed` | managed_biology | Breeding/incubation/direct hatching/growout are managed biological production, indexed by actual cohort and tank-period. Received stock, feed, moss as substrate/partial food, water conditioning and energy are management inputs with distinct roles. No unmeasured biofilm/moss consumption is invented as manufactured feed. | sganga-red-cherry-2019 |\n| `sb_collection` | live_collection | Live physical removal from the culture context has its own operation/times/equipment and handoff T1, independently of growth. Record co-collected water/moss/incidentals entering sorting and every animal loss/return. Laboratory sacrifice is excluded. | sganga-red-cherry-2019 |\n| `sb_sort` | live_sorting | Sorting receives unsorted live animals plus actual incidental matter; identify every accepted grade, alternate live destination, returned/retained animal and dead/waste output, with exact handoff and independent acceptance evidence. Do not classify lower grade or rejected-for-one-buyer animals as waste automatically. | |\n| `sb_hold` | live_holding | Activate only an evidenced bounded live-maintenance intervention after sorting, with start/end, actual conditions/resources and outgoing live state T3. Otherwise document direct bypass T2B into presentation. Unknown holding state is an evidence gap, not bypass. No survival or duration guarantee follows. | |\n| `sb_presentation` | live_presentation | Enclose/protect actual live animals using documented carrier freshwater and packaging/reusable containers; retain animal and carrier/package identities separately. T4 is the outgoing live presentation state. Distribution belongs to delivery, not presentation. | |\n| `sb_delivery` | recipient_delivery | Include every actual movement, waiting/transfer and live-maintenance event before first physical ornamental recipient custody, whatever payer/operator/invoice boundary. End only at documented physical receipt; include pre-receipt mortality/returns/rejections and package/water disposition. | |\n| `sb_events` | all_nodes | Include actual failed/no-output cohorts, cleaning, changeover, replacements, termination, usable alternate products, recovered materials and wastes. Assets/aeration/heating/light shared by nodes or periods have one owner and a disclosed service boundary. No universal lifetime or free reusable container is assumed. | |\n| `sb_environment` | actual_exchanges | Apply collection obligations by adding one independent card per actual exchange only after observations. Separate treatment waste from direct environmental water return and individual pollutants; no unsupported environmental credit. Complete service datasets exclude duplicate component energy, assets, fuel and releases. | |\n\n"
