system_boundary:
  rules:
    - rule_id: sb_managed
      applies_to: "managed_biology"
      rule: "Breeding/incubation/direct hatching/growout are managed biological production, indexed by actual cohort and tank-period. Received stock, feed, moss as substrate/partial food, water conditioning and energy are management inputs with distinct roles. No unmeasured biofilm/moss consumption is invented as manufactured feed."
      source_ids:
        - sganga-red-cherry-2019
    - rule_id: sb_collection
      applies_to: "live_collection"
      rule: "Live physical removal from the culture context has its own operation/times/equipment and handoff T1, independently of growth. Record co-collected water/moss/incidentals entering sorting and every animal loss/return. Laboratory sacrifice is excluded."
      source_ids:
        - sganga-red-cherry-2019
    - rule_id: sb_sort
      applies_to: "live_sorting"
      rule: "Sorting receives unsorted live animals plus actual incidental matter; identify every accepted grade, alternate live destination, returned/retained animal and dead/waste output, with exact handoff and independent acceptance evidence. Do not classify lower grade or rejected-for-one-buyer animals as waste automatically."
      source_ids: []
    - rule_id: sb_hold
      applies_to: "live_holding"
      rule: "Activate only an evidenced bounded live-maintenance intervention after sorting, with start/end, actual conditions/resources and outgoing live state T3. Otherwise document direct bypass T2B into presentation. Unknown holding state is an evidence gap, not bypass. No survival or duration guarantee follows."
      source_ids: []
    - rule_id: sb_presentation
      applies_to: "live_presentation"
      rule: "Enclose/protect actual live animals using documented carrier freshwater and packaging/reusable containers; retain animal and carrier/package identities separately. T4 is the outgoing live presentation state. Distribution belongs to delivery, not presentation."
      source_ids: []
    - rule_id: sb_delivery
      applies_to: "recipient_delivery"
      rule: "Include every actual movement, waiting/transfer and live-maintenance event before first physical ornamental recipient custody, whatever payer/operator/invoice boundary. End only at documented physical receipt; include pre-receipt mortality/returns/rejections and package/water disposition."
      source_ids: []
    - rule_id: sb_events
      applies_to: "all_nodes"
      rule: "Include actual failed/no-output cohorts, cleaning, changeover, replacements, termination, usable alternate products, recovered materials and wastes. Assets/aeration/heating/light shared by nodes or periods have one owner and a disclosed service boundary. No universal lifetime or free reusable container is assumed."
      source_ids: []
    - rule_id: sb_environment
      applies_to: "actual_exchanges"
      rule: "Apply collection obligations by adding one independent card per actual exchange only after observations. Separate treatment waste from direct environmental water return and individual pollutants; no unsupported environmental credit. Complete service datasets exclude duplicate component energy, assets, fuel and releases."
      source_ids: []
