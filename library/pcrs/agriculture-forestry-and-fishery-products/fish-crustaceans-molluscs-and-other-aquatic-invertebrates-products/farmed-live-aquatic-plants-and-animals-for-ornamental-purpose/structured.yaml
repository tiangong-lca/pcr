    required_unit: "kg; individuals"
    rule: "Record animal mass and count independently at each handoff; sample-derived mass requires same-lot live-state and size/grade representation, tare/drain method, sample size and uncertainty. Retain commercial per-individual information; no count-to-mass constant is supplied."
