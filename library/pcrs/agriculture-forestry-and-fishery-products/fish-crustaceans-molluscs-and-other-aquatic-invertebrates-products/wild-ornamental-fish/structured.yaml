      evidence: "dispatch water-source/outlet ledger; quality/density evidence; receiving operator/medium; independent identity and quantity records"
validation_rules:
  - rule_id: validate_origin
    applies_to: "reference product"
    rule: "Require wild-capture origin, ornamental purpose, live finfish state, declared habitat/species/grade, actual collector/consolidator dispatch gate and lot acceptance. Exclude farm-grown fish, food or stocking/bait products, ornamental non-fish and preserved specimens."
    source_ids:
      - un-cpc-3-2025
  - rule_id: validate_mass
    applies_to: "all fish cards"
    rule: "Require documented humane net-biomass measurement and auxiliary counts. Exclude water, oxygen, ice and containers; counted lots require measured species/size/lot conversion evidence. Check all internal transfers against the same lot and prohibit fixed 1 kg internal inputs."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "campaign; stock; co-products"
    rule: "Reconcile caught/retained/released/dead biomass, surviving transfers, grade sales, final dispatch and opening/closing stock. Enumerate intended output handovers and residual allocation. Record unexplained differences; never truncate measurements to provisional screens."
    source_ids: []
  - rule_id: validate_resources
    applies_to: "capture; transfer; holding; dispatch"
    rule: "Demonstrate actual route-specific fuel/combustion, electricity, water, oxygen, feed, treatment, packaging and asset coverage including evidenced zero-use states. Distinguish purchased treatment from direct discharge; identify substances and media before concrete emission binding."
    source_ids: []
  - rule_id: validate_identity
    applies_to: "all concrete exchanges"
    rule: "Each implemented exchange requires a verified exact flow UUID and compatible property/unit, state, gate, provider/geography and receiving medium. A landing fish UUID does not establish a later consolidator output; generic marine identities cannot stand for freshwater. Report identity gaps and review limits."
    source_ids: []
  - rule_id: validate_period_assets
    applies_to: "reporting periods; shared assets"
    rule: "Match run/period boundaries, replacement and cleaning events, live stock carryover and delayed sales. Check all shared consumers and asset allocation keys, omitted services and duplicate loads. Unknown replacement or termination treatment blocks final data-package completion."
    source_ids: []
  - rule_id: validate_inventory_completion
    applies_to: "all concrete exchanges and section 8 obligations"
    rule: "Read back the coverage ledger and confirm every applicable dq_complete requirement has concrete separately measured and identity-verified cards. Check dimensions, normalization, receiving medium, waste fate and non-duplication. Any unfulfilled obligation or unknown identity/quantity fails final dataset validation; static PCR checking is not a substitute."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground data package first; process and lifecyclemodel are downstream projections"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Declared species/habitat/route/period live wild ornamental supply through the matching collector/first-consolidator dispatch gate, with verified concrete exchanges and disclosed upstream coverage"
  excluded_use: "Farmed or food fish; ornamental non-fish; retailer/export destination after gate; aquarium service; incompatible location/species/size/gate without explicit representativeness review"
  required_metadata: "Origin, species, habitat/salinity, gear, collection/holding/gate sites and dates, grade/count/net biomass, survival/losses, water/energy topology, campaign/stock period, allocation, assets and upstream datasets"
  required_quality_disclosure: "Measurement and sampling uncertainty, survival and balance residuals, inventory/identity/monitoring gaps, exclusions, provisional range evidence, allocation sensitivity, temporal/geographic/technology representativeness"
  update_trigger: "Changed species/grade/origin, gear or route, dispatch gate, holding/survival, water source or discharge, power mix, treatments, shared assets, stock period or material new evidence"
data_sources:
  - id: "un-cpc-3-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC Version 3.0 explanatory notes, 30 June 2025, pp. 40–41. Retrieved 2026-10-09. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Official classification boundary for wild ornamental fish and adjacent categories; not a quantity source"
  - id: "nfrdi-ornamental-industry-2019"
    type: "literature"
    reference: "Muyot et al. (2019), Status of Ornamental Fish Industry in the Philippines: Prospects for Development. The Philippine Journal of Fisheries 26(2):82–97. DOI:10.31398/tpjf/26.2.2019A0011. Retrieved 2026-10-09."
    used_for: "Qualitative evidence of distinct wild marine and captive freshwater supply chains and live ornamental trade; historical national figures do not define this category's inventory"
  - id: "fao-live-fish-handling"
    type: "handbook"
    reference: "FAO, T8389E, section 6, Transport of live fish. Retrieved 2026-10-09. https://www.fao.org/4/T8389E/T8389E06.htm"
    used_for: "Qualitative live-state stabilization, handling, water/oxygen and dispatch interface questions only; historical drugs, densities and mortality factors are not prescribed"
  - id: "reference-normalization"
    type: "method_factor"
    reference: "PCR definition: each reference lot is normalized to 1 kg accepted net live whole-fish biomass at declared dispatch"
    used_for: "Defined final output 1–1 kg and campaign normalization; no empirical yield or loss claim"
  - id: "ghg-product-standard-2011"
    type: "standard"
    reference: "WRI/WBCSD, Product Life Cycle Accounting and Reporting Standard (2011), chapter 9, pp. 63–70. Retrieved 2026-10-09. https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Method basis for subdivision, underlying physical/causal relationships and disclosed economic allocation when unavailable; no fish inventory quantity or claim of complete GHG conformance"
