allocation_rules:
  - rule_id: allocate_subdivision
    applies_to: "species; grade lots"
    rule: "Subdivide independently metered species/grade and route lots and directly assign identifiable collection, transfer, holding and packing resources before allocating shared residual burdens."
    source_ids:
      - ghg-product-standard-2011
  - rule_id: allocate_residual
    applies_to: "all intended outputs"
    rule: "Enumerate every sold species/grade, buyer purpose and handover. Use a documented causal allocation basis where supported; otherwise disclose economic allocation using contemporaneous grade/species prices, the complete output set and sensitivity. No universal mass fraction is supplied."
    source_ids:
      - ghg-product-standard-2011
  - rule_id: allocate_losses
    applies_to: "mortality; release; internal lots"
    rule: "Keep collection and preservation burdens of mortality in the output-system accounting. Dead or rejected fish are not saleable co-products without an evidenced lawful product destination; live releases are neither sales credits nor waste-treatment exchanges. Internal lots cancel across nodes."
    source_ids: []
  - rule_id: allocate_period
    applies_to: "campaigns; standing holding stock"
    rule: "Index capture trips and holding runs, including cleaning/changeover, opening and closing live stock and delayed dispatch. Assign inputs and losses to the matched campaign/period; allocate cross-period assets by documented use and replacements once without universal lifetimes."
    source_ids: []
  - rule_id: allocate_shared
    applies_to: "boats; tanks; pumps; facility"
    rule: "For shared infrastructure enumerate consumers, service periods, allocation key and underlying meter/use evidence. Apply a documented key such as metered runtime or occupation where causal, then disclose residual economic allocation if used; never include the full shared load at every node."
    source_ids: []
