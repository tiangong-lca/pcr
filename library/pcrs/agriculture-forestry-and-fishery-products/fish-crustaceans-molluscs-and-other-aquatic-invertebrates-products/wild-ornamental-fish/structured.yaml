system_boundary:
  rules:
    - rule_id: boundary_capture
      applies_to: "wild_capture"
      rule: "Start with natural wild populations and account for retained and dead removed catch by species and habitat. Natural growth is not managed farming; record releases and habitat impacts separately without asserting an unsupported depletion factor."
      source_ids:
        - un-cpc-3-2025
    - rule_id: boundary_chain
      applies_to: "all processes"
      rule: "Include collection, actual movement to the first holding/consolidation site, stabilization, grading and dispatch preparation through the declared collector or first consolidator dispatch gate. Capture removes the fish; conditioning preserves the already captured live state and does not repeat capture."
      source_ids:
        - fao-live-fish-handling
    - rule_id: boundary_suppliers
      applies_to: "purchased collector fish"
      rule: "Retain a documented upstream capture dataset or disclose an unresolved upstream burden for purchased wild fish. Record supplier starting state, species, capture location and previous losses; buying a live lot is not a burden-free stock initialization. Do not repeat supplier capture/resource withdrawal as another foreground capture; preserve the actual upstream-to-receiving-node handover."
      source_ids: []
    - rule_id: boundary_water
      applies_to: "live_conditioning; dispatch_handover"
      rule: "Distinguish actual external water supply and its measured salinity/quality, natural abstraction, internal recirculation and carrier water shipped. No industrial-treatment grade is assumed. Report treatment handover as waste; direct environmental discharge requires medium-specific returned water and substance-specific inventories. Treat actual discharge monitoring gaps as incomplete coverage."
      source_ids: []
    - rule_id: boundary_assets
      applies_to: "all processes"
      rule: "Identify included boats, nets, pumps, tanks and premises, all consuming nodes and service/reporting periods. Link replacement, cleaning and end-of-service events to periods and disclose capital cut-offs; record actual fuel combustion and any fugitive gear/material loss without double-counting a supplied service inventory."
      source_ids: []
    - rule_id: boundary_exclusions
      applies_to: "dispatch gate"
      rule: "Exclude distribution after dispatch, retail display, aquarium operation, food processing and consumer use. This inventory reference makes no equivalence claim across ornamental species, sizes or aquarium lifetime."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Natural wild fish population; or an actual purchased collector lot with upstream collection evidence"
  starting_condition_role: "Natural resource entry for own capture; documented upstream technosphere handover for purchased collector fish"
  product_classification_scope: "Wild ornamental live finfish, CPC 3.0 04111 context, not classification-created identity"
