  calculation_rules:
    - id: reference_normalization
      applies_to: "all inventory rows"
      rule: "Retain a single raw campaign ledger and positive measured accepted final live net biomass Q at the declared dispatch gate. If no accepted dispatch occurs, retain raw/carryover records and do not manufacture a per-kg dataset with a zero or assumed denominator. Report each physical fish transfer, loss and stock movement as its actual unallocated mass q/Q per 1 kg reference flow, with paired handover records and measured biological mass change. Apply the declared output allocation only to shared LCA resource/burden numerators, not to physical fish masses; divide the attributable numerator by the same Q. Preserve raw measurements, units and intermediate yields; no internal flow is fixed to 1 kg."
      inputs:
        - "campaign exchange totals"
        - "allocation record"
        - "accepted net biomass"
        - cp_dispatch
      output: "attributable exchanges per 1 kg reference flow"
      source_ids:
        - reference-normalization
    - id: stock_reconciliation
      applies_to: "all fish rows"
      rule: "Reconcile opening live stock and arriving lots with final dispatch, other sales, closing stock, mortality and documented releases by species/grade; disclose measured mass changes and unexplained differences."
      inputs:
        - cp_catch
        - cp_transfer_transfer
        - cp_transfer_holding
        - cp_stock
        - cp_losses_capture
        - cp_losses_transfer
        - cp_losses_holding
        - cp_losses_dispatch
        - cp_dispatch
      output: "species/grade balance and unresolved differences"
      source_ids: []
    - id: emission_calculation
      applies_to: "actual emitting rows"
      rule: "Use monitored emitted mass or a named externally supported factor matched to fuel, engine, substance and receiving medium; disclose source, applicability and uncertainty. Calculate waterborne substance mass only with matched discharged water and concentration/speciation records."
      inputs:
        - cp_emissions_capture
        - cp_emissions_transfer
        - cp_emissions_holding
        - cp_capture_resources
        - cp_transfer_transfer
        - cp_transfer_holding
        - cp_water_holding
        - cp_water_dispatch
      output: "each actual substance emission per 1 kg reference flow"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product and concrete flows"
      requirement: "Trace species, wild origin, habitat, state, intended use and actual gate; verify each concrete identity before downstream exchange publication."
      evidence: "origin/lot documents and identity verification"
    - id: dq_measurement
      applies_to: "all measurements"
      requirement: "Retain calibration, tare, humane method, representative conversion sample, units, density and uncertainty; no unmeasured generic fish weight."
      evidence: "scale/meter records and sampling report"
    - id: dq_completeness
      applies_to: "campaign and included services"
      requirement: "Match all nodes, loss/sales/stock destinations, water pathways, energy, actual chemicals, cleaning, packaging and included assets; disclose gaps, cut-offs, estimated emissions and background representativeness."
