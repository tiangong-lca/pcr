measurement_rules:
  - id: net_fish_mass
    applies_to: "reference product; all fish rows"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use calibrated humane tared/drained batch weighing, excluding carrier water, oxygen, ice and packaging. Retain count separately. A count-to-mass conversion needs measured representative species/size/lot mass and sampling uncertainty; no universal fish weight."
  - id: common_basis
    applies_to: "normalization denominator for all inventory rows"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "The denominator is accepted final live-fish mass; each measured or calculated numerator is attributed and reported per 1 kg reference flow, preserving actual intermediate quantities and their actual flow properties and numerator units. The final product amount is 1 kg. Do not fix upstream live lots to the reference quantity."
  - id: energy_units
    applies_to: "electricity rows"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "kWh"
    rule: "Preserve metered electrical energy in kWh; the supported energy unit group defines 1 kWh = 3.6 MJ. Fuel kg is not electricity kWh; record fuel-specific heating values only when independently evidenced."
  - id: water_material_basis
    applies_to: "water; consumables; emissions"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Keep water source and density conversion, supplied/product water versus elementary abstraction, and substance/product/active-ingredient basis explicit. Concentration without matching water mass and chemical species does not establish an emission exchange."
