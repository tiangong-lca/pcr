validation_rules:
  - rule_id: validation_scope
    applies_to: "reference product and route"
    rule: "Require all qualifiers and proof of species/area/single-vessel midwater gear, whole ungutted never-frozen chilled state and actual first physical recipient acceptance; reject out-of-scope reference states or unknown preservation/package configuration."
    source_ids:
      - noaa-atlantic-mackerel
      - seafish-pelagic-trawl
      - torry-mackerel-handling
  - rule_id: validation_balance
    applies_to: "all transfers and outputs"
    rule: "Check actual internal mass and paired handoffs; enumerate every intended grade/species/destination, rejects and wastes. Exactly one accepted_mackerel final exchange per lot; bulk bypass must not also count pack. Do not force ecological stock removal/discard mortality to equal accepted body mass."
    source_ids:
      - accepted-lot-normalization
  - rule_id: validation_ownership
    applies_to: "all nodes, services, direct releases and periods"
    rule: "Verify one owner and complete consumers/periods for each shared burden, full-service exclusions, asset replacement/lifetime, failed/idle duty and all actual combustion/leakage releases. Direct CO2 cards and other-release instances must be mutually exclusive; all release substances, receiving media and factors need evidence."
    source_ids:
      - accepted-lot-normalization
  - rule_id: validation_limits
    applies_to: "candidate identities, quantities and automated checks"
    rule: "Disclose actual native-unit instances, U bounds and allocation evidence. Final exchange/dataset claims require verified flow UUIDs and support identities and all other required evidence. A structural checker pass does not prove identity, current practices, numerical ranges or complete environmental characterization."
    source_ids:
      - accepted-lot-normalization
  - rule_id: validate_atomic_completion
    applies_to: "all applicable collection requirements and concrete inventory exchanges"
    rule: "Resolve every applicable section-8 collection requirement into individual physical/chemical exchanges with their own quantities, native units, composition/state, range basis or explicit uncertainty evidence, raw records, normalization, actual destinations/receiving media and verified compatible UUIDs. Any unresolved applicable requirement makes the final dataset incomplete and validation fails; unknown is not zero. Never copy aggregate amounts onto components or duplicate inclusive services with owned fuel/electricity/direct releases. Internal transfers are not fixed to the final 1 kg."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Foreground capture package to process/lifecyclemodel projections, then downstream supply modelling with matching gate"
  allowed_use: "Declared species/area/route/state/gate with concrete exchanges, actual quantities and reviewed allocation"
  excluded_use: "Generic pelagic fish, other gears/species, farmed, frozen/gutted reference, retail product, safety/legal or ecological-zero certification"
  required_metadata: "All required qualifiers, trips/hauls/lots/periods, transfer and output ledger, node ownership, supplier scope, asset/reuse life, allocation and verified concrete identity/supports"
  required_quality_disclosure: "Temporal/geographic/provider fit, uncertainty and factor basis, missing activities/identities/ranges, incidental ecological impacts, failed duty, allocation sensitivity and performed/skipped validation"
  update_trigger: "Species/gear/area/recipient, preservation or packaging change; supplier/energy/emission/asset method change; new foreground or impact evidence; unresolved evidence closure"
data_sources:
  - id: "noaa-atlantic-mackerel"
    type: "official_guidance"
    reference: "NOAA Fisheries, Atlantic Mackerel (Scomber scombrus), updated 2026-10-01; https://www.fisheries.noaa.gov/species/atlantic-mackerel ; retrieved 2026-10-12"
    used_for: "Species, US Northwest Atlantic fishery, midwater gear and incidental catch; not quantity factors or stock-status/safety claims"
  - id: "seafish-pelagic-trawl"
    type: "handbook"
    reference: "Seafish, Fishing gear database: Pelagic trawl; https://www.seafish.org/responsible-sourcing/fishing-gear-database/gear/pelagic-trawl/ ; retrieved 2026-10-12"
    used_for: "Single-vessel trawl mechanism and possible incidental contact/bycatch; not a route-specific amount dataset"
  - id: "torry-mackerel-handling"
    type: "official_guidance"
    reference: "J. N. Keay, MAFF Torry Research Station, Handling and Processing Mackerel, Torry Advisory Note 66 (revised), FAO archive; https://www.fao.org/4/x5938e/x5938e01.htm ; retrieved 2026-10-12"
    used_for: "Historical UK whole ungutted chilling, ice/RSW mechanisms only; not current US prevalence, fixed thresholds, safety limits or quantitative ranges"
  - id: "accepted-lot-normalization"
    type: "method_factor"
    reference: "PCR sections 4, 7 and 8; declared foreground collection, ownership and same-lot normalization method"
    used_for: "Actual-record attribution, A/A reference identity, native-unit normalization and ownership; no empirical amount or emission factor"
