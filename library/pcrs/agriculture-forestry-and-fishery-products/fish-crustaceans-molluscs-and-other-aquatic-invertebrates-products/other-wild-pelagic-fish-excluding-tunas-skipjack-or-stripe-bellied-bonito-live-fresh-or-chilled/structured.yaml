system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "capture through receipt"
      rule: "Include navigation/search/tows/hauls, whole sorting, actual chilling/holding, cleaning, conditional presentation, offload and any harvester-owned transfer before first physical acceptance. Capture is independent of natural production and preservation: it removes wild fish into collected-catch state; do not invent farm inputs or primary processing."
