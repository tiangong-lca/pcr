        - noaa-atlantic-mackerel
        - seafish-pelagic-trawl
        - torry-mackerel-handling
    - rule_id: boundary_handoffs
      applies_to: "sort/chill/pack/receipt"
      rule: "Enumerate selected product, other species, grades, sale destinations, downgraded sales, rejects and waste, with each handoff. For actual bulk RSW transfer, chilled_mackerel passes directly to receipt; packaged fish pass through pack. Unknown configuration blocks selection; no duplicate final output."
      source_ids:
        - noaa-atlantic-mackerel
        - seafish-pelagic-trawl
        - torry-mackerel-handling
    - rule_id: boundary_burdens
      applies_to: "all nodes and shared assets"
      rule: "Record one owner for every fuel, electricity, cleaning, refrigerant, vessel/gear/hold/pump/shore asset and service; enumerate consumers capture/sort/chill/pack/receipt and their active periods. A purchased complete service already containing fuel, capital and direct releases excludes those components; otherwise collect all components. Onboard generated electricity is an internal transfer when owned fuel/equipment/emissions are represented."
      source_ids:
        - accepted-lot-normalization
    - rule_id: boundary_impacts
      applies_to: "capture and all actual direct releases"
      rule: "Record bycatch/live-dead outcomes, sea discards, lost gear and incidental seabed contact; do not infer zero ecological impact. Biomass disposal carries actual upstream and treatment burdens, without automatic ecological or substitution credits. Direct water pollutants require measured/modelled substance, basis and medium; no generic discharge factor is prescribed."
      source_ids:
        - noaa-atlantic-mackerel
        - seafish-pelagic-trawl
