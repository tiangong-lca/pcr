allocation_rules:
  - rule_id: allocation_direct
    applies_to: "all output sets"
    rule: "Subdivide and directly assign haul/node/lot-specific activity first. Identify all intended species/grades/states/destinations, their split-off and physical handoff, including frozen or other nonreference products that share upstream duty; include their measured masses without treating them as the reference."
    source_ids:
      - accepted-lot-normalization
  - rule_id: allocation_trip
    applies_to: "residual inseparable trip capture burdens"
    rule: "For residual joint capture/navigation duty use relative whole retained intended-product mass at common first split-off, after excluding water/ice/tare, as the disclosed physical loading proxy. Apply the fraction before same-lot A normalization; do not allocate to discards to erase burdens. Declare why mass represents the shared duty for this trip and compare a consistent species/grade revenue allocation sensitivity; if mass is causally unsuitable, retain a review blocker and supply an evidenced trip-specific alternative rather than silently selecting it."
    source_ids:
      - accepted-lot-normalization
  - rule_id: allocation_assets
    applies_to: "shared vessel, gear, chilling and shore assets/services across nodes and periods"
    rule: "Assign observed fuel/electricity by metered consuming node or engine/pump run-hours and measured load; residual shared asset service by documented service-hours over actual useful lifetime, replacements and terminal losses. Include installation, maintenance, cleaning, idle and failed trips in the declared period pool; apportion that pool to all intended productive lots, never dividing each asset's full burden into every trip. Enumerate consuming nodes/periods and prove shares sum to the pool once; test load/time alternatives when important."
    source_ids:
      - accepted-lot-normalization
  - rule_id: allocation_losses
    applies_to: "rejects, returns, discards and package reuse"
    rule: "Saleable downgrades and other intended products retain assigned upstream burdens; wastes are not intended products. Retain rejection, mortality and discard management burdens on intended production with actual treatment/disposal, no unproven avoidance credit. Reusable package service includes manufacture, actual rotations/cleaning, losses and end-of-use under one owner, with return transport disclosed."
    source_ids:
      - accepted-lot-normalization
dataset_production:
  collection_protocols:
    - protocol_id: cp_capture
      process_id: "capture"
      flow_role: "All actual node cards and their concrete instances"
      record_type: "Weighing, activity, transfer, supplier and emissions records"
      raw_fields: "trip/haul/lot; node/event/transfer id; timestamp; reporting period; species/state/grade/destination; accepted net fish mass A link; actual exchange quantity/property/native unit; supplier/gate; asset/service scope and ownership; meter/load/run hours; full-service exclusions; substance/medium and measured/modelled releases with factor source; rejected/discarded live-dead biomass; uncertainty and upper-bound evidence; stock/area; gear/doors; departure, search, tow/retrieval time and unsuccessful trips; tank start/end/deliveries; observer/bycatch/contact evidence; vessel/gear replacement and lifetime"
      collection_method: "Reconcile calibrated weighing/meters, logs, delivery invoices, transfer and acceptance records; retain actual instance composition/provider, actual absence, activity allocation and emissions method. Treat all units separately; no automatic factor or amount defaults. Attribute owned amounts to the same accepted lot and divide by positive accepted net fish mass A; final accepted fish output is A/A; preserve each instance unit."
      unit: "kg fish; each actual native unit separately"
      frequency: "Every haul/lot/event; meter intervals and asset/service updates"
      temporal_coverage: "All trips and holding/cleaning/idle/failed periods; commissioning, replacement and retirement"
      site_scope: "Actual vessel and capture handoff sites; named recipient"
