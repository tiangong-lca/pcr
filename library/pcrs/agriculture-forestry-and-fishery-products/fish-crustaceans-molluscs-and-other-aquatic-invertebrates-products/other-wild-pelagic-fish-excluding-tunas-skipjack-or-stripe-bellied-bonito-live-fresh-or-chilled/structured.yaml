  calculation_rules:
    - id: lot_normalization
      applies_to: "all inventory rows"
      rule: "Retain the unallocated physical ledger and divide actual material transfers by positive accepted net fish mass A of that same lot. Apply evidenced allocation shares only to genuinely shared LCA burdens in the separate attribution view before dividing by A; do not scale species-specific physical fish transfers or use allocation to close mass. Final reference output is A/A = 1 kg. Preserve each numerator's native unit; aggregate compatible instances only."
      inputs:
        - cp_capture
        - cp_sort
        - cp_chill
        - cp_pack
        - cp_receipt
        - A
      output: "Native exchange quantity per 1 kg reference flow and separate unallocated physical ledger"
      source_ids:
        - accepted-lot-normalization
    - id: direct_releases
      applies_to: "all direct CO2 and other release cards"
      rule: "Use actual measured releases or activity times an explicitly identified factor with matching substance, medium, fuel/composition and unit; document oxidation/abatement/leakage and uncertainty. Apply lot_normalization only to direct releases owned by that node, excluding purchased full-service coverage."
      inputs:
        - "Node-specific protocol"
        - "measured release or activity and externally cited factor"
      output: "Substance/medium-specific release per reference flow"
      source_ids:
        - accepted-lot-normalization
