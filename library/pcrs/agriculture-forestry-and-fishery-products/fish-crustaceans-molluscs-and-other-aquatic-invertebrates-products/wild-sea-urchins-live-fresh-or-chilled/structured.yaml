      flow_role: "Actual physical support resources/emissions and service transfers"
      record_type: "Trip/resource/asset ledger"
      raw_fields: "instance/operator/site/equipment/service period; consuming process instance and paired service transfer/h; trip/period; fuel grades/stocks/purchases/returns; meters; air volume/conditions; components/assets/replacements/losses/retrieval/retirement; service h/coverage/consumers; pollutant/factor/substance/medium evidence"
      collection_method: "Reconcile calibrated weighing, trip and engine/compressor logs, meters, stock balances, service invoices and supplier/factor evidence; establish actual fuel factors before emissions calculation; retain unsuccessful trips and shared-event ownership"
      unit: "kg; MJ; m3; h by exchange"
      frequency: "Every trip/event and asset/service change"
      temporal_coverage: "Complete declared reporting period plus attributable asset phases"
      site_scope: "California harvest sites, vessel and necessary pre-gate shore support"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale/meter calibration; trip completeness; supplier/factor provenance; transfer and coverage matrix; independent U_instance approval"
    - protocol_id: cp_capture
      process_id: "hookah_capture"
      flow_role: "Wild collection, ecological records and actual support received"
      record_type: "Trip/capture/transfer ledger"
      raw_fields: "trip/period/site/species/origin; departure/search/dive/return times; hookah/rake/lift gear; removed/collected/returned/dead/incidental masses and status; habitat observations; transfer/destination; received support h and physical owner/instance; breathing-air volume/conditions"
      collection_method: "Reconcile calibrated catch weighing, dive/trip logs, complete unsuccessful trips and all ecological returns; pair actual physical support service input with support_out. Do not automatically encode whole animals as biomass resources or returned organisms as emissions."
      unit: "kg; h; operational m3"
      frequency: "Every trip and capture/return/service event"
      temporal_coverage: "Complete declared reporting period"
      site_scope: "Actual California marine capture trip"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; complete trip/return observations; matched physical service transfers; independently approved U_instance"
    - protocol_id: cp_sort
      process_id: "sort"
      flow_role: "Grade/destination classification"
      record_type: "Lot sorting ledger"
      raw_fields: "trip/period/lot/instance; entry mass/state/transfer; all grades/species/intended uses; live/dead/reject reasons; output mass/recipient/return/waste destination; stocks; actual sorting resources and unique owners; paired support service h/instance/operator/period"
      collection_method: "Weigh each physical destination on calibrated scales, record grade and status decisions and pair transfers; separate product, waste and environmental return; link actual resources to one owner"
      unit: "kg; h by exchange"
      frequency: "Every lot and sorting event"
      temporal_coverage: "All selected trip/batches and period"
      site_scope: "Actual vessel/landing sorting location"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; receiver/disposal/return record; complete output-set ledger; independently approved U_instance"
    - protocol_id: cp_prepare
      process_id: "prepare"
      flow_role: "Actual preparation or equipment cleaning"
      record_type: "Preparation event ledger"
      raw_fields: "instance/trip/period; animal versus equipment scope; activation/bypass; entry/exit states/masses/transfers; purchased water/materials/stocks; direct abstraction source; energy/service owner; paired support service h/instance/operator/period; reused-water transfer/quality; residues/effluent/composition/medium/destination; actual secondary output status"
      collection_method: "Record actual bounded cleaning method; calibrated material/water and animal weighing or metering with density conversion; pair transfers and distinguish managed effluent from direct discharge; equipment-only events do not invent animal passes"
      unit: "kg; h by exchange; energy native unit in linked owner ledger"
      frequency: "Every actual event"
      temporal_coverage: "Complete selected batches/period including cleaning/changeovers"
      site_scope: "Actual pre-gate preparation location"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; method and scope record; bypass/transfer trace; source/destination evidence; independent U_instance approval"
    - protocol_id: cp_holding
      process_id: "live_support"
      flow_role: "Live preservation by actual instance"
      record_type: "Holding/monitoring/water ledger"
      raw_fields: "instance/trip/period/lot; bin OR tank mode and actual sequence; entry/exit times/live state/mass/transfers; water source/intake/make-up/stocks/discharge; wetting/covering/cooling materials; energy meter; temperature/moisture/oxygenation measurements and actual operating controls; mortality/secondary product/waste/effluent composition/destination; habitat-return observations; reused-water transfer/quality; paired support service h/instance/operator/period"
      collection_method: "Observe actual system and calibrate meters/scales; log time and condition, supplier/abstraction identity, make-up and stock balance, animal status and all destinations; retain analytical/factor evidence for calculated pollutants"
      unit: "kg; MJ; h by exchange"
      frequency: "Every instance and intervention with recorded monitoring frequency"
      temporal_coverage: "Immediate post-capture through actual pre-gate holding end"
      site_scope: "Actual vessel or necessary shore holding location"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; operating logs; paired transfers; water/animal balance; source and receiving-medium evidence; independent U_instance approval"
    - protocol_id: cp_present
      process_id: "present"
      flow_role: "Product/package interface"
      record_type: "Packaging and custody ledger"
      raw_fields: "instance/lot/trip/period; incoming/protected live mass/state/transfers; material composition/count/unit mass; one-way/reusable stock and cycles; repair/reject/end-of-use/recipient custody; paired support service h/instance/operator/period; animal losses/status/destination"
      collection_method: "Weigh animals net of tare and inventory materials with measured count-mass conversions; record actual protective function, reuse, returns and end-of-use; link overlapping support resources once"
      unit: "kg; h by exchange"
      frequency: "Every presentation lot and material stock event"
      temporal_coverage: "Complete selected batches/period and relevant reuse periods"
      site_scope: "Actual pre-gate presentation location"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; stock/reuse evidence; custody/transfer records; independently approved U_instance"
    - protocol_id: cp_accept
      process_id: "accept"
      flow_role: "Delivery and first physical recipient gate"
      record_type: "Custody, freight and acceptance ledger"
      raw_fields: "lot/trip/period/recipient; dispatch/physical acceptance time/location; species/origin/hookah evidence; incoming/gross/tare/free-water/net accepted mass; live-state/grade decision; accepted/rejected/returned/secondary/stock mass and destination; freight mode/distance/load/tkm/provider coverage and empty legs; scale id/drainage method; paired support service h/instance/operator/period; secondary/technosphere-return transfer; habitat-return observations"
      collection_method: "Weigh accepted whole live animals on calibrated scales excluding packaging/free seawater; retain native test/spines/internal water/gonads. Pair receipt with physical gate and preceding transfers; reconcile freight and all non-accepted destinations independently of invoice/title"
      unit: "kg; tkm; h by exchange"
      frequency: "Every delivery/acceptance and rejection"
      temporal_coverage: "Full declared trip/batch reporting period"
      site_scope: "First physical recipient gate and attributable harvester delivery route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale calibration; custody/receipt/live-state evidence; tare/drainage record; full rejection/return ledger; provider coverage; independently approved U_instance"
  calculation_rules:
    - id: reconcile_ledgers
      applies_to: "all inventory rows"
      rule: "Balance animal states, material/water stocks and transfers in original measured units; account for returns, losses, other intended products and measurement uncertainty before attribution. After reviewed attribution divide each attributable quantity by eligible accepted net kg for per 1 kg reference flow. Internal output/input pairs cancel at system aggregation."
      inputs:
        - cp_support
        - cp_capture
        - cp_sort
        - cp_prepare
        - cp_holding
        - cp_present
        - cp_accept
        - "allocation decision"
      output: "Reconciled normalized quantities and balance residuals"
      source_ids: []
    - id: combustion_evidence
      applies_to: "direct_fossil_co2, collect_other_combustion"
      rule: "Multiply actual direct fuel consumption by a documented compatible fuel/engine/substance factor; preserve fuel basis and receiving medium. Retain factor identity/units, provenance and uncertainty in the foreground data package before calculation; no PCR default factor."
      inputs:
        - cp_support
        - "documented compatible factor"
      output: "Direct emission quantities and uncertainty"
      source_ids: []
  data_quality_requirements:
    - id: quality_route
      applies_to: "reference and capture"
      requirement: "Confirm species, California wild provenance and hookah route; unknown origin/gear or mixed outside-scope lots require segregation or review rather than a selected-route default."
      evidence: "Catch/site/gear records and physical recipient receipt"
    - id: quality_complete
      applies_to: "trips, nodes and outputs"
      requirement: "Include full representative periods, unsuccessful trips, shore support, activation/bypass, grade/destination sets, losses and stock changes; disclose measurement residuals and cut-offs."
      evidence: "Complete trip calendar, node-owned protocols and physical balances"
    - id: quality_ranges
      applies_to: "every card/instance"
      requirement: "Every 0..U requirement remains quantitatively unresolved until independent comparable evidence approves that concrete U_instance. Do not use a same-batch maximum or parent collection scope U as self-validation, observed interval, default estimate or publication-critical limit."
      evidence: "Independent evidence sample, applicability review and recorded approval"
    - id: quality_identity
      applies_to: "every exchange and support"
      requirement: "Resolve concrete exchange identities and property/unit relations before final downstream TIDAS exchanges; preserve semantic type, direction, geography/provider, gate and medium. Keep native service/volume units if supports remain unresolved."
      evidence: "Concrete detail/support verification and declared remaining gaps"
    - id: quality_period
      applies_to: "shared assets/services"
      requirement: "Retain commissioning, service, replacement, retirement, reuse and allocation evidence across consuming nodes/output sets/periods; disclose representative-period and provider coverage sensitivity."
      evidence: "Coverage matrix, asset/service ledger and attribution closure"
