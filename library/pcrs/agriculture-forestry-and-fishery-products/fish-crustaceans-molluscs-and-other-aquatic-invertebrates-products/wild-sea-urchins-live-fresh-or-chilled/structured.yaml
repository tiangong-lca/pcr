system_boundary:
  rules:
    - rule_id: boundary_trip
      applies_to: "capture and support"
      rule: "Include preparation/access, travel/search, diving, compressor and lifting operation, return journeys, failed trips, landing and necessary shore support before the acceptance gate. Capture is removal from wild habitat; it is independent of biological production and of later conditioning."
      source_ids:
        - wcsg-dive
    - rule_id: boundary_nodes
      applies_to: "sorting, preparation, preservation and presentation"
      rule: "These are responsibilities, not a mandated serial plant. Record actual instance timing, entry/exit state and transfer ids. Sorting receives whole collected animals and distinguishes reference-eligible, secondary intended, returned and rejected states. Preparation applies only bounded animal cleaning/preparation; equipment-only cleaning leaves animals on a bypass. Live support may start immediately and overlap sorting, presentation or delivery."
      source_ids: []
    - rule_id: boundary_live
      applies_to: "preservation"
      rule: "Record actual oxygenated-seawater tank OR wet-covered-bin holding instances and any proven sequence. Air compression/oxygenation is not purchased pure oxygen. No compulsory tank-plus-bin chain, fixed duration or safe temperature is prescribed. Record actual control limits and monitoring evidence."
      source_ids:
        - wcsg-dive
    - rule_id: boundary_gate
      applies_to: "acceptance"
      rule: "Include actual harvester delivery/landing support to first physical recipient acceptance and only its attributable burden. Opening, gonad extraction, processor activities and later distribution are outside. Rejected loads remain in the trip/period ledger with their actual return or disposal destination."
      source_ids: []
    - rule_id: boundary_support
      applies_to: "shared assets/services"
      rule: "Maintain one owner for each vessel, compressor, davit, bag, tank, bin, shore asset and shared energy/emission event; enumerate consuming nodes and periods. Inclusive purchased services replace their covered direct resources/emissions/capital rather than supplementing them. No arbitrary equipment lifetime or duplicate asset burden."
      source_ids: []
