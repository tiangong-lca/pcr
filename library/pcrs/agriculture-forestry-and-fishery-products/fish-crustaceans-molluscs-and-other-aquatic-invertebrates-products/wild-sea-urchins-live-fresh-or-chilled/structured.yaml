allocation_rules:
  - rule_id: allocation_reconcile
    applies_to: "complete trip/period"
    rule: "Reconcile natural removal, collected animals, returns, transfers, stock changes, mortality, waste and every actual intended species/grade output before assigning burdens. Live and dead states, reject reasons and destinations remain explicit. Test/spines/gonads retained in whole animals are not separate co-products."
    source_ids: []
  - rule_id: allocation_outputs
    applies_to: "multiple intended outputs"
    rule: "First subdivide independently measured operations and assign output-specific burdens directly. For remaining shared burdens, use documented causal activity drivers when defensible. Otherwise require a study-specific justified allocation choice and sensitivity, with measured output quantities and any contemporaneous prices retained; no universal economic or mass allocation factor is prescribed. Do not finalize while the choice or output set is unresolved."
    source_ids: []
  - rule_id: allocation_periods
    applies_to: "trips/assets/periods"
    rule: "Include unsuccessful trips in the full representative period rather than discarding zero-yield effort. Link assets, maintenance, replacement and retirement to actual service periods/consumers; document supported service-life and utilization assumptions and sensitivity. Shares across outputs, nodes and periods exhaust each attributable burden exactly once; do not assign acquisition in full and depreciate it again."
    source_ids: []
  - rule_id: allocation_service
    applies_to: "direct versus purchased support"
    rule: "Maintain a coverage matrix for each provider, vessel/compressor/davit/tank/bin/shore asset and service period. Replace the covered direct fuel, energy, emissions and capital with inclusive service burdens. Inventory internal transfers and resource stock movements for physical reconciliation without treating them as additional final outputs or new production."
    source_ids: []
