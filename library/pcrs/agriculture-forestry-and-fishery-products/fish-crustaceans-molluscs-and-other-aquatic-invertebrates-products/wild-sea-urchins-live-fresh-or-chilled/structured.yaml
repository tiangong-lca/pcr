validation_rules:
  - rule_id: validate_reference
    applies_to: "accepted_live_urchins"
    rule: "Require positive eligible accepted net mass, live whole state, species/provenance/hookah qualifiers and first physical recipient evidence. Confirm one final reference output; the 1..1 range is normalization identity rather than empirical yield."
    source_ids: []
  - rule_id: validate_transfers
    applies_to: "process graph"
    rule: "Check actual activation/bypass/timing and entry/exit state for every instance; pair measured internal transfers without imposing a tank/bin or other serial order. Every protocol owns its real node; shared events have one burden owner."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "full trips/periods"
    rule: "Close removal/collection/acceptance, water/material stock and intended-output ledgers before allocation. Do not omit failed trips, dead/reject/return destinations, incidental material, lost gear or attributable shore support. Environmental returns/releases are not managed waste or automatic credits."
    source_ids: []
  - rule_id: validate_attribution
    applies_to: "all intended outputs, assets and periods"
    rule: "Require explicit reviewed subdivision/driver/allocation decision when multiple intended outputs remain; close service coverage and asset-period shares exactly once. Unresolved replacement/retirement, coverage or allocation choices block dataset finalization."
    source_ids: []
  - rule_id: validate_identity_ranges
    applies_to: "concrete exchanges"
    rule: "Verify actual type/direction/gate/substance/medium/property/unit identity and approve independent instance-specific quantitative ranges. Semantic cards, unresolved U and a structural checker pass do not establish final data, active use or publication readiness."
    source_ids: []
  - rule_id: validate_atomic_completion
    applies_to: "all applicable collection requirements and concrete inventory exchanges"
    rule: "Resolve every applicable section-8 collection requirement into individual physical/chemical exchanges with their own quantities, native units, composition/state, range basis or explicit uncertainty evidence, raw records, normalization, actual destinations/receiving media and verified compatible UUIDs. Any unresolved applicable requirement makes the final dataset incomplete and validation fails; unknown is not zero. Never copy aggregate amounts onto components or duplicate inclusive services with owned fuel/electricity/direct releases. Internal transfers are not fixed to the final 1 kg."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground wild-capture data package normalized to accepted whole-live output"
  downstream_use: "secondary_dataset; background_dataset; downstream process and lifecyclemodel projection after identity and quantitative evidence closure"
  allowed_use: "Matching California hookah whole-live product at the declared first physical recipient gate with explicit period, support and allocation coverage"
  excluded_use: "Uni/shucking or processor inventories; other species/geographies/gear; cultivated/fattened products; culling-only or dead/frozen reference; automatic ecological-credit or safety certification claims"
  required_metadata: "PCR/version; taxonomy/site/wild origin; gear/vessel/support; complete trip/period set; actual process-instance graph; live state/holding; acceptance gate/net mass; intended outputs; suppliers/units; asset/service coverage and allocation"
  required_quality_disclosure: "Identity/support gaps; unresolved quantitative U; missing data/cut-offs; measured conversion and balance uncertainty; factor/provider/period representativeness; mortality/returns; shared allocation sensitivity"
  update_trigger: "Species/route/state/gate change; new holding or delivery arrangement; new support/factor evidence; output-set/asset/service-period change; identity or independent quantitative-evidence resolution"
