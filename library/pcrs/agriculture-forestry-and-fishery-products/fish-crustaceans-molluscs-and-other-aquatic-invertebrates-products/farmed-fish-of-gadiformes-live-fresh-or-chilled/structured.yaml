system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "cod_growout; cod_harvest; cod_sort; cod_live_delivery"
      rule: "Keep hatchery/nursery upstream on purchased juveniles. Foreground growout produces live fish in cages; independent harvest removes them alive; sorting separates accepted/downgraded/rejected destinations; preservation maintains live usability through wellboat delivery."
      source_ids:
        - fao-cod-2010
        - norcod-sea-route
    - rule_id: boundary_gate
      applies_to: "cod_live_delivery"
      rule: "End at evidenced live physical processor receipt before any bleeding, gutting or slaughter; missing live gate evidence cannot default to this reference."
      source_ids:
        - fao-cod-2010
        - cod-accounting-method
    - rule_id: boundary_support
      applies_to: "all inventory rows"
      rule: "Include actual growout equipment cleaning, support boats, harvest handling, live preservation and logistics. Do not invent a separate fish conditioning or product packaging operation for live tanks. Instantiate each actual support exchange at its consuming node."
      source_ids:
        - cod-accounting-method
    - rule_id: boundary_periods
      applies_to: "cod_growout; cod_harvest; cod_sort; cod_live_delivery"
      rule: "Index juvenile receipt, marine cohort growth, partial harvests, deliveries, fallow/cleaning, failures, asset replacement and termination across all relevant reporting years. Opening/closing cohort inventories carry burdens forward without repeated allocation."
      source_ids:
        - cod-accounting-method
    - rule_id: boundary_shared
      applies_to: "collect_growout_services; collect_harvest_services; collect_sort_services; collect_delivery_services"
      rule: "Maintain one shared ledger for cages/moorings, feeding systems, craft, wellboats and utilities, naming all consuming nodes, cohorts and service periods. Each node owns only its documented share; exclusive inclusive-provider and direct component ownership applies."
      source_ids:
        - cod-accounting-method
    - rule_id: boundary_generation
      applies_to: "growout_electricity; collect_growout_fuel; harvest_electricity; collect_harvest_fuel; sort_electricity; collect_sort_services; collect_sort_direct_releases; delivery_electricity; collect_delivery_fuel"
      rule: "For on-site generation inventoried with its fuel and direct emissions, generated electricity is an internal energy transfer only: do not add purchased-electricity upstream burdens. Purchased electricity includes its supplier generation upstream once. Meter and distinguish imports, self-generation and transfers, with one generator owner and explicit fuel/electricity boundaries."
      source_ids:
        - cod-accounting-method
    - rule_id: boundary_losses
      applies_to: "all inventory rows"
      rule: "Reconcile counts/biomass/feed with biological growth, intentional transfers, deaths, escapes and stocks; do not force juvenile mass to equal final mass. Ledger losses are not automatically waste or elementary exchanges. No ecological or nutrient-removal credit is assumed."
      source_ids:
        - cod-accounting-method
