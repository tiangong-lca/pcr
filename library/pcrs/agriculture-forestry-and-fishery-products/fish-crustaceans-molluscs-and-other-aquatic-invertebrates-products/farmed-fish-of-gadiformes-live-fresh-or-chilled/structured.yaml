validation_rules:
  - rule_id: validate_scope
    applies_to: "cod_processor_receipt"
    rule: "Reject wild-origin growout juveniles, other species/route, or fish slaughtered before receipt from this reference; require all qualifiers and upstream juvenile coverage."
    source_ids:
      - fao-cod-2010
      - cod-accounting-method
  - rule_id: validate_measurement
    applies_to: "all inventory rows"
    rule: "Verify same 1 kg accepted net live mass basis, native-unit conversions, lot-specific count samples, water/tare exclusions and node-owned collection links. Final 1..1 is normalization identity only."
    source_ids:
      - cod-accounting-method
  - rule_id: validate_outputs
    applies_to: "cod_sort; cod_live_delivery"
    rule: "Enumerate every grade/destination, accepted output, independently intended secondary product, return, reject and waste with handoff; reconcile transfers and prevent two final claims for one fish."
    source_ids:
      - cod-accounting-method
  - rule_id: validate_mode_period
    applies_to: "all inventory rows"
    rule: "Check actual cohort/batch and overlapping reporting periods, input/output/cleaning/changeover events, partial harvests, failed cycles and opening/closing burden carryover once."
    source_ids:
      - cod-accounting-method
  - rule_id: validate_shared
    applies_to: "collect_growout_services; collect_harvest_services; collect_sort_services; collect_delivery_services"
    rule: "Check every named asset/service consumer and period, causal driver, total shares, supported asset life/replacement and exclusive service/direct component ownership."
    source_ids:
      - cod-accounting-method
  - rule_id: validate_environment
    applies_to: "all elementary rows"
    rule: "Require actual substance and receiving medium/basis, distinguish direct fossil carbon from respiration, and avoid waste/constituent or service-emission duplication; ambient seawater exposure and lost biomass are not automatic elementary exchanges or credits."
    source_ids:
      - cod-accounting-method
  - rule_id: validate_ranges
    applies_to: "all inventory rows"
    rule: "Resolve independent U_instance bounds before treating ranges as empirical acceptance limits; missing quantity evidence or identities remains a gap even if structural checks pass."
    source_ids:
      - cod-accounting-method
  - rule_id: validate_atomic_completion
    applies_to: "all applicable collection requirements and concrete inventory exchanges"
    rule: "Resolve every applicable section-8 collection requirement into individual physical/chemical exchanges with their own quantities, native units, composition/state, range basis or explicit uncertainty evidence, raw records, normalization, actual destinations/receiving media and verified compatible UUIDs. Any unresolved applicable requirement makes the final dataset incomplete and validation fails; unknown is not zero. Never copy aggregate amounts onto components or duplicate inclusive services with owned fuel/electricity/direct releases. Internal transfers are not fixed to the final 1 kg."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Foreground package and downstream process/lifecyclemodel supply of Norwegian hatchery-origin cage-grown cod at live processor receipt before slaughter"
  allowed_use: "Matching species, route, live whole state, gate, geography and documented period/quality assumptions"
  excluded_use: "Wild capture or wild-juvenile fattening; other Gadiformes; wholly land-based growout; slaughtered/gutted/filleted/frozen fish; downstream slaughter/retail/cooking without added stages"
  required_metadata: "Reference qualifiers; node/transfer/cohort ledger; upstream hatchery/nursery and input coverage; native units; allocations; shared service ownership; periods/assets; actual range evidence"
  required_quality_disclosure: "Coverage and gaps; unresolved identities/ranges; meter/sample/factor uncertainty; losses/rejects; live acceptance; temporal/geographic applicability; upstream exclusions"
  update_trigger: "Route, seed origin, farm/feed/service technology, live gate, allocation, assets, periods, source/factor or data-quality change"
data_sources:
  - id: "fao-cod-2010"
    type: "official_guidance"
    reference: "Håkon Otterå, FAO Cultured Aquatic Species Information Programme: Gadus morhua, text updated 2010-11-26; https://www.fao.org/fishery/culturedspecies/gadus_morhua/en/en ; retrieved 2026-10-12"
    used_for: "Qualitative hatchery juvenile, marine cage and live wellboat-to-slaughterhouse route; no numeric defaults"
  - id: "norcod-sea-route"
    type: "literature"
    reference: "Norcod, The Snow Cod, https://www.norcod.com/the-snow-cod ; retrieved 2026-10-12; first-party company route account"
    used_for: "Qualitative hatchery/fry-to-sea corroboration only; no commercial sustainability claims, time/size/feed percentages or medicine defaults adopted"
  - id: "cod-accounting-method"
    type: "method_factor"
    reference: "This PCR, sections 3–9: declared selected gate and foreground accounting/measurement method"
    used_for: "Net live-mass normalization, conditional exchange/range resolution, node/cohort/period/service ownership and explicit attribution; not an external empirical factor or measured range"
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:fa200fe65d3a2ec36c832d5c55e5bcff0d2c67e9fd4530a07ea6a28aa33913cd"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_5282"
      family: "system_boundary"
      span:
        start:
          offset: 5282
          line: 58
          column: 1
        end:
          offset: 9198
          line: 83
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Purchased live Gadus morhua juveniles from identified hatchery and nursery suppliers at farm receipt, with complete upstream burdens |\n| starting_condition_role | Biological input boundary; not a burden-free origin |\n| product_classification_scope | Selected hatchery-origin marine-cage Atlantic cod route within CPC 04242; the leaf also covers excluded products |\n| recursive_input_rule | A same-category juvenile or live cod input retains species/state/gate and upstream dataset lineage; use a complete supplier dataset or explicit upstream submodel once, with cycle/duplicate checks |\n| upstream_dataset_requirement | Hatchery, nursery, feed, energy, consumables, services, assets and delivery inputs require geography/technology/state-compatible upstream coverage; missing coverage is a disclosed data gap |\n| disclosure | Declare actual hatchery origin, receipt gate, farm/cage/cohort and reporting years, service inclusions, asset boundaries, losses, stock carryover, allocations, uncertainty and all exclusions |\n\n### Boundary Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| boundary_route | cod_growout; cod_harvest; cod_sort; cod_live_delivery | Keep hatchery/nursery upstream on purchased juveniles. Foreground growout produces live fish in cages; independent harvest removes them alive; sorting separates accepted/downgraded/rejected destinations; preservation maintains live usability through wellboat delivery. | fao-cod-2010; norcod-sea-route |\n| boundary_gate | cod_live_delivery | End at evidenced live physical processor receipt before any bleeding, gutting or slaughter; missing live gate evidence cannot default to this reference. | fao-cod-2010; cod-accounting-method |\n| boundary_support | all inventory rows | Include actual growout equipment cleaning, support boats, harvest handling, live preservation and logistics. Do not invent a separate fish conditioning or product packaging operation for live tanks. Instantiate each actual support exchange at its consuming node. | cod-accounting-method |\n| boundary_periods | cod_growout; cod_harvest; cod_sort; cod_live_delivery | Index juvenile receipt, marine cohort growth, partial harvests, deliveries, fallow/cleaning, failures, asset replacement and termination across all relevant reporting years. Opening/closing cohort inventories carry burdens forward without repeated allocation. | cod-accounting-method |\n| boundary_shared | collect_growout_services; collect_harvest_services; collect_sort_services; collect_delivery_services | Maintain one shared ledger for cages/moorings, feeding systems, craft, wellboats and utilities, naming all consuming nodes, cohorts and service periods. Each node owns only its documented share; exclusive inclusive-provider and direct component ownership applies. | cod-accounting-method |\n| boundary_generation | growout_electricity; collect_growout_fuel; harvest_electricity; collect_harvest_fuel; sort_electricity; collect_sort_services; collect_sort_direct_releases; delivery_electricity; collect_delivery_fuel | For on-site generation inventoried with its fuel and direct emissions, generated electricity is an internal energy transfer only: do not add purchased-electricity upstream burdens. Purchased electricity includes its supplier generation upstream once. Meter and distinguish imports, self-generation and transfers, with one generator owner and explicit fuel/electricity boundaries. | cod-accounting-method |\n| boundary_losses | all inventory rows | Reconcile counts/biomass/feed with biological growth, intentional transfers, deaths, escapes and stocks; do not force juvenile mass to equal final mass. Ledger losses are not automatically waste or elementary exchanges. No ecological or nutrient-removal credit is assumed. | cod-accounting-method |\n\n"
