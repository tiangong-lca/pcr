allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "all inventory rows"
    rule: "First attribute independently metered inputs and events to their node, cohort, lot and period. For this live-cod route, unresolved common operating burdens are assigned by documented causal service usage (metered power, vessel hours, cage occupancy/biomass-time as supported); disclose the selected driver and alternatives."
    source_ids:
      - cod-accounting-method
  - rule_id: allocation_outputs
    applies_to: "collect_sort_secondary; collect_delivery_returns; cod_processor_receipt"
    rule: "Enumerate actual intended accepted grades, separately sold live downgraded fish and any other intentional outputs with physical handoffs. Use subdivision first; distribute remaining homogeneous live-cod joint burdens by accepted net live mass across intended sold grades, documenting why the mass driver fits this route. Different functions/states need a separate reviewed attribution decision. No default substitution credit."
    source_ids:
      - cod-accounting-method
  - rule_id: allocation_rejects
    applies_to: "collect_growout_waste; collect_harvest_waste; collect_sort_waste; collect_delivery_waste"
    rule: "Rejects, mortalities and wastes are not automatically co-products. Their accountable production and treatment burdens remain with the responsible cohort/output; returned live stock carries its assigned burden once and is not counted as final sold mass."
    source_ids:
      - cod-accounting-method
  - rule_id: allocation_period
    applies_to: "all inventory rows"
    rule: "Carry accumulated juvenile/growout burdens with surviving cohort stocks across year boundaries, assign partial harvests consistently and reconcile remaining stocks. Include failed cohorts, fallow support, cleaning and nonproductive services in the accountable ledger; disclose redistribution/terminal treatment rather than deleting them or allocating twice."
    source_ids:
      - cod-accounting-method
  - rule_id: allocation_assets
    applies_to: "collect_growout_services; collect_harvest_services; collect_sort_services; collect_delivery_services"
    rule: "Use actual asset inventories, supported service lives, maintenance/replacement and service-use shares across named consumers/periods; shares exhaust the included burden once. No default lifetime. Inclusive purchased services and explicit fuel/power/capital/direct-emission components are mutually exclusive."
    source_ids:
      - cod-accounting-method
dataset_production:
  collection_protocols:
    - protocol_id: cp_growout
      process_id: "cod_growout"
      flow_role: "Juveniles, feed, support inputs, grown biomass, wastes and releases"
      record_type: "Supplier, meter, cohort and emission records"
      raw_fields: "Species/origin; juvenile counts and sample mass; feed composition/moisture and stocks; cage/cohort/year; inputs; meters; asset/service id and shares; mortality/escapes; waste destinations; release species/medium and factor/model provenance"
      collection_method: "Reconcile purchase/feeding/stock records, calibrated meters and biomass samples; instantiate each conditional exchange separately; calculate substances only with compatible factors or measured concentrations/loads"
      unit: "kg; kWh; m3; each service native unit"
      frequency: "Every receipt, feeding/accounting period and event"
      temporal_coverage: "Full cohort and opening/closing periods including failed cycles"
      site_scope: "Named Norwegian farm, cages and suppliers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Invoices; calibrations; sampling; supplier coverage; asset ledger; model/factor uncertainty"
    - protocol_id: cp_harvest
      process_id: "cod_harvest"
      flow_role: "Removal, handling, fuel/services, collected live fish and losses"
      record_type: "Trip/event and transfer records"
      raw_fields: "Cohort; harvest event; transfer id; live entry/exit biomass/counts; fuel/power; service ownership; deaths/escapes; actual waste and direct-release species/medium"
      collection_method: "Pair cage-removal and sorting handoff records; meter actual owned inputs; retain incident and destination evidence"
      unit: "kg; kWh; each service native unit"
      frequency: "Every harvest trip/event"
      temporal_coverage: "All cohort harvests and failed removals in selected periods"
      site_scope: "Named cage and harvest craft"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Signed handoffs; scales; logs; service invoices; fuel/factor provenance"
    - protocol_id: cp_sort
      process_id: "cod_sort"
      flow_role: "Live grading, accepted, downgraded, return and reject states ; actual direct substance releases"
      record_type: "Lot/grade/destination records"
      raw_fields: "Input/output transfer ids; live state; every actual grade/threshold; net masses/count samples; destinations; power; consumables/services; discard treatment ; direct fuel/activity and chemical identity; receiving medium; elemental/compound and fossil/biogenic basis; measured load or compatible factor/model; supplier exclusions; separately inventoried emissions"
      collection_method: "Match incoming collected lots to all destination states; obtain actual grade criteria and independently measured inputs ; measure actual direct releases or calculate from compatible recorded activity/factors, keeping one sorting owner and excluding duplicate supplier/separate burdens"
      unit: "kg; kWh; each consumable/service native unit"
      frequency: "Every sorting lot and destination event"
      temporal_coverage: "All accepted/rejected lots across selected cohorts/years"
      site_scope: "Named sorting location and recipients"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Grade tickets; weighing/sampling; recipient acceptance; waste receipts ; release measurements/factor provenance and uncertainty"
    - protocol_id: cp_delivery
      process_id: "cod_live_delivery"
      flow_role: "Live preservation, voyage, owned inputs, service, returns, wastes and releases"
      record_type: "Loading, vessel, live-state and discharge records"
      raw_fields: "Lot; route/time; live loading/receipt; fuel/power/oxygen; actual water intake/reuse/return; temperature/oxygen observations; service inclusions; dead/rejected fish; discharge constituents/medium; equipment and cleaning events"
      collection_method: "Reconcile loading to physical receipt and losses; collect actual viability observations, meters and service inclusions; resolve individual conditional exchanges, with intake background separated from added loads"
      unit: "kg; kWh; m3; each service native unit"
      frequency: "Every loading, voyage, discharge and receipt"
      temporal_coverage: "Entire wellboat duty through first processor live receipt"
      site_scope: "Named vessel/route and receiving processor"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Voyage logs; live acceptance; meters; receipts; water sampling; factor/model provenance"
    - protocol_id: cp_acceptance
      process_id: "cod_live_delivery"
      flow_role: "Final live reference product"
      record_type: "Physical acceptance and calibrated weighing records"
      raw_fields: "Species; hatchery origin; cohort/lot; processor; time; live state before slaughter; gross fish/carrier mass; free water/tare; accepted net live mass; rejects; count/sample evidence where used"
      collection_method: "Weigh accepted whole live fish with calibrated equipment or reconcile traceable calibrated receipt weights; document water/tare removal and live state before slaughter, pairing loading and acceptance"
      unit: "kg"
      frequency: "Every physical receipt lot"
      temporal_coverage: "All final reference lots in selected cohort/period"
      site_scope: "First processor physical receiving gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; signed live receipt; tare checks; sample uncertainty; gate timestamps"
  calculation_rules:
    - id: same_reference_normalization
      applies_to: "all inventory rows"
      rule: "Divide each attributable actual exchange by accepted net live fish mass for the same accountable cohort/output scope; preserve raw native units and original quantities. Final reference equals accepted mass divided by that same accepted mass, not a yield estimate."
      inputs:
        - "Node protocols"
        - cp_acceptance
        - "attribution ledger"
      output: "Exchange amount per 1 kg reference flow"
      source_ids:
        - cod-accounting-method
    - id: cohort_reconciliation
      applies_to: "cod_growout; cod_harvest; cod_sort; cod_live_delivery"
      rule: "Reconcile opening stock, purchases, biological growth, internal transfers, closing stock, intended outputs, deaths and escapes; retain counts and biomass evidence separately. Biological growth prevents a simple juvenile-mass-equals-final-mass identity."
      inputs:
        - "Cohort/feed/transfer/acceptance and loss records"
      output: "Traceable stock and burden carryover without duplicate transfers"
      source_ids:
        - cod-accounting-method
    - id: direct_release_calculation
      applies_to: "collect_growout_aquatic; growout_fossil_co2; collect_growout_air; harvest_fossil_co2; collect_harvest_releases; collect_delivery_releases; delivery_fossil_co2; collect_delivery_air"
      rule: "Use compatible measured load/concentration-flow or documented fuel/feed substance-balance factors; retain substance, elemental/compound basis, medium, technology and uncertainty. Remove background and provider-inclusive overlap; no default release factor."
      inputs:
        - "Node activity"
        - measurements
        - "factor provenance"
        - "service ownership"
      output: "Individual actual substance loads on reference basis"
      source_ids:
        - cod-accounting-method
    - id: range_resolution
      applies_to: "all inventory rows"
      rule: "Except the final 1..1 normalization identity, 0..U_row denotes an unresolved screening evidence need, never an observed or accepted empirical bound. For every instantiated exchange approve a separate U_instance in its own property/native unit and record evidence, reviewer and scope; aggregate bounds cannot cover mixed exchanges."
      inputs:
        - "Actual exchange scope"
        - "node protocols"
        - "reviewed range evidence"
      output: "Independent replaceable screening limits, or explicitly unresolved evidence"
      source_ids:
        - cod-accounting-method
  data_quality_requirements:
    - id: quality_identity
      applies_to: "all inventory rows"
      requirement: "Match every actual exchange identity, state, gate, property, native unit, direction and destination; final dataset exchanges need verified concrete identities."
      evidence: "Supplier and receiving records; identity/support verification"
    - id: quality_completeness
      applies_to: "all inventory rows"
      requirement: "Retain all inputs, support, services, wastes, emissions, failures and opening/closing stocks over complete cohort and service periods. Missing values are gaps, never automatic zero."
      evidence: "Cohort reconciliation and node coverage ledger"
    - id: quality_uncertainty
      applies_to: "all inventory rows"
      requirement: "Disclose sampling, scale/meter, factor/model, temporal/geographic and upstream-data uncertainty. Every provisional upper bound remains unresolved until separately reviewed."
      evidence: "Calibration; samples; source applicability; uncertainty and bound decision records"
    - id: quality_live_gate
      applies_to: "cod_processor_receipt"
      requirement: "Confirm actual viable whole fish physically accepted before slaughter; record live-state failure, rejection and returns independently. No universal survival, shelf-life or food-safety guarantee."
      evidence: "Signed physical receipt, state observations and timestamps"
    - id: quality_translation
      applies_to: "all inventory rows"
      requirement: "Keep bilingual rules, card ids, units, quantities and source roles aligned with the canonical structured projection."
      evidence: "Paired text and projection comparison"
