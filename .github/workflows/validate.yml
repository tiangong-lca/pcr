name: Validate PCR library

on:
  workflow_call:
    inputs:
      product_tag:
        description: Unified product tag whose sealed artifacts this qualification must produce.
        type: string
        required: false
        default: ''
    outputs:
      product_artifact_id:
        description: Artifact ID containing the verified immutable product release bundle.
        value: ${{ jobs.documentation.outputs.product_artifact_id }}
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pcr-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI_EVENT_NAME: ${{ github.event_name }}
  CI_WORKFLOW_INPUTS: ${{ toJSON(inputs) }}
  CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
  CI_HEAD_SHA: ${{ github.sha }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      plan_artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version-file: .nvmrc
      - name: Classify the complete exact-source diff and freeze test membership
        id: plan
        run: |
          mkdir -p "$RUNNER_TEMP/pcr-plan"
          node scripts/engineering/ci-plan.ts plan "$RUNNER_TEMP/pcr-plan/ci.json"
          mode=$(jq -r '.mode' "$RUNNER_TEMP/pcr-plan/ci.json")
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [ "$mode" = full ]; then
            node scripts/engineering/qualification-plan.ts plan "$RUNNER_TEMP/pcr-plan/qualification.json"
          fi
      - name: Preserve the exact qualification plan
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pcr-qualification-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pcr-plan/
          if-no-files-found: error
          retention-days: 14

  contracts:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/pcr-docs/package-lock.json
      - name: Install the pinned validation toolchain
        run: |
          npm install --global npm@12.2.0 --ignore-scripts --no-audit --no-fund
          npm ci
          npm --prefix packages/pcr-docs ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.plan.outputs.plan_artifact_id }}
          path: ${{ runner.temp }}/pcr-plan
          merge-multiple: true
      - name: Initialize contract evidence
        run: |
          mkdir -p "$RUNNER_TEMP/pcr-content-contracts"
          printf 'Validation has not started.\n' > "$RUNNER_TEMP/pcr-content-contracts/validation.log"
      - name: Verify source and strict types
        run: |
          node scripts/engineering/ci-plan.ts verify "$RUNNER_TEMP/pcr-plan/ci.json"
          npm run runtime:check
          npm run migration:check
          npm run typecheck:all
      - name: Validate complete library contracts
        run: |
          evidence="$RUNNER_TEMP/pcr-content-contracts"
          mkdir -p "$evidence"
          if [ -e .reports/pcr-lint.json ] || [ -L .reports/pcr-lint.json ]; then
            printf 'Refusing a pre-existing lint report; validation did not run.\n' > "$evidence/validation.log"
            cat "$evidence/validation.log"
            exit 1
          fi
          set +e
          npm run lint > "$evidence/validation.log" 2>&1
          validation_status=$?
          set -e
          cat "$evidence/validation.log"
          if [ -f .reports/pcr-lint.json ] && [ ! -L .reports/pcr-lint.json ]; then
            cp .reports/pcr-lint.json "$evidence/pcr-lint.json"
          else
            printf 'Whole-library lint report was not produced; inspect the validation error above.\n' >> "$evidence/validation.log"
            if [ "$validation_status" -eq 0 ]; then validation_status=1; fi
          fi
          exit "$validation_status"
      - name: Verify changed canonical records
        run: node scripts/engineering/ci-content.ts "$RUNNER_TEMP/pcr-plan/ci.json" "$RUNNER_TEMP/pcr-content-contracts/selected-content.json"
      - name: Verify emitted TypeScript engineering tests
        if: needs.plan.outputs.mode == 'full'
        run: npm run test:engineering:compiled
      - name: Preserve content qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pcr-content-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pcr-content-contracts/
          if-no-files-found: error
          retention-days: 14

  test-shards:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [harness, core, builder, consumer, docs, engineering, corpus, general]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/pcr-docs/package-lock.json
      - name: Install pinned shard dependencies
        run: |
          npm install --global npm@12.2.0 --ignore-scripts --no-audit --no-fund
          npm ci
          npm --prefix packages/pcr-docs ci
      - name: Bind the actual pinned npm entry for direct shard children
        run: |
          npm_cli="$(readlink -f "$(command -v npm)")"
          test "$(node "$npm_cli" --version)" = "$(jq -r '.npm' product-release.json)"
          printf 'npm_execpath=%s\n' "$npm_cli" >> "$GITHUB_ENV"
      - name: Install browser runtimes for the consumer shard
        if: matrix.shard == 'consumer'
        run: node node_modules/playwright/cli.js install --with-deps chromium firefox webkit
      - name: Install PDF extraction for source-evidence tests
        if: matrix.shard == 'harness'
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.plan.outputs.plan_artifact_id }}
          path: ${{ runner.temp }}/pcr-plan
          merge-multiple: true
      - name: Execute exactly the frozen shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p "$RUNNER_TEMP/pcr-receipts"
          if [ "$SHARD" = corpus ]; then
            node scripts/engineering/qualification-plan.ts run "$RUNNER_TEMP/pcr-plan/qualification.json" "$SHARD" "$RUNNER_TEMP/pcr-receipts/$SHARD.json"
          else
            node scripts/engineering/coverage.ts collect "$RUNNER_TEMP/pcr-coverage" --qualification-plan "$RUNNER_TEMP/pcr-plan/qualification.json" --selection "$SHARD" -- node scripts/engineering/qualification-plan.ts run "$RUNNER_TEMP/pcr-plan/qualification.json" "$SHARD" "$RUNNER_TEMP/pcr-receipts/$SHARD.json"
          fi
      - name: Preserve exact shard execution receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pcr-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pcr-receipts/${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve isolated raw coverage inputs
        if: always() && matrix.shard != 'corpus'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pcr-coverage-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pcr-coverage/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve browser diagnostics
        if: always() && matrix.shard == 'consumer'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pcr-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: .reports/browser/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  web-build:
    needs: plan
    runs-on: ubuntu-latest
    # Instrumented full export runs here; EdgeOne only imports the sealed archive.
    timeout-minutes: 120
    outputs:
      web_artifact_id: ${{ steps.web-upload.outputs.artifact-id }}
      coverage_artifact_id: ${{ steps.documentation-coverage.outputs.artifact-id }}
    steps:
      - name: Check out complete source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The workspace source repository is private, so this job consumes the generated snapshot
      # instead of fetching a private action or holding a token. Check it before installing or
      # building: a snapshot that no longer matches its manifest must fail in seconds, not minutes.
      - name: Check the vendored shared SEO checker against its manifest
        run: |
          python3 - <<'PYVERIFY'
          import hashlib, json, re, sys
          from pathlib import Path

          folder = Path('scripts/vendor/workspace-seo')
          manifest = json.loads((folder / 'manifest.json').read_text())
          expected = {
              'schema': 1,
              'generated': True,
              'source_repository': 'tiangong-lca/workspace',
              'source_path': 'scripts/seo/check.py',
          }
          problems = [f'{key}={manifest.get(key)!r} but expected {value!r}' for key, value in expected.items() if manifest.get(key) != value]
          if not re.fullmatch(r'[0-9a-f]{40}', str(manifest.get('source_commit', ''))):
              problems.append(f"source_commit={manifest.get('source_commit')!r} is not a full lowercase commit")
          digest = hashlib.sha256((folder / 'check.py').read_bytes()).hexdigest()
          if manifest.get('sha256') != digest:
              problems.append(f"check.py sha256={digest} but the manifest records {manifest.get('sha256')!r}")
          if problems:
              sys.exit('Vendored SEO checker snapshot does not match its manifest: ' + '; '.join(problems))
          print(f"local snapshot bytes match the manifest for {manifest['source_repository']}@{manifest['source_commit']} ({digest})")
          print('manifest identity is a local integrity statement only; origin provenance is attested by the workspace export against the private source commit')
          PYVERIFY
      - name: Set up production documentation runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/pcr-docs/package-lock.json
      - name: Select the pinned product packaging toolchain
        run: npm install --global npm@12.2.0 --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci && npm --prefix packages/pcr-docs ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.plan.outputs.plan_artifact_id }}
          path: ${{ runner.temp }}/pcr-plan
          merge-multiple: true
      - name: Identify the clean artifact candidate
        id: candidate
        run: node builder/scripts/product-release.ts identity
      - name: Build and verify the full static library
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          PCR_BUILD_RELOCATE: '1'
          PCR_EDGEONE_PREBUILT_ASSETS: '1'
          # Public ownership markers already served by the production site.
          PCR_GOOGLE_SITE_VERIFICATION: 4W5GYY5tOwicaRGTZr7AdfJ4VB8KB87r2ex-rZxP-fM
          PCR_BAIDU_SITE_VERIFICATION: codeva-IJKQ9SxWkZ
        run: |
          set -euo pipefail
          node scripts/engineering/ci-plan.ts verify "$RUNNER_TEMP/pcr-plan/ci.json"
          if [ "${{ needs.plan.outputs.mode }}" = full ]; then
            node scripts/engineering/coverage.ts collect "$RUNNER_TEMP/pcr-documentation-coverage" --qualification-plan "$RUNNER_TEMP/pcr-plan/qualification.json" --selection documentation -- npm --prefix packages/pcr-docs run build 2>&1 | tee "$RUNNER_TEMP/pcr-web-build.log"
          else
            npm --prefix packages/pcr-docs run build 2>&1 | tee "$RUNNER_TEMP/pcr-web-build.log"
          fi
      - name: Preserve exact full-build coverage inputs
        id: documentation-coverage
        if: always() && needs.plan.outputs.mode == 'full'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pcr-documentation-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pcr-documentation-coverage/
          if-no-files-found: error
          retention-days: 14
      - name: Freeze the complete verified web handoff
        run: node builder/scripts/product-web-build-artifact.ts create "$RUNNER_TEMP/pcr-plan" packages/pcr-docs/out "$RUNNER_TEMP/pcr-web-build.log" "$RUNNER_TEMP/pcr-web-build"
      - name: Preserve the immutable full web build
        id: web-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pcr-web-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pcr-web-build/
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  documentation:
    needs: [plan, web-build]
    runs-on: ubuntu-latest
    # Sealing consumes the exact verified web export; it never rebuilds Next.
    timeout-minutes: 120
    outputs:
      product_artifact_id: ${{ steps.product-upload.outputs.artifact-id }}
      coverage_artifact_id: ${{ needs.web-build.outputs.coverage_artifact_id }}
    steps:
      - name: Check out the same complete source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Select the pinned product packaging toolchain
        run: npm install --global npm@12.2.0 --ignore-scripts --no-audit --no-fund
      - name: Install locked product tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.plan.outputs.plan_artifact_id }}
          path: ${{ runner.temp }}/pcr-plan
          merge-multiple: true
          digest-mismatch: error
      - name: Download the exact verified web build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.web-build.outputs.web_artifact_id }}
          path: ${{ runner.temp }}/pcr-web-build
          merge-multiple: true
          digest-mismatch: error
      - name: Identify the clean artifact candidate
        id: candidate
        run: node builder/scripts/product-release.ts identity
      - name: Verify and materialize the same-source web build
        run: node builder/scripts/product-web-build-artifact.ts materialize "$RUNNER_TEMP/pcr-plan" "$RUNNER_TEMP/pcr-web-build" "$RUNNER_TEMP/pcr-materialized-web"
      - name: Verify shared SEO invariants on the materialized build
        run: node builder/scripts/product-web-build-artifact.ts accept "$RUNNER_TEMP/pcr-plan" "$RUNNER_TEMP/pcr-web-build" "$RUNNER_TEMP/pcr-materialized-web" "$RUNNER_TEMP/pcr-seo-report.json" "$RUNNER_TEMP/pcr-web-acceptance.json"
      - name: Preserve SEO verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pcr-seo-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pcr-seo-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Build and verify the two packages and sealed web artifact
        env:
          PRODUCT_TAG: ${{ inputs.product_tag || steps.candidate.outputs.tag }}
        run: npm run product:build -- "$PRODUCT_TAG" dist/product-release "$RUNNER_TEMP/pcr-materialized-web"
      - name: Bind sealed product to complete web and SEO evidence
        run: node builder/scripts/product-web-build-artifact.ts bind-product "$RUNNER_TEMP/pcr-plan" "$RUNNER_TEMP/pcr-web-build" "$RUNNER_TEMP/pcr-web-acceptance.json" "$RUNNER_TEMP/pcr-seo-report.json" dist/product-release
      - name: Preserve the exact product bundle for qualification and publication
        id: product-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pcr-product-${{ steps.candidate.outputs.tag }}-${{ github.sha }}
          path: |
            dist/product-release/release.json
            dist/product-release/SHA256SUMS
            dist/product-release/*.tgz
            dist/product-release/*.tar.gz
            dist/product-release/*.sqlite
            dist/product-release/*.sqlite.json
            dist/product-release/web-build-handoff.json
            dist/product-release/web-build.log
            dist/product-release/web-seo.json
            dist/product-release/web-build-acceptance.json
          if-no-files-found: error
          retention-days: ${{ inputs.product_tag != '' && 30 || 7 }}

  offline-distribution:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: windows-latest
            arch: x64
          - os: macos-latest
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Configure exact-byte Windows checkout and long paths
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Select the pinned offline package manager
        run: npm install --global npm@12.2.0 --ignore-scripts --no-audit --no-fund
      - name: Install locked build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify pinned runtime and runner architecture
        env:
          PCR_EXPECTED_ARCH: ${{ matrix.arch }}
        run: npm run runtime:release
      - name: Typecheck portable Node and Viewer projects
        run: npm run typecheck:node
      - name: Verify compact real offline distribution and reproducibility
        run: npm run test:offline:portable


  sealed-distribution:
    needs: documentation
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: windows-latest
            arch: x64
          - os: macos-latest
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Configure exact Windows source checkout
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Select pinned package manager
        run: npm install --global npm@12.2.0 --ignore-scripts --no-audit --no-fund
      - name: Install qualification tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download the one sealed candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.documentation.outputs.product_artifact_id }}
          path: ${{ runner.temp }}/pcr-sealed-product
          merge-multiple: true
      - name: Qualify real offline installation of the sealed packages
        env:
          PCR_EXPECTED_ARCH: ${{ matrix.arch }}
        run: npm run qualify:sealed -- --bundle "${{ runner.temp }}/pcr-sealed-product" --expected-source "${{ github.sha }}" --report "${{ runner.temp }}/pcr-sealed-consumer"
      - name: Preserve installed artifact evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pcr-sealed-${{ matrix.os }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pcr-sealed-consumer/
          if-no-files-found: warn
          retention-days: 14

  sealed-web:
    needs: documentation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned qualification tools
        run: |
          npm install --global npm@12.2.0 --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/playwright/cli.js install --with-deps chromium firefox webkit
      - name: Download the same sealed candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.documentation.outputs.product_artifact_id }}
          path: ${{ runner.temp }}/pcr-sealed-product
          merge-multiple: true
      - name: Qualify browsers against extracted sealed bytes
        run: npm run qualify:web -- --bundle "${{ runner.temp }}/pcr-sealed-product" --expected-source "${{ github.sha }}" --report "${{ runner.temp }}/pcr-sealed-web"
      - name: Preserve extracted web and browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pcr-sealed-web-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pcr-sealed-web/
          if-no-files-found: warn
          retention-days: 14


  provider-importer:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the provider import runtime separately from the build pin
        id: provider
        run: echo "node=$(jq -r '.nodeVersion' edgeone.json)" >> "$GITHUB_OUTPUT"
      - name: Set up the real artifact construction runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version-file: .nvmrc
      - name: Preserve the artifact producer executable across the runtime switch
        id: producer
        run: echo "node-exec=$(command -v node)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.provider.outputs.node }}
          cache: npm
      - name: Select the pinned test dependency installer
        run: npm install --global npm@12.2.0 --ignore-scripts --no-audit --no-fund
      - name: Install locked importer test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Qualify sealed import on the actual provider Node runtime
        env:
          PCR_TEST_PRODUCER_NODE_EXEC: ${{ steps.producer.outputs.node-exec }}
        run: |
          test "$(node --version)" = "v$(jq -r '.nodeVersion' edgeone.json)"
          node --test builder/scripts/product-web-materialize.test.ts packages/pcr-docs/scripts/hosting-contract.test.ts

  source-coverage:
    needs: [plan, test-shards, documentation]
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned measurement dependencies
        run: |
          npm install --global npm@12.2.0 --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix packages/pcr-docs ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.plan.outputs.plan_artifact_id }}
          path: ${{ runner.temp }}/pcr-plan
          merge-multiple: true
      - name: Download every receipt without flattening shard directories
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pcr-shard-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pcr-receipts
      - name: Download isolated current-invocation raw measurements
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pcr-coverage-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pcr-measurements
      - name: Download exact full-build measurement
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.documentation.outputs.coverage_artifact_id }}
          path: ${{ runner.temp }}/pcr-documentation-coverage
          merge-multiple: true
      - name: Enforce complete shard membership and source-accounted coverage
        run: node scripts/engineering/coverage-ci.ts "$RUNNER_TEMP/pcr-plan/qualification.json" "$RUNNER_TEMP/pcr-receipts" "$RUNNER_TEMP/pcr-measurements" "$RUNNER_TEMP/pcr-documentation-coverage" "$RUNNER_TEMP/pcr-coverage-report"
      - name: Preserve coverage and rejection evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pcr-source-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pcr-coverage-report/
          if-no-files-found: error
          retention-days: 30

  validate:
    if: always()
    needs: [plan, contracts, test-shards, web-build, documentation, offline-distribution, provider-importer, sealed-distribution, sealed-web, source-coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.plan.outputs.plan_artifact_id }}
          path: ${{ runner.temp }}/pcr-plan
          merge-multiple: true
      - name: Enforce the selected lane without hiding missing or failed jobs
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/engineering/ci-gate.ts "$RUNNER_TEMP/pcr-plan/ci.json"
